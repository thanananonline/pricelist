// sessionStorage (not localStorage) is intentional: it's wiped whenever the
// browser/all tabs close, so re-opening the site always requires a fresh
// login, while a plain page refresh within the same tab still stays logged in.
function getSessionToken() {
  try { return sessionStorage.getItem("pricelistToken") || ""; } catch (e) { return ""; }
}
function saveSessionToken(token) {
  try { sessionStorage.setItem("pricelistToken", token); } catch (e) {}
}
function clearSessionToken() {
  try { sessionStorage.removeItem("pricelistToken"); } catch (e) {}
}

// Same idle timeout on phone and desktop: 30 minutes with no activity forces
// a fresh login, regardless of the token's own (much longer) server-side TTL.
var SESSION_IDLE_LIMIT_MS = 30 * 60 * 1000;
function getLastActivity() {
  try { return parseInt(sessionStorage.getItem("pricelistLastActivity"), 10) || 0; } catch (e) { return 0; }
}
function saveLastActivity(ts) {
  try { sessionStorage.setItem("pricelistLastActivity", String(ts)); } catch (e) {}
}
function clearLastActivity() {
  try { sessionStorage.removeItem("pricelistLastActivity"); } catch (e) {}
}

// Registered once by the Dashboard instance so any authenticated request
// that comes back 401 (bad token, or a since-deleted/edited user re-checked
// server-side) forces a logout with an explanation, no matter which call
// site triggered it.
var _sessionExpiredCallback = null;
function onApiSessionExpired(cb) { _sessionExpiredCallback = cb; }

function apiRequest(path, opts) {
  opts = opts || {};
  var headers = Object.assign({}, opts.headers || {});
  if (!opts.formData) headers["Content-Type"] = "application/json";
  if (opts.auth) {
    var token = getSessionToken();
    if (token) headers["Authorization"] = "Bearer " + token;
  }
  var body = opts.formData ? opts.formData : (opts.body ? JSON.stringify(opts.body) : undefined);
  return fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: headers,
    body: body,
  }).then(function (res) {
    if (!res.ok) {
      return res.json().catch(function () { return {}; }).then(function (errBody) {
        var err = new Error(errBody.error || ("HTTP " + res.status));
        err.status = res.status;
        if (res.status === 401 && opts.auth && _sessionExpiredCallback) _sessionExpiredCallback();
        throw err;
      });
    }
    return res.json();
  });
}

function esc(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function resizeImageFile(file, maxDim, quality, callback) {
  var reader = new FileReader();
  reader.onload = function () {
    var image = new Image();
    image.onload = function () {
      var w = image.width, h = image.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(image, 0, 0, cw, ch);
      try {
        callback(canvas.toDataURL("image/jpeg", quality));
      } catch (e) {
        callback(reader.result);
      }
    };
    image.onerror = function () { callback(reader.result); };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

Dashboard.prototype.restoreSession = function (attempt) {
  var self = this;
  attempt = attempt || 0;
  apiRequest("/auth/me", { auth: true }).then(function (res) {
    self.markActivity();
    self.setState({ loggedIn: true, checkingSession: false, username: res.username, role: res.role });
    self.loadUsers();
  }).catch(function (err) {
    // A genuine 401 (bad/expired token, or the account no longer exists) is
    // already handled by handleSessionExpired via the apiRequest hook.
    // A network blip, worker cold start, etc. must not throw away an
    // otherwise-valid saved session -- retry a couple of times first.
    if (err.status !== 401 && attempt < 2) {
      setTimeout(function () { self.restoreSession(attempt + 1); }, 1500);
      return;
    }
    if (err.status !== 401) {
      self.setState({ loggedIn: false, checkingSession: false });
    }
  });
};

// Central handler for any authenticated request coming back 401: the token
// is invalid/expired, or D1 no longer has the user (deleted, or role/password
// changed elsewhere). Forces a fresh login and explains why.
Dashboard.prototype.handleSessionExpired = function () {
  clearSessionToken();
  clearLastActivity();
  this.setState({
    loggedIn: false, checkingSession: false, username: "", role: "", password: "",
    users: [],
    authError: "เซสชันหมดอายุหรือบัญชีนี้ถูกยกเลิก กรุณาเข้าสู่ระบบใหม่",
  });
};

// Any interaction resets the idle clock; a background timer forces logout
// once 30 minutes pass without one, on both mobile and desktop browsers.
Dashboard.prototype.markActivity = function () {
  var now = Date.now();
  if (now - (this._lastActivityWrite || 0) < 5000) return;
  this._lastActivityWrite = now;
  saveLastActivity(now);
};

Dashboard.prototype._bindActivityTracking = function () {
  var self = this;
  ["click", "keydown", "touchstart", "scroll", "mousemove"].forEach(function (evt) {
    document.addEventListener(evt, function () {
      if (self.state.loggedIn) self.markActivity();
    }, { passive: true });
  });
  setInterval(function () { self._checkIdleTimeout(); }, 30 * 1000);
};

Dashboard.prototype._checkIdleTimeout = function () {
  if (!this.state.loggedIn) return;
  if (Date.now() - getLastActivity() > SESSION_IDLE_LIMIT_MS) {
    clearSessionToken();
    clearLastActivity();
    this.setState({
      loggedIn: false, username: "", role: "", password: "",
      users: [],
      authError: "ไม่ได้ใช้งานเกิน 30 นาที กรุณาเข้าสู่ระบบใหม่",
    });
  }
};

Dashboard.prototype.loadFolders = function (kind) {
  var k = this._folderKeys(kind);
  var self = this;
  self.state[k.loadingKey] = true;
  apiRequest("/folders?kind=" + encodeURIComponent(kind)).then(function (folders) {
    var patch = {};
    patch[k.stateKey] = folders;
    patch[k.loadingKey] = false;
    patch[k.errorKey] = "";
    // "company" has no folder-picker UI -- it always works against a single,
    // implicit folder, so just activate whichever one already exists.
    if (kind === "company" && folders.length) patch[k.activeKey] = folders[0].id;
    self.setState(patch);
  }).catch(function () {
    var patch = {};
    patch[k.loadingKey] = false;
    patch[k.errorKey] = "โหลดข้อมูลโฟลเดอร์ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่";
    self.setState(patch);
  });
};

Dashboard.prototype.savePipeEdit = function (id) {
  var s = this.state;
  var listExvat = parseFloat(s.pipeEditListExvat);
  var listIncvat = parseFloat(s.pipeEditListIncvat);
  if (isNaN(listExvat) || isNaN(listIncvat)) {
    this.showToast("กรุณากรอกราคาตั้งให้ถูกต้อง", "error");
    return;
  }
  var discounts = [];
  for (var i = 0; i < s.pipeEditRows.length; i++) {
    var r = s.pipeEditRows[i];
    var exvat = parseFloat(r.exvat);
    var incvat = parseFloat(r.incvat);
    if (isNaN(exvat) || isNaN(incvat)) {
      this.showToast("กรุณากรอกราคาส่วนลดทุกช่องให้ถูกต้อง", "error");
      return;
    }
    discounts.push({ percent: r.percent, exvat: exvat, incvat: incvat });
  }
  var self = this;
  apiRequest("/pipe-products/" + encodeURIComponent(id), {
    method: "PUT", auth: true,
    body: { listExvat: listExvat, listIncvat: listIncvat, discounts: discounts },
  }).then(function (updated) {
    self.setState(function (s2) {
      var pipeProducts = s2.pipeProducts.map(function (p) { return p.id === id ? updated : p; });
      return { pipeProducts: pipeProducts, pipeEditingId: null, pipeEditRows: [] };
    });
    self.showToast("บันทึกราคาสำเร็จ");
  }).catch(function (err) {
    self.showToast("บันทึกไม่สำเร็จ: " + err.message, "error");
  });
};

Dashboard.prototype.setState = function (patch) {
  clearTimeout(this._renderTimer);
  Object.assign(this.state, typeof patch === "function" ? patch(this.state) : patch);
  this.render();
};

Dashboard.prototype.showToast = function (message, type) {
  clearTimeout(this._toastTimer);
  var self = this;
  this.setState({ toast: { message: message, type: type || "success" } });
  this._toastTimer = setTimeout(function () {
    self.setState({ toast: null });
  }, 3000);
};

Dashboard.prototype.handleClick = function (e) {
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;
  var d = t.dataset;
  switch (action) {
    case "logout": this.onLogout(); break;
    case "nav":
      // "company" has no folder-list step - it's a single implicit folder,
      // so its "active folder" IS the home view and must not be reset.
      var navFolderKeys = d.page === "company" ? null : this._folderKeys(d.page);
      this.setState(function (s2) {
        var patch = { page: d.page };
        // Clicking a sidebar tab should always land on that page's home
        // view, not wherever the user last drilled into (e.g. an open
        // folder) - so reset any folder navigation for the target page.
        if (navFolderKeys) {
          patch[navFolderKeys.activeKey] = null;
          patch[navFolderKeys.searchKey] = "";
        }
        // On the mobile drawer, picking a page should also close it; on the
        // desktop rail, leave the open/closed choice as the user set it.
        if (window.innerWidth <= 700) patch.sidebarOpen = false;
        return patch;
      });
      break;
    case "toggle-sidebar": this.setState(function (s2) { return { sidebarOpen: !s2.sidebarOpen }; }); break;
    case "close-sidebar": this.setState({ sidebarOpen: false }); break;
    case "set-view": this.setState({ view: d.view }); break;
    case "clear-field":
      var fieldKey = d.field;
      var fieldPatch = {};
      fieldPatch[fieldKey] = "";
      this.setState(fieldPatch);
      var fieldEl = this.root.querySelector("#field-" + fieldKey);
      if (fieldEl) fieldEl.focus();
      break;
    case "set-category": this.setState({ category: d.category }); break;
    case "toggle-cat-sidebar": this.setState(function (s2) { return { catSidebarCollapsed: !s2.catSidebarCollapsed }; }); break;
    case "toggle-calc-sidebar": this.setState(function (s2) { return { calcSidebarCollapsed: !s2.calcSidebarCollapsed }; }); break;
    case "toggle-discount-sidebar": this.setState(function (s2) { return { discountSidebarCollapsed: !s2.discountSidebarCollapsed }; }); break;
    case "calc-set-type": this.setState({ page: "calc", calcProductType: d.type }); break;
    case "pipe-set-type": this.setState({ pipeSelectedType: d.type, pipeSelectedSize: "", pipeEditingId: null }); break;
    case "pipe-set-size": this.setState({ pipeSelectedSize: d.size, pipeEditingId: null }); break;
    case "reload-pipe-products": this.loadPipeProducts(); break;
    case "start-edit-pipe": this.startPipeEdit(d.id); break;
    case "cancel-edit-pipe": this.setState({ pipeEditingId: null, pipeEditRows: [] }); break;
    case "save-edit-pipe": this.savePipeEdit(d.id); break;
    case "discount-set-category":

      if (d.category === "pile_i") discountCategoryPatch.pileGroup = "I";
      else if (d.category === "pile_sq") discountCategoryPatch.pileGroup = "SQ";
      else if (d.category === "pile_hex") discountCategoryPatch.pileGroup = "HEX";
      this.setState(discountCategoryPatch);
      break;
    case "reload-concrete-mix-products": this.loadConcreteMixProducts(); break;
    case "start-edit-concrete-mix": this.startConcreteMixEdit(d.id); break;

};

// Pure trailing-edge debounce: always wait for a pause in typing before
// re-rendering. Forcing a render mid-keystroke (as an earlier version of
// this did after 500ms of continuous typing) tears down and recreates the
// focused input while the user is still actively typing, which is exactly
// when losing/misplacing the cursor is most noticeable.
Dashboard.prototype._scheduleRender = function (fn) {
  var self = this;
  clearTimeout(this._renderTimer);
  this._renderTimer = setTimeout(function () {
    fn.call(self);
  }, 150);
};

Dashboard.prototype.handleFieldChange = function (e) {
  var rowEl = e.target.closest("[data-calc-row]");
  if (rowEl) {
    var idx = parseInt(rowEl.dataset.calcRow, 10);
    var field = rowEl.dataset.calcField;
    var storeKey = rowEl.dataset.calcStore || "calcRows";
    this.state[storeKey][idx][field] = rowEl.value;
    this._scheduleRender(storeKey === "pipeEditRows" ? this.renderPipeOnly : (storeKey === "plankEditRows" ? this.renderPlankOnly : this.renderCalcOnly));
    return;
  }
  var el = e.target.closest("[data-bind]");
  if (!el || el.type === "file") return;
  var key = el.dataset.bind;
  this.state[key] = el.value;
  if (el.dataset.clear) this.state[el.dataset.clear] = "";
  // Same reasoning as the login screen below: a full re-render while typing
  // tears down and recreates this input, jumping the cursor/keyboard. The
  // input already shows what was typed, so nothing needs to re-render until
  // Save/Cancel is clicked.
  if (key === "editFolderName" || key === "editFileName") return;
  if (!this.state.loggedIn) {
    // Never rebuild the DOM while typing on the login screen: even a
    // synchronous re-render tears down and recreates the input, which is
    // what causes the on-screen keyboard to stutter/jump on mobile. Just
    // keep state in sync and hide any stale error message directly.
    if (el.dataset.clear) {
      var errEl = this.root.querySelector("#auth-error-box");
      if (errEl) errEl.style.display = "none";
    }
    return;
  }
  var isCalcField = key.indexOf("calc") === 0;
  var isPipeEditField = key.indexOf("pipeEdit") === 0;
  var isPlankEditField = key.indexOf("plankEdit") === 0;
  this._scheduleRender(isCalcField ? this.renderCalcOnly : (isPipeEditField ? this.renderPipeOnly : (isPlankEditField ? this.renderPlankOnly : this.render)));
};

// Field selector shared by every fillable input/select across the app --
// price fields, form fields, and calculator table cells alike -- so Enter
// and Left/Right arrow navigation (below) works everywhere, not just the
// calculator table it originally shipped for.
var NAV_FIELD_SELECTOR = "[data-bind], [data-calc-row]";

Dashboard.prototype._navFields = function () {
  return Array.prototype.filter.call(
    this.root.querySelectorAll(NAV_FIELD_SELECTOR),
    function (el) { return !el.disabled && el.offsetParent !== null; }
  );
};

Dashboard.prototype.handleFieldNavKeyDown = function (e) {
  var key = e.key;
  if (key !== "Enter" && key !== "ArrowLeft" && key !== "ArrowRight") return;
  var el = e.target;
  if (!el || !el.matches || !el.matches(NAV_FIELD_SELECTOR)) return;
  if (el.tagName !== "INPUT" && el.tagName !== "SELECT") return;

  var isArrow = key !== "Enter";
  if (isArrow) {
    // Leave <select> arrow keys alone (natively used to change the value),
    // and only hijack a text field's arrows when the caret already sits at
    // the very start/end with nothing selected -- so normal in-field cursor
    // movement and text selection keep working everywhere else.
    if (el.tagName !== "INPUT") return;
    var pos = el.selectionStart, endPos = el.selectionEnd;
    if (pos == null || pos !== endPos) return;
    if (key === "ArrowLeft" && pos !== 0) return;
    if (key === "ArrowRight" && pos !== el.value.length) return;
  }

  var fields = this._navFields();
  var idx = fields.indexOf(el);
  if (idx === -1) return;
  var targetIdx = key === "ArrowLeft" ? idx - 1 : idx + 1;
  // No field in that direction: let the browser do its default thing
  // instead (e.g. Enter submitting the form the last field belongs to).
  if (targetIdx < 0 || targetIdx >= fields.length) return;

  e.preventDefault();
  var next = fields[targetIdx];
  next.focus();
  if (isArrow && next.tagName === "INPUT") {
    var caret = key === "ArrowLeft" ? next.value.length : 0;
    try { next.setSelectionRange(caret, caret); } catch (err) {}
  }
};

Dashboard.prototype.handleChange = function (e) {
  if (e.target.type === "file" && e.target.dataset.action === "upload-file") {
    var kind = e.target.dataset.kind;
    if (e.target.files && e.target.files.length) {
      if (kind === "company") this.uploadCompanyFiles(e.target.files);
      else this.uploadFiles(kind, e.target.files);
    }
    e.target.value = "";
    return;
  }
  if (e.target.type === "file" && e.target.dataset.action === "upload-new-prod-image") {
    var file2 = e.target.files && e.target.files[0];
    if (file2) this.uploadProductImage(file2, "newProdImage");
    e.target.value = "";
    return;
  }
  if (e.target.type === "file" && e.target.dataset.action === "upload-edit-image") {
    var file3 = e.target.files && e.target.files[0];
    if (file3) this.uploadProductImage(file3, "editImage");
    e.target.value = "";
    return;
  }
  if (e.target.type === "file" && e.target.dataset.action === "import-excel") {
    var file4 = e.target.files && e.target.files[0];
    if (file4) this.importExcelFile(file4);
    e.target.value = "";
    return;
  }
  this.handleFieldChange(e);
};

Dashboard.prototype.getMergedProducts = function () {
  return this.state.products;

Dashboard.prototype.computeProducts = function () {
  var s = this.state;
  var queryTerms = s.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var withOverrides = this.getMergedProducts();

  var list = withOverrides.filter(function (p) {
    var matchesCat = s.category === "all" || p.cat === s.category;
    var haystack = (p.name + " " + p.sku).toLowerCase();
    var matchesQ = !queryTerms.length || queryTerms.every(function (term) { return haystack.indexOf(term) !== -1; });
    return matchesCat && matchesQ;
  });

  if (s.sortBy === "name") list = list.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "th"); });
  if (s.sortBy === "price_asc") list = list.slice().sort(function (a, b) { return a.price - b.price; });
  if (s.sortBy === "price_desc") list = list.slice().sort(function (a, b) { return b.price - a.price; });

  var self = this;
  return list.map(function (p) {
    var im = img(p.cat);
    return {
      id: p.id, name: p.name, sku: p.sku, note: p.note || "", categoryLabel: self.catLabel(p.cat), unit: p.unit,
      priceDisplay: fmt(p.price),
      oldPriceDisplay: p.oldPrice ? fmt(p.oldPrice) : "",
      hasDiscount: !!p.oldPrice,
      price2Display: p.price2 != null ? fmt(p.price2) : "",
      price3Display: p.price3 != null ? fmt(p.price3) : "",
      hasMultiPrice: p.price2 != null || p.price3 != null,
      vatLabel: p.vat === "novat" ? "NO VAT" : "VAT",
      vatBadgeBg: p.vat === "novat" ? "oklch(0.93 0.03 85)" : "oklch(0.92 0.05 155)",
      vatBadgeColor: p.vat === "novat" ? "oklch(0.45 0.1 80)" : "oklch(0.4 0.09 155)",
      imgBg: im.bg, imgStripe: im.stripe,
      image: p.image || "",
      isEditing: s.editingId === p.id,
    };
  });
};

    .then(function () {

    });
};

function fetchFileBlob(fileId) {
  var url = API_BASE + "/files/" + encodeURIComponent(fileId) + "?dl=1";
  return fetch(url).then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.blob();
  });
}

// The server already serves this URL with Content-Type: application/pdf and
// Content-Disposition: inline, so opening it directly shows the real PDF at
// its own address (dashboard.html:104 API_BASE) - no need to fetch it into a
// blob: URL first, which just replaces that address with a temporary
// "blob:..." one in the tab.
Dashboard.prototype.viewFile = function (fileId) {
  window.open(API_BASE + "/files/" + encodeURIComponent(fileId), "_blank");
};

// Mobile browsers (iOS Safari especially) often ignore the server's
// Content-Disposition: attachment header for a cross-origin PDF link and
// just open it inline instead of downloading it. Fetching the bytes
// ourselves and saving them as a same-origin blob URL makes the `download`
// attribute reliable everywhere.
//
// This deliberately always saves the file rather than routing through
// navigator.share: some apps (LINE included) don't accept files shared from
// a web page at all, even though they work fine when shared from the
// Files app after being saved - so a plain download is the one flow that
// reliably works everywhere.
Dashboard.prototype.downloadFile = function (fileId, fileName) {
  var self = this;
  var name = fileName || "document.pdf";
  if (!/\.pdf$/i.test(name)) name += ".pdf";
  fetchFileBlob(fileId)
    .then(function (blob) {
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = blobUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 10000);
    })
    .catch(function () {
      // Fall back to a plain navigation so the file is at least viewable.
      window.open(API_BASE + "/files/" + encodeURIComponent(fileId) + "?dl=1", "_blank");
      self.showToast("ดาวน์โหลดไม่สำเร็จ กำลังเปิดไฟล์แทน", "error");
    });
};

// Filenames can't contain / \ : * ? " < > | -- strip them from a category
// label before splicing it into a download filename.
function sanitizeFilenamePart(s) {
  return String(s).replace(/[\\/:*?"<>|]/g, "").trim();
}

function formatDateYMD(d) {
  var pad = function (n) { return n < 10 ? "0" + n : String(n); };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

Dashboard.prototype.importExcelFile = function (file) {
  var self = this;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = new Uint8Array(reader.result);
      var wb = XLSX.read(data, { type: "array" });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      var newProducts = [];
      var errors = [];

      rows.forEach(function (row, i) {
        var rowNum = i + 2;
        var name = String(row["ชื่อสินค้า"] || "").trim();
        var catRaw = String(row["หมวดหมู่"] || "").trim();
        var priceRaw = row["ช่อง 1"];
        var unit = String(row["หน่วย"] || "").trim();
        if (!name && !catRaw && !unit && (priceRaw === "" || priceRaw == null)) return;

        var price = parseFloat(priceRaw);
        var cat = self.state.categories.some(function (c) { return c.value === catRaw; }) ? catRaw : self.catValueByLabel(catRaw);
        var errs = [];
        if (!name) errs.push("ไม่มีชื่อสินค้า");
        if (!cat) errs.push('หมวดหมู่ไม่ถูกต้อง ("' + catRaw + '")');
        if (isNaN(price) || price < 0) errs.push("ราคาไม่ถูกต้อง");
        if (!unit) errs.push("ไม่มีหน่วยนับ");
        if (errs.length) { errors.push("แถว " + rowNum + ": " + errs.join(", ")); return; }

        var price2Raw = row["ช่อง 2"];
        var price2 = (price2Raw !== "" && price2Raw != null) ? parseFloat(price2Raw) : null;
        if (price2 != null && isNaN(price2)) price2 = null;
        var price3Raw = row["ช่อง 3"];
        var price3 = (price3Raw !== "" && price3Raw != null) ? parseFloat(price3Raw) : null;
        if (price3 != null && isNaN(price3)) price3 = null;
        var vatRaw = String(row["ภาษี"] || "").trim().toLowerCase();
        var vat = (vatRaw === "novat" || vatRaw === "no vat") ? "novat" : "vat";
        var stock = parseInt(row["สต็อก"], 10); if (isNaN(stock) || stock < 0) stock = 0;

        newProducts.push({
          cat: cat, name: name, sku: "",
          price: price, oldPrice: null, price2: price2, price3: price3, unit: unit, stock: stock, vat: vat, image: "",
        });
      });

      if (newProducts.length) {
        apiRequest("/products/bulk", { method: "POST", auth: true, body: newProducts })
          .then(function (result) {
            self.setState(function (s2) {
              var updatedIds = result.updated.map(function (p) { return p.id; });
              var products = s2.products
                .filter(function (p) { return updatedIds.indexOf(p.id) === -1; })
                .concat(result.updated, result.created);
              var parts = [];
              if (result.created.length) parts.push("เพิ่มใหม่ " + result.created.length + " รายการ");
              if (result.updated.length) parts.push("แก้ไข " + result.updated.length + " รายการ (ชื่อซ้ำ)");
              var msg = "นำเข้าสำเร็จ: " + parts.join(", ") + (errors.length ? " (ข้าม " + errors.length + " แถวที่ไม่ถูกต้อง)" : "");
              return { products: products, importMsg: msg, importMsgType: errors.length ? "warn" : "success", importErrors: errors };
            });
            self.showToast("นำเข้าข้อมูลสำเร็จ", "success");
          })
          .catch(function (err) {
            self.setState({ importMsg: "นำเข้าไม่สำเร็จ: " + err.message, importMsgType: "error", importErrors: errors });
          });
      } else {
        self.setState({ importMsg: "ไม่พบข้อมูลสินค้าที่ถูกต้องในไฟล์", importMsgType: "error", importErrors: errors });
      }
    } catch (e) {
      self.setState({ importMsg: "ไม่สามารถอ่านไฟล์ได้ กรุณาตรวจสอบว่าเป็นไฟล์ Excel (.xlsx) ที่ถูกต้อง", importMsgType: "error", importErrors: [] });
    }
  };
  reader.readAsArrayBuffer(file);
};

Dashboard.prototype._folderKeys = function (kind) {
  var map = {
    concrete: { stateKey: "concreteFolders", activeKey: "activeConcreteFolderId", nameKey: "newConcreteFolderName", loadingKey: "concreteFoldersLoading", errorKey: "concreteFoldersError", searchKey: "concreteFileSearch", viewKey: "concreteFileView" },
    tis: { stateKey: "tisFolders", activeKey: "activeTisFolderId", nameKey: "newTisFolderName", loadingKey: "tisFoldersLoading", errorKey: "tisFoldersError", searchKey: "tisFileSearch", viewKey: "tisFileView" },
    company: { stateKey: "companyFolders", activeKey: "activeCompanyFolderId", nameKey: "newCompanyFolderName", loadingKey: "companyFoldersLoading", errorKey: "companyFoldersError", searchKey: "companyFileSearch", viewKey: "companyFileView" },
    catalog: { stateKey: "catalogFolders", activeKey: "activeCatalogFolderId", nameKey: "newCatalogFolderName", loadingKey: "catalogFoldersLoading", errorKey: "catalogFoldersError", searchKey: "catalogFileSearch", viewKey: "catalogFileView" },
    mit: { stateKey: "mitFolders", activeKey: "activeMitFolderId", nameKey: "newMitFolderName", loadingKey: "mitFoldersLoading", errorKey: "mitFoldersError", searchKey: "mitFileSearch", viewKey: "mitFileView" },
  };
  return map[kind];
};

Dashboard.prototype.addFolder = function (kind) {
  var k = this._folderKeys(kind);
  var name = (this.state[k.nameKey] || "").trim();
  if (!name) return;
  var self = this;
  apiRequest("/folders", { method: "POST", auth: true, body: { kind: kind, name: name } })
    .then(function (folder) {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].concat([folder]);
        patch[k.nameKey] = "";
        return patch;
      });
    })
    .catch(function (err) {
      var patch = {};
      patch[k.errorKey] = "เพิ่มโฟลเดอร์ไม่สำเร็จ: " + err.message;
      self.setState(patch);
    });
};

Dashboard.prototype.removeFolder = function (kind, id) {
  var k = this._folderKeys(kind);
  var self = this;
  apiRequest("/folders/" + encodeURIComponent(id), { method: "DELETE", auth: true })
    .then(function () {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].filter(function (f) { return f.id !== id; });
        if (s[k.activeKey] === id) patch[k.activeKey] = null;
        return patch;
      });
    })
    .catch(function (err) {
      var patch = {};
      patch[k.errorKey] = "ลบโฟลเดอร์ไม่สำเร็จ: " + err.message;
      self.setState(patch);

};

// one implicit folder it stores files in, then uploads into it as usual.
Dashboard.prototype.uploadCompanyFiles = function (fileList) {
  var self = this;
  if (this.state.activeCompanyFolderId) {
    this.uploadFiles("company", fileList);
    return;
  }
  apiRequest("/folders", { method: "POST", auth: true, body: { kind: "company", name: "Company Profile" } })
    .then(function (folder) {
      self.setState(function (s) {
        return { companyFolders: s.companyFolders.concat([folder]), activeCompanyFolderId: folder.id };
      });
      self.uploadFiles("company", fileList);
    })
    .catch(function (err) {
      self.setState({ companyFoldersError: "เตรียมพื้นที่จัดเก็บไฟล์ไม่สำเร็จ: " + err.message });
    });
};

Dashboard.prototype.uploadFiles = function (kind, fileList) {
  var k = this._folderKeys(kind);
  var activeId = this.state[k.activeKey];
  if (!activeId) return;
  var self = this;
  var files = Array.prototype.slice.call(fileList);
  var uploads = files.map(function (file) {
    var form = new FormData();
    form.append("folderId", activeId);
    form.append("kind", kind);
    form.append("file", file, file.name);
    return apiRequest("/files", { method: "POST", auth: true, formData: form });
  });
  Promise.allSettled(uploads).then(function (results) {
    var uploaded = results.filter(function (r) { return r.status === "fulfilled"; }).map(function (r) { return r.value; });
    var failedCount = results.length - uploaded.length;
    self.setState(function (s) {
      var patch = {};
      patch[k.stateKey] = s[k.stateKey].map(function (f) {
        if (f.id !== activeId) return f;
        return Object.assign({}, f, { files: f.files.concat(uploaded) });
      });
      patch[k.errorKey] = failedCount ? "อัปโหลดไม่สำเร็จ " + failedCount + " ไฟล์" : "";
      return patch;
    });
    if (uploaded.length) self.showToast("อัปโหลดสำเร็จ " + uploaded.length + " ไฟล์", "success");
  });
};

Dashboard.prototype.removeFile = function (kind, folderId, fileId) {
  var k = this._folderKeys(kind);
  var self = this;
  apiRequest("/files/" + encodeURIComponent(fileId), { method: "DELETE", auth: true })
    .then(function () {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].map(function (f) {
          if (f.id !== folderId) return f;
          return Object.assign({}, f, { files: f.files.filter(function (x) { return x.id !== fileId; }) });
        });
        return patch;
      });
    })
    .catch(function (err) {
      var patch = {};
      patch[k.errorKey] = "ลบไฟล์ไม่สำเร็จ: " + err.message;
      self.setState(patch);
    });
};

/* ---------- render ---------- */

Dashboard.prototype.render = function () {
  var active = document.activeElement;
  var focusId = active && active.id ? active.id : null;
  var selStart = active && "selectionStart" in active ? active.selectionStart : null;
  var selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;

  this.root.innerHTML = this.state.checkingSession ? this.renderSessionCheck() : (this.state.loggedIn ? this.renderDashboard() : this.renderLogin());

  if (focusId) {
    var el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart != null && "setSelectionRange" in el) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
};

Dashboard.prototype.renderCalcOnly = function () {
  var container = document.getElementById("calc-container");
  if (!container) { this.render(); return; }

  var active = document.activeElement;
  var focusId = active && active.id ? active.id : null;
  var focusSelector = (!focusId && active && active.dataset && active.dataset.calcRow != null)
    ? '[data-calc-row="' + active.dataset.calcRow + '"][data-calc-field="' + active.dataset.calcField + '"][data-calc-store="' + (active.dataset.calcStore || "calcRows") + '"]'
    : null;
  var selStart = active && "selectionStart" in active ? active.selectionStart : null;
  var selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;
  var oldScrollBox = container.querySelector(".list-table");
  var tableScrollLeft = oldScrollBox ? oldScrollBox.scrollLeft : null;
  var pageScrollX = window.scrollX, pageScrollY = window.scrollY;

  container.innerHTML = this.renderCalcPage();

  var el = focusId ? document.getElementById(focusId) : (focusSelector ? container.querySelector(focusSelector) : null);
  if (el) {
    el.focus();
    if (selStart != null && "setSelectionRange" in el) {
      try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
  if (tableScrollLeft != null) {
    var newScrollBox = container.querySelector(".list-table");
    if (newScrollBox) newScrollBox.scrollLeft = tableScrollLeft;
  }
  window.scrollTo(pageScrollX, pageScrollY);
};

Dashboard.prototype.computeCalcRows = function () {
  var s = this.state;
  var plateWidth = parseFloat(s.calcPlateWidth) || 0;
  var weightPerSqm = parseFloat(s.calcWeightPerSqm) || 0;
  return s.calcRows.map(function (r, i) {
    var length = parseFloat(r.length);
    var qty = parseInt(r.qty, 10);
    var discount = parseFloat(r.discount);
    var price = parseFloat(r.price);
    var hasData = !isNaN(length) && length > 0 && !isNaN(qty) && qty > 0 && !isNaN(price) && price > 0;
    if (!hasData) {
      return { index: i + 1, label: r.label, length: r.length, qty: r.qty, discount: r.discount, price: r.price, hasData: false };
    }
    var d = isNaN(discount) ? 0 : discount;
    var discountedPrice = Math.round(price * (1 - d / 100));
    var sqmPerSheet = plateWidth * length;
    var pricePerSheet = discountedPrice * sqmPerSheet;
    var weightPerSheet = weightPerSqm * sqmPerSheet;
    return {
      index: i + 1, label: r.label, length: r.length, qty: r.qty, discount: r.discount, price: r.price,
      hasData: true,
      discountedPrice: discountedPrice, sqmPerSheet: sqmPerSheet, pricePerSheet: pricePerSheet,
      weightPerSheet: weightPerSheet, totalSqm: sqmPerSheet * qty, totalWeight: weightPerSheet * qty, totalPrice: pricePerSheet * qty,
    };
  });
};

Dashboard.prototype.computeTruckPlan = function (totalWeightKg) {
  var totalTon = totalWeightKg / 1000;
  var rows = TRUCK_TYPES.map(function (t) {
    var trips = totalTon > 0 ? Math.ceil(totalTon / t.maxTon) : 0;
    return { name: t.name, maxTon: t.maxTon, trips: trips };
  });
  var recommended = null;
  if (totalTon > 0) {
    recommended = rows.filter(function (r) { return r.trips === 1; })[0] || rows[rows.length - 1];
  }
  return { rows: rows, recommended: recommended };
};

// Pile stores only the four base (no-VAT) prices per item (price_pickup,
// price_201_500plus, price_101_201, price_under_100 -- see
// migrations/0013_add_pile_pricing.sql); the matching VAT-inclusive prices
// shown next to each are always derived with this fixed formula, same
// approach as concreteMixVat above, so admin editing only ever touches the
// four bases (plus area_sqcm) -- the VAT columns update automatically.
function pileVat(base) { return Math.round(base * 1.07); }

var PILE_GROUPS = [
  { value: "I", label: "เสาเข็ม I" },
  { value: "SQ", label: "เสาเข็ม SQ" },
  { value: "HEX", label: "เสาเข็มหกเหลี่ยม" },
];
// Each price tier gets a dark header color pair (bg + readable text) and a
// pair of very light cell tints (novatBg/vatBg, vatBg a touch richer) --
// "design B": color lives on the header and the cell background, while the
// price numbers themselves stay plain dark text (see GROUP_CELL_TEXT_STYLE).
var PILE_TIERS = [
  { key: "pickup", editKey: "pileEditPickup", label: "รับเอง", headerBg: "#85B7EB", headerText: "#042C53", novatBg: "#F4F9FE", vatBg: "#E6F1FB" },
  { key: "t201_500plus", editKey: "pileEditT201500plus", label: "201-500++ ต้น", headerBg: "#97C459", headerText: "#173404", novatBg: "#F5F9EF", vatBg: "#EAF3DE" },
  { key: "t101_201", editKey: "pileEditT101201", label: "101-201 ต้น", headerBg: "#EF9F27", headerText: "#412402", novatBg: "#FDF8EF", vatBg: "#FAEEDA" },
  { key: "under_100", editKey: "pileEditUnder100", label: "&lt;100 ต้น", headerBg: "#F09595", headerText: "#501313", novatBg: "#FEF6F6", vatBg: "#FCEBEB" },
];
// Shared "design B" treatment: color lives on the header and the cell
// background, while the price numbers themselves stay plain dark text --
// used by both the pile tables above and renderConcreteMixPage below.
var GROUP_CELL_TEXT_STYLE = "color:#111111; font-weight:500;";
// Grid rows use gap:0 and align-items:stretch (not the grid default center)
// with padding baked into every cell div (colored or not) instead of on the
// row container -- that way each cell's own background paints edge-to-edge
// against its neighbors with no gap, and stays full-height even when a
// sibling cell (e.g. a wrapping product name) makes the row taller.
function groupCellStyle(bg, extra) {
  return (bg ? "background-color:" + bg + "; " : "") + "padding:10px 8px; box-sizing:border-box;" + (extra || "");
}

// Box culvert stores only the two base (ยังไม่รวม VAT) prices per row
// (price_mok1164/price_mok1166); the VAT-inclusive prices shown in the
// table are always derived from those with this fixed formula (see
// migrations/0015_add_box_culvert_pricing.sql), same as pileVat above.
function boxCulvertVat(base) { return Math.round(base * 1.07); }

// Same "design B" tier styling as PILE_TIERS above, but only two tiers --
// one per มอก. standard -- since box culvert has no discount ladder or
// customer-type tiers, just two independent prices per size.
var BOX_CULVERT_TIERS = [
  { key: "priceMok1164", editKey: "boxCulvertEditMok1164", label: "มอก.1164-2559", sublabel: "ใต้ทางเท้า", headerBg: "#85B7EB", headerText: "#042C53", novatBg: "#F4F9FE", vatBg: "#E6F1FB" },
  { key: "priceMok1166", editKey: "boxCulvertEditMok1166", label: "มอก.1166-2559", sublabel: "ใต้ผิวจราจร", headerBg: "#97C459", headerText: "#173404", novatBg: "#F5F9EF", vatBg: "#EAF3DE" },
];

// Precast manhole stores only the three base (ยังไม่รวม VAT) prices per row
// (price_pickup/price_wholesale/price_retail); the VAT-inclusive prices
// shown in the table are always derived from those with this fixed formula

// VAT rule stays independently editable, same reasoning as pileVat/
// boxCulvertVat/concreteMixVat all being separate functions despite sharing

function manholeVat(base) { return Math.round(base * 1.07); }

// Same "design B" tier styling as BOX_CULVERT_TIERS above, but three tiers

Dashboard.prototype.computeSteelRows = function () {
  return this.state.calcSteelRows.map(function (r, i) {
    var product = STEEL_PRODUCTS_BY_ID[r.product];
    var qty = parseFloat(r.qty);
    var qtyValid = !isNaN(qty) && qty > 0;
    var sellPrice = parseFloat(r.sellPrice); if (isNaN(sellPrice)) sellPrice = 0;
    var row = {
      index: i + 1, product: r.product, qty: r.qty, sellPrice: r.sellPrice,
      hasProduct: !!product, unit: product ? product.unit : "", weightPerUnit: product ? product.weight : null,
      hasTotals: !!product && qtyValid,
    };
    if (row.hasTotals) {
      row.totalWeight = product.weight * qty;
      row.totalSell = sellPrice * qty;
    }
    return row;
  });
};

Dashboard.prototype.renderSteelCalc = function () {
  var rows = this.computeSteelRows();

  var totalWeight = 0, totalSell = 0;
  rows.forEach(function (r) {
    if (r.hasTotals) { totalWeight += r.totalWeight; totalSell += r.totalSell; }
  });

    headerCells.map(function (h, i) {

    }).join("") + '</div>';

  var dataRows = rows.map(function (r) {
    var cells = [];
    cells.push('<div style="position:sticky; left:0; z-index:1; background:#fff; font-size:12.5px; color:oklch(0.5 0.01 60); box-shadow:2px 0 4px rgba(0,0,0,.06);">' + r.index + '</div>');
    cells.push('<select data-calc-row="' + (r.index - 1) + '" data-calc-field="product" data-calc-store="calcSteelRows" style="' + rowInputStyle + ' background:#fff;">' + productOptionsHtml(r.product) + '</select>');
    cells.push('<input type="text" inputmode="numeric" data-calc-row="' + (r.index - 1) + '" data-calc-field="qty" data-calc-store="calcSteelRows" value="' + esc(r.qty) + '" style="' + rowInputStyle + '" />');
    cells.push('<div style="font-size:12.5px;">' + esc(r.unit || "") + '</div>');
    cells.push('<div style="font-size:12.5px;">' + (r.weightPerUnit != null ? fmtN(r.weightPerUnit, 2) : "") + '</div>');
    cells.push('<div style="font-size:12.5px;">' + (r.hasTotals ? fmtN(r.totalWeight, 2) : "") + '</div>');
    cells.push('<input type="text" inputmode="decimal" data-calc-row="' + (r.index - 1) + '" data-calc-field="sellPrice" data-calc-store="calcSteelRows" value="' + esc(r.sellPrice) + '" style="' + rowInputStyle + '" />');
    cells.push('<div style="font-size:12.5px; font-weight:700; color:oklch(0.38 0.15 275);">' + (r.hasTotals ? fmtN(r.totalSell, 2) : "") + '</div>');
    return '<div class="steel-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:10px 14px; border-top:1px solid oklch(0.93 0.006 70);">' + cells.join("") + '</div>';
  }).join("");

  var totalsRow = '<div class="steel-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:12px 14px; border-top:2px solid oklch(0.85 0.01 60); background:oklch(0.96 0.006 70); font-weight:700; font-size:12.5px;">' +

    '<div></div>' +
    '<div>' + fmtN(totalWeight, 2) + '</div>' +
    '<div></div>' +
    '<div style="color:oklch(0.38 0.15 275);">' + fmtN(totalSell, 2) + '</div>' +

  return '<div style="margin-bottom:20px; font-size:13px; color:oklch(0.5 0.01 60); line-height:1.6;">เลือกสินค้าในคอลัมน์ "สินค้า" แล้วกรอกจำนวนตามหน่วยที่แสดง (เหล็กเส้นกรอกจำนวนเส้น) และกรอกราคาขาย/หน่วยเอง ระบบคำนวณน้ำหนักรวมและยอดขายรวม (จำนวน × ราคาขาย/หน่วย) ให้อัตโนมัติ</div>' +
    table;
};

Dashboard.prototype.computeStirrupRows = function () {
  return this.state.calcStirrupRows.map(function (r, i) {
    var product = STIRRUP_PRODUCTS_BY_ID[r.product];
    var qty = parseFloat(r.qty);
    var qtyValid = !isNaN(qty) && qty > 0;
    var sellPrice = parseFloat(r.sellPrice); if (isNaN(sellPrice)) sellPrice = 0;
    var row = {
      index: i + 1, product: r.product, qty: r.qty, sellPrice: r.sellPrice,
      hasProduct: !!product, weightPerBundle: product ? product.weightPerBundle : null,
      hasTotals: !!product && qtyValid,
    };
    if (row.hasTotals) {
      row.totalWeight = (qty / STIRRUP_BUNDLE_SIZE) * product.weightPerBundle;
      row.totalSell = sellPrice * row.totalWeight;
    }
    return row;
  });
};

Dashboard.prototype.renderCalcPage = function () {
  var s = this.state;

  var typeSelector = '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;">' +
    CALC_PRODUCT_TYPES.map(function (t) {
      var active = s.calcProductType === t.value;
      return '<button data-action="calc-set-type" data-type="' + t.value + '" style="min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; padding:10px 18px; border-radius:10px; border:1px solid ' + (active ? "oklch(0.38 0.15 275)" : "oklch(0.87 0.008 60)") + '; background:' + (active ? "oklch(0.38 0.15 275)" : "#fff") + '; color:' + (active ? "#fff" : "oklch(0.4 0.01 60)") + '; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;">' + esc(t.label) + '</button>';
    }).join("") +
  '</div>';

  var typeConfig = CALC_PRODUCT_TYPES.filter(function (t) { return t.value === s.calcProductType; })[0];
  var body = s.calcProductType === "slab" ? this.renderSlabCalc() :
    s.calcProductType === "steel" ? this.renderSteelCalc() :
    s.calcProductType === "stirrup" ? this.renderStirrupCalc() :
    '<div style="background:#fff; border:1px solid oklch(0.9 0.008 60); border-radius:14px; padding:48px 20px; text-align:center; color:oklch(0.55 0.01 60); font-size:14px;">ยังไม่มีเครื่องคำนวณสำหรับ "' + esc(typeConfig ? typeConfig.label : s.calcProductType) + '"</div>';

  return '<div class="page-content" style="padding:28px 32px 56px; max-width:1500px; margin:0 auto;">' +
    '<div style="margin-bottom:20px;"><div style="font-family:Kanit; font-weight:700; font-size:22px;">คำนวณราคาสินค้า</div><div style="font-size:13px; color:oklch(0.5 0.01 60); margin-top:2px;">เลือกประเภทสินค้าที่ต้องการคำนวณราคา</div></div>' +
    typeSelector + body +
  '</div>';
};
