          (p.hasMultiPrice ? priceTiersHtml(p) :
          '<div style="display:flex; align-items:baseline; gap:7px; margin-top:2px;">' +
            '<span style="font-family:\'IBM Plex Sans Thai\'; font-weight:700; font-size:19px; color:var(--navy-action);">฿' + p.priceDisplay + '</span>' +
            (p.hasDiscount ? '<span style="font-size:12.5px; color:oklch(0.6 0.01 60); text-decoration:line-through;">฿' + p.oldPriceDisplay + '</span>' : '') +
            '<span style="font-size:11.5px; color:var(--text-faint);">/' + esc(p.unit) + '</span>' +
          '</div>') +
          '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px;">' +
            '<span style="font-size:11.5px; padding:3px 8px; border-radius:6px; background:' + p.vatBadgeBg + '; color:' + p.vatBadgeColor + '; font-weight:600;">' + p.vatLabel + '</span>' +
            (isAdmin ? '<div style="display:flex; align-items:center; gap:6px;">' +
              '<button class="row-icon-btn" data-action="start-edit" data-id="' + p.id + '" aria-label="แก้ไข">✏️</button>' +
              '<button class="row-icon-btn row-icon-btn--danger" data-action="request-delete-product" data-id="' + p.id + '" data-name="' + esc(productLabel(p)) + '" aria-label="ลบ">🗑️</button>' +
            '</div>' : '') +
          '</div>' +
        '</div>';
      return '<div class="product-card" style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .15s;">' +
        '<div' + (p.image ? ' data-action="view-product-image" data-image="' + esc(p.image) + '" data-name="' + esc(productLabel(p)) + '"' : '') + ' style="position:relative; height:130px; ' + mediaStyle + (p.image ? ' cursor:pointer;' : '') + '">' +
          mediaSvg +
          (isAdmin && s.selectMode && !p.isEditing ? '<div style="position:absolute; top:8px; left:8px; z-index:2; background:rgba(255,255,255,.92); border-radius:7px; padding:4px; display:flex; line-height:0;"><input type="checkbox" data-action="toggle-select-product" data-id="' + p.id + '"' + (s.selectedProductIds.indexOf(p.id) !== -1 ? " checked" : "") + ' style="width:18px; height:18px; cursor:pointer; margin:0;" /></div>' : '') +
          '<span style="position:absolute; bottom:8px; left:10px; font-family:ui-monospace,monospace; font-size:10.5px; background:rgba(255,255,255,.85); padding:2px 6px; border-radius:5px; color:#444;">' + esc(p.categoryLabel) + (p.subcat ? " · " + esc(p.subcat) : "") + '</span>' +
        '</div>' +
        cardBody +
      '</div>';
  }

  // "+ เพิ่มสี" pill, or the add-color panel when it's open for this product
  // (a group passes its first member). The copied fields are shown
  // read-only: changing any of them would drop the new color out of the group.
  // The width cap keeps the panel inside the screen on phones, where list
  // rows are 620px wide and scroll sideways.
  // Single products get "+ เพิ่มสี" when they have a color, in the สี field
  // or still inline in the name ("สีXXX").
  function hasAddColor(p) {
    return !!(p.color || splitInlineColor(p.name));
  }

  function addColorHtml(source, compact) {
    if (!isAdmin) return "";
    if (s.addColorSourceId !== source.id) {
      return '<button type="button" data-action="start-add-color" data-id="' + source.id + '" style="min-height:32px; display:inline-flex; align-items:center; gap:4px; margin-top:6px; padding:4px 10px; border:1px dashed var(--navy-action-soft-border); border-radius:20px; background:#fff; color:var(--navy-action); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;">+ เพิ่มสี</button>';
    }
    var ctx = self.addColorContext();
    if (!ctx) return "";
    var src = ctx.source;
    var prices = [["ช่อง 1", src.price], ["ช่อง 2", src.price2], ["ช่อง 3", src.price3]].filter(function (r) { return r[1] != null; })
      .map(function (r) { return r[0] + " ฿" + fmt(r[1]); }).join(" · ");
    var info = [
      ["ชื่อ", ctx.base],
    ].concat(ctx.inline ? [["สีเดิม", ctx.label]] : []).concat([
      ["หมวด", self.catLabel(src.cat) + (src.subcat ? " › " + src.subcat : "")],
      ["ราคา", prices],
      ["หน่วย", src.unit],
      ["ภาษี", src.vat === "novat" ? "NO VAT" : "VAT"],
    ]);
    var freshCount = ctx.colors.filter(function (c) { return !c.dup; }).length;
    var chips = ctx.colors.map(function (c) {
      return c.dup
        ? '<span style="font-size:12px; padding:3px 9px; border-radius:20px; background:var(--danger-red-bg); color:var(--danger-red); font-weight:600;">ซ้ำ: ' + esc(c.color) + ' (จะข้าม)</span>'
        : '<span style="font-size:12px; padding:3px 9px; border-radius:20px; background:oklch(0.94 0.05 155); color:oklch(0.35 0.09 155); font-weight:600;">+ ' + esc(c.color) + '</span>';
    }).join("");
    return '<div style="' + (compact ? "" : "grid-column:1 / -1; ") + 'box-sizing:border-box; max-width:min(520px, calc(100vw - 120px)); margin-top:8px; padding:12px 14px; border:1px solid var(--navy-action-soft-border); border-radius:10px; background:oklch(0.98 0.01 275); display:flex; flex-direction:column; gap:8px; text-align:left;">' +
      '<div style="font-size:13px; font-weight:700; color:var(--text-body);">เพิ่มสีใหม่ในกลุ่มนี้</div>' +
      '<div style="display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12px; color:var(--text-muted);">' +
        info.map(function (r) { return '<span>' + r[0] + '</span><span style="color:var(--text-body); min-width:0; overflow-wrap:anywhere;">' + esc(r[1]) + '</span>'; }).join("") +
      '</div>' +
      '<div style="font-size:11.5px; color:var(--text-faint);">' + (ctx.inline
        ? 'เมื่อบันทึก รายการเดิมจะใช้ชื่อด้านบน และย้ายสี "' + esc(ctx.label) + '" จากชื่อไปไว้ในช่องสี เพื่อรวมกลุ่มกับสีใหม่ · สีใหม่คัดลอกหมวด/ราคา/หน่วย/ภาษีจากรายการนี้ หมายเหตุและรูปจะว่างไว้'
        : 'คัดลอกจากสินค้าในกลุ่ม · หมายเหตุและรูปจะว่างไว้') + '</div>' +
      '<label style="display:flex; flex-direction:column; gap:4px; font-size:12.5px; font-weight:600; color:var(--text-body);">สี (กรอกหลายสีคั่นด้วยจุลภาค)' +
        '<input id="field-addColorInput" type="text" data-bind="addColorInput" data-clear="addColorError" value="' + esc(s.addColorInput) + '" placeholder="เช่น แดง, เขียว, น้ำเงิน" style="padding:8px 10px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:13px; font-family:inherit; font-weight:400;" />' +
      '</label>' +
      (chips ? '<div style="display:flex; flex-wrap:wrap; gap:6px;">' + chips + '</div>' : '') +
      (s.addColorError ? '<div style="font-size:12.5px; color:var(--danger-red); background:var(--danger-red-bg); padding:7px 10px; border-radius:7px;">' + esc(s.addColorError) + '</div>' : '') +
      '<div style="display:flex; flex-wrap:wrap; gap:8px;">' +
        '<button type="button" data-action="save-add-color"' + (s.addColorSaving ? " disabled" : "") + ' style="min-height:44px; display:inline-flex; align-items:center; border:none; background:var(--navy-action); color:#fff; border-radius:7px; padding:10px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;' + (s.addColorSaving ? " opacity:.6;" : "") + '">' + (s.addColorSaving ? "กำลังบันทึก..." : "บันทึก" + (freshCount ? " " + freshCount + " สี" : "")) + '</button>' +
        '<button type="button" data-action="cancel-add-color" style="min-height:44px; display:inline-flex; align-items:center; border:1px solid oklch(0.85 0.01 60); background:#fff; color:var(--text-body); border-radius:7px; padding:10px 14px; font-size:13px; cursor:pointer; font-family:inherit;">ยกเลิก</button>' +
      '</div>' +
    '</div>';
  }

  // The single-product editor as a full-width cell of a list row (also used
  // for one color inside an expanded color group, with a ยกเลิก button).
  function listEditFormHtml(p, withCancel) {
    return '<div style="grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-top:8px;">' +
      '<div style="display:flex; flex-direction:column; gap:6px; flex:1 1 220px;">' +
        '<input id="field-editName" type="text" data-bind="editName" value="' + esc(s.editName) + '" placeholder="ชื่อสินค้า" style="padding:6px 9px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
        '<input id="field-editNote" type="text" data-bind="editNote" value="' + esc(s.editNote) + '" placeholder="หมายเหตุ (ถ้ามี)" style="padding:6px 9px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      '</div>' +
      '<input id="field-editPrice" type="text" inputmode="decimal" data-bind="editPrice" value="' + esc(s.editPrice) + '" placeholder="ราคา ช่อง 1" style="width:90px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      '<input id="field-editPrice2" type="text" inputmode="decimal" data-bind="editPrice2" value="' + esc(s.editPrice2) + '" placeholder="ช่อง 2 (ถ้ามี)" style="width:90px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      '<input id="field-editPrice3" type="text" inputmode="decimal" data-bind="editPrice3" value="' + esc(s.editPrice3) + '" placeholder="ช่อง 3 (ถ้ามี)" style="width:90px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      '<input id="field-editUnit" type="text" data-bind="editUnit" value="' + esc(s.editUnit) + '" placeholder="หน่วย" style="width:70px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      '<input id="field-editColor" type="text" data-bind="editColor" value="' + esc(s.editColor) + '" placeholder="สี (ถ้ามี)" style="width:110px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      '<select id="field-editVat" data-bind="editVat" style="padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit; background:#fff;">' +
        '<option value="vat"' + (s.editVat === "vat" ? " selected" : "") + '>VAT</option>' +
        '<option value="novat"' + (s.editVat === "novat" ? " selected" : "") + '>NO VAT</option>' +
      '</select>' +
      '<input id="field-editSubcat" type="text" list="subcat-datalist-edit-' + p.id + '" data-bind="editSubcat" value="' + esc(s.editSubcat) + '" placeholder="หมวดย่อย (ถ้ามี)" style="width:140px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;" />' +
      subcatDatalistHtml("subcat-datalist-edit-" + p.id, self.subcatOptionsFor(p.cat)) +
      '<div style="display:flex; align-items:center; gap:6px;">' +
        (s.editImage ? '<img src="' + s.editImage + '" alt="" style="width:28px; height:28px; border-radius:6px; object-fit:cover;" />' : '') +
        '<label style="min-height:44px; display:inline-flex; align-items:center;box-sizing:border-box; display:inline-flex; align-items:center; font-size:12.5px; padding:10px 12px; border-radius:7px; background:var(--bg-subtle); cursor:pointer; font-family:inherit;">🖼️ รูป<input type="file" accept="image/*" data-action="upload-edit-image" style="display:none;" /></label>' +
        (s.editImage ? '<button type="button" data-action="clear-edit-image" style="min-height:44px; display:inline-flex; align-items:center;padding:10px 12px; border:none; background:transparent; color:var(--danger-red); font-size:12.5px; cursor:pointer; font-family:inherit;">ลบรูป</button>' : '') +
      '</div>' +
      '<button data-action="save-edit" data-id="' + p.id + '" style="min-height:44px; display:inline-flex; align-items:center;border:none; background:var(--navy-action); color:#fff; border-radius:7px; padding:10px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">บันทึก</button>' +
      (withCancel ? '<button type="button" data-action="cancel-edit" style="min-height:44px; display:inline-flex; align-items:center;border:1px solid oklch(0.85 0.01 60); background:#fff; color:var(--text-body); border-radius:7px; padding:10px 14px; font-size:13px; cursor:pointer; font-family:inherit;">ยกเลิก</button>' : '') +
    '</div>';
  }

  function renderListRow(p) {
      if (p.isGroup) return renderGroupListRow(p);
      var editRow = p.isEditing ? listEditFormHtml(p, false) :
        '<div style="display:flex; align-items:center; gap:10px;">' +
          '<span style="font-size:11.5px; padding:3px 8px; border-radius:6px; background:' + p.vatBadgeBg + '; color:' + p.vatBadgeColor + '; font-weight:600;">' + p.vatLabel + '</span>' +
          (isAdmin ? '<button class="row-icon-btn" data-action="start-edit" data-id="' + p.id + '" aria-label="แก้ไข">✏️</button>' : '') +
          (isAdmin ? '<button class="row-icon-btn row-icon-btn--danger" data-action="request-delete-product" data-id="' + p.id + '" data-name="' + esc(productLabel(p)) + '" aria-label="ลบ">🗑️</button>' : '') +
        '</div>';
      var listMediaStyle = p.image ? "background:var(--bg-subtle-2) center/cover no-repeat url('" + p.image + "');" : "background:var(--bg-subtle); display:flex; align-items:center; justify-content:center; color:var(--text-faint);";
      var listMediaSvg = p.image ? "" : noImageIconSvg(20);
      return '<div class="list-grid-row" style="display:grid; grid-template-columns:2.4fr 1fr 1fr 0.9fr 1fr; gap:10px; align-items:center; padding:9px 20px; border-top:1px solid var(--border-light);">' +
        '<div style="display:flex; align-items:center; gap:12px;">' +
          (isAdmin && s.selectMode && !p.isEditing ? '<input type="checkbox" data-action="toggle-select-product" data-id="' + p.id + '"' + (s.selectedProductIds.indexOf(p.id) !== -1 ? " checked" : "") + ' style="width:18px; height:18px; cursor:pointer; flex:none; margin:0;" />' : '') +
          '<div' + (p.image ? ' data-action="view-product-image" data-image="' + esc(p.image) + '" data-name="' + esc(productLabel(p)) + '"' : '') + ' style="width:40px; height:40px; border-radius:8px; ' + listMediaStyle + ' flex:none; position:relative; overflow:hidden;' + (p.image ? ' cursor:pointer;' : '') + '">' + listMediaSvg + '</div>' +
          '<div>' +
            '<div style="font-weight:600; font-size:14px;">' + esc(p.name) + '</div>' +
            (p.colorLabel ? productColorLineHtml(p.color) : '') +
            (p.note ? '<div style="font-size:12px; color:var(--text-faint); margin-top:2px;">' + esc(p.note) + '</div>' : '') +
            (isSingleColor(p) && !p.colorLabel ? singleToggleHtml(p) :
              hasAddColor(p) && !p.isEditing && s.addColorSourceId !== p.id ? addColorHtml(p, true) : '') +
          '</div>' +
        '</div>' +
        '<div><span style="font-size:12px; padding:3px 9px; border-radius:20px; background:var(--bg-subtle); color:var(--text-body);">' + esc(p.categoryLabel) + (p.subcat ? " · " + esc(p.subcat) : "") + '</span></div>' +
        '<div style="text-align:right;">' + (p.hasMultiPrice ? priceTiersHtmlCompact(p) :
          '<div style="display:flex; align-items:baseline; gap:6px; justify-content:flex-end;"><span style="font-family:\'IBM Plex Sans Thai\'; font-weight:700; font-size:15.5px; color:var(--navy-action);">฿' + p.priceDisplay + '</span>' + (p.hasDiscount ? '<span style="font-size:11.5px; color:oklch(0.6 0.01 60); text-decoration:line-through;">฿' + p.oldPriceDisplay + '</span>' : '') + '</div>'
        ) + '</div>' +
        '<div style="font-size:13px; color:var(--text-muted); text-align:right;">' + esc(p.unit) + '</div>' +
        editRow +
        (isSingleColor(p) && !p.colorLabel ? (singleExpanded(p) ? singleColorHtml(p, true) : '') :
          hasAddColor(p) && s.addColorSourceId === p.id ? addColorHtml(p, false) : '') +
      '</div>';
  }

  // ---- single-color rows ----
  // A product with its สี field set that isn't grouped with anything shows a
  // collapsible "▶ 1 สี" like a group; expanding it lists the color (+ note)
  // and "+ เพิ่มสี". The row's own ✏️/🗑️ still act on just this product.
  // State shares expandedProductGroups under "s:<id>"; an open add-color
  // form keeps it expanded.
  function singleColorKey(p) { return "s:" + p.id; }
  function isSingleColor(p) { return !p.isGroup && !!String(p.color || "").trim(); }
  function singleExpanded(p) { return !!s.expandedProductGroups[singleColorKey(p)] || s.addColorSourceId === p.id; }

  function singleToggleHtml(p) {
    return groupToggleHtml({ key: singleColorKey(p), isExpanded: singleExpanded(p), members: [p] });
  }

  function singleColorHtml(p, inList) {
    var line = '<div style="' + (inList ? "padding-left:52px;" : "") + ' display:flex; align-items:center; gap:10px; padding-top:5px; padding-bottom:5px; border-top:1px dashed var(--border-light); min-height:30px;">' +
      '<div style="flex:1; min-width:0; font-size:13px;">' +
        '<span style="font-weight:600; color:var(--text-body);">' + esc(p.color) + '</span>' +
        (p.note ? '<span style="margin-left:6px; font-size:11.5px; color:var(--text-faint);">' + esc(p.note) + '</span>' : '') +
      '</div>' +
    '</div>';
    var addColor = addColorHtml(p, true);
    if (addColor) line += '<div style="' + (inList ? "padding-left:52px;" : "") + ' border-top:1px dashed var(--border-light); padding-top:2px; padding-bottom:4px;">' + addColor + '</div>';
    return '<div style="' + (inList ? "grid-column:1 / -1; margin-top:4px;" : "margin-top:2px;") + '">' + line + '</div>';
  }

  // ---- color-group rows (see computeProductRows) ----
  function groupCheckboxHtml(g) {
    var allOn = g.ids.every(function (id) { return s.selectedProductIds.indexOf(id) !== -1; });
    return '<input type="checkbox" data-action="toggle-select-product" data-ids="' + esc(g.ids.join(",")) + '"' + (allOn ? " checked" : "") + ' aria-label="เลือกทั้ง ' + g.members.length + ' สี" style="width:18px; height:18px; cursor:pointer; flex:none; margin:0;" />';
  }

  function groupToggleHtml(g) {
    return '<button type="button" data-action="toggle-product-group" data-key="' + esc(g.key) + '" aria-expanded="' + (g.isExpanded ? "true" : "false") + '" title="' + (g.isExpanded ? "ซ่อนรายชื่อสี" : "ดูรายชื่อสี") + '" style="min-height:32px; display:inline-flex; align-items:center; gap:5px; margin-top:4px; padding:4px 10px; border:1px solid var(--navy-action-soft-border); border-radius:20px; background:' + (g.isExpanded ? "oklch(0.95 0.05 275)" : "#fff") + '; color:var(--navy-action); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;">' +
      '<span style="display:inline-block; font-size:9px; transition:transform .15s; transform:rotate(' + (g.isExpanded ? "90deg" : "0deg") + ');">▶</span>' + g.members.length + ' สี' +
    '</button>';
  }

  function groupEditFormHtml(g) {
    var inputStyle = "width:90px; padding:6px 8px; border-radius:7px; border:1px solid oklch(0.8 0.02 60); font-size:12.5px; font-family:inherit;";
    return '<div style="grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding-top:8px;">' +
      '<div style="flex:1 1 100%; font-size:12.5px; color:var(--text-muted);">แก้ราคาทั้งกลุ่ม: ราคาใหม่จะบันทึกให้ <strong style="color:var(--text-body);">ทั้ง ' + g.members.length + ' สี</strong> พร้อมกัน (แก้ชื่อ/หมายเหตุ/รูป รายสีได้จากรายชื่อสีที่กางออก)</div>' +
      '<input id="field-editGroupPrice" type="text" inputmode="decimal" data-bind="editGroupPrice" data-clear="editGroupError" value="' + esc(s.editGroupPrice) + '" placeholder="ราคา ช่อง 1" style="' + inputStyle + '" />' +
      '<input id="field-editGroupPrice2" type="text" inputmode="decimal" data-bind="editGroupPrice2" value="' + esc(s.editGroupPrice2) + '" placeholder="ช่อง 2 (ถ้ามี)" style="' + inputStyle + '" />' +
      '<input id="field-editGroupPrice3" type="text" inputmode="decimal" data-bind="editGroupPrice3" value="' + esc(s.editGroupPrice3) + '" placeholder="ช่อง 3 (ถ้ามี)" style="' + inputStyle + '" />' +
      '<button data-action="save-edit-group" data-key="' + esc(g.key) + '" style="min-height:44px; display:inline-flex; align-items:center;border:none; background:var(--navy-action); color:#fff; border-radius:7px; padding:10px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">บันทึกทั้ง ' + g.members.length + ' สี</button>' +
      '<button type="button" data-action="cancel-edit-group" style="min-height:44px; display:inline-flex; align-items:center;border:1px solid oklch(0.85 0.01 60); background:#fff; color:var(--text-body); border-radius:7px; padding:10px 14px; font-size:13px; cursor:pointer; font-family:inherit;">ยกเลิก</button>' +
      (s.editGroupError ? '<div style="flex:1 1 100%; font-size:12.5px; color:var(--danger-red); background:var(--danger-red-bg); padding:7px 10px; border-radius:7px;">' + esc(s.editGroupError) + '</div>' : '') +
    '</div>';
  }

  // The expanded color list: one line per color with its own note (e.g.
  // "(MTO)") and per-color edit/delete. `inList` lays it out as a full-width
  // cell of the list-view row; otherwise it's stacked inside a grid card.
  function groupColorsHtml(g, inList) {
    var rows = g.members.map(function (m) {
      // In the list view the line reuses the row's column template so the
      // per-color ✏️/🗑️ sit under the group's own buttons in the last column.
      var line = '<div style="' + (inList ? "display:grid; grid-template-columns:2.4fr 1fr 1fr 0.9fr 1fr; gap:10px; padding:5px 0;" : "display:flex; gap:10px; padding:4px 0;") + ' align-items:center; border-top:1px dashed var(--border-light); min-height:' + (isAdmin ? "44px" : "30px") + ';">' +
        '<div style="' + (inList ? "grid-column:1 / 5; padding-left:52px;" : "flex:1; min-width:0;") + ' display:flex; align-items:center; gap:10px;">' +
        (isAdmin && s.selectMode && !m.isEditing ? '<input type="checkbox" data-action="toggle-select-product" data-id="' + m.id + '"' + (s.selectedProductIds.indexOf(m.id) !== -1 ? " checked" : "") + ' style="width:16px; height:16px; cursor:pointer; flex:none; margin:0;" />' : '') +
        (m.image ? '<div data-action="view-product-image" data-image="' + esc(m.image) + '" data-name="' + esc(productLabel(m)) + '" style="width:26px; height:26px; flex:none; border-radius:6px; cursor:pointer; background:var(--bg-subtle-2) center/cover no-repeat url(\'' + m.image + '\');"></div>' : '') +
        '<div style="flex:1; min-width:0; font-size:13px;">' +
          '<span style="font-weight:600; color:var(--text-body);">' + esc(m.colorLabel) + '</span>' +
          (m.note ? '<span style="margin-left:6px; font-size:11.5px; color:var(--text-faint);">' + esc(m.note) + '</span>' : '') +
        '</div>' +
        '</div>' +
        (isAdmin && !m.isEditing ? '<div style="display:flex; gap:6px; flex:none;">' +
          '<button class="row-icon-btn" data-action="start-edit" data-id="' + m.id + '" aria-label="แก้ไขสี ' + esc(m.colorLabel) + '">✏️</button>' +
          '<button class="row-icon-btn row-icon-btn--danger" data-action="request-delete-product" data-id="' + m.id + '" data-name="' + esc(productLabel(m)) + '" aria-label="ลบสี ' + esc(m.colorLabel) + '">🗑️</button>' +
        '</div>' : '') +
      '</div>';
      if (m.isEditing && inList) line += '<div style="padding-left:52px; padding-bottom:6px;">' + listEditFormHtml(m, true) + '</div>';
      return line;
    }).join("");
    var addColor = addColorHtml(g.members[0], true);
    if (addColor) rows += '<div style="' + (inList ? "padding-left:52px;" : "") + ' border-top:1px dashed var(--border-light); padding-top:2px; padding-bottom:4px;">' + addColor + '</div>';
    return '<div style="' + (inList ? "grid-column:1 / -1; margin-top:4px;" : "margin-top:2px;") + '">' + rows + '</div>';
  }

  function renderGroupListRow(g) {
    var actions = g.isEditing ? groupEditFormHtml(g) :
      '<div style="display:flex; align-items:center; gap:10px;">' +
        '<span style="font-size:11.5px; padding:3px 8px; border-radius:6px; background:' + g.vatBadgeBg + '; color:' + g.vatBadgeColor + '; font-weight:600;">' + g.vatLabel + '</span>' +
        (isAdmin ? '<button class="row-icon-btn" data-action="start-edit-group" data-key="' + esc(g.key) + '" aria-label="แก้ราคาทั้ง ' + g.members.length + ' สี" title="แก้ราคาทั้ง ' + g.members.length + ' สี">✏️</button>' : '') +
        (isAdmin ? '<button class="row-icon-btn row-icon-btn--danger" data-action="request-delete-group" data-key="' + esc(g.key) + '" aria-label="ลบทั้ง ' + g.members.length + ' สี" title="ลบทั้ง ' + g.members.length + ' สี">🗑️</button>' : '') +
      '</div>';
    var mediaStyle = g.image ? "background:var(--bg-subtle-2) center/cover no-repeat url('" + g.image + "');" : "background:var(--bg-subtle); display:flex; align-items:center; justify-content:center; color:var(--text-faint);";
    return '<div class="list-grid-row" style="display:grid; grid-template-columns:2.4fr 1fr 1fr 0.9fr 1fr; gap:10px; align-items:center; padding:9px 20px; border-top:1px solid var(--border-light);">' +
      '<div style="display:flex; align-items:center; gap:12px;">' +
        (isAdmin && s.selectMode && !g.isEditing ? groupCheckboxHtml(g) : '') +
        '<div' + (g.image ? ' data-action="view-product-image" data-image="' + esc(g.image) + '" data-name="' + esc(g.name) + '"' : '') + ' style="width:40px; height:40px; border-radius:8px; ' + mediaStyle + ' flex:none; position:relative; overflow:hidden;' + (g.image ? ' cursor:pointer;' : '') + '">' + (g.image ? "" : noImageIconSvg(20)) + '</div>' +
        '<div>' +
          '<div style="font-weight:600; font-size:14px;">' + esc(g.name) + '</div>' +
          (g.note ? '<div style="font-size:12px; color:var(--text-faint); margin-top:2px;">' + esc(g.note) + '</div>' : '') +
          groupToggleHtml(g) +
        '</div>' +
      '</div>' +
      '<div><span style="font-size:12px; padding:3px 9px; border-radius:20px; background:var(--bg-subtle); color:var(--text-body);">' + esc(g.categoryLabel) + (g.subcat ? " · " + esc(g.subcat) : "") + '</span></div>' +
      '<div style="text-align:right;">' + (g.hasMultiPrice ? priceTiersHtmlCompact(g) :
        '<div style="display:flex; align-items:baseline; gap:6px; justify-content:flex-end;"><span style="font-family:\'IBM Plex Sans Thai\'; font-weight:700; font-size:15.5px; color:var(--navy-action);">฿' + g.priceDisplay + '</span>' + (g.hasDiscount ? '<span style="font-size:11.5px; color:oklch(0.6 0.01 60); text-decoration:line-through;">฿' + g.oldPriceDisplay + '</span>' : '') + '</div>'
      ) + '</div>' +
      '<div style="font-size:13px; color:var(--text-muted); text-align:right;">' + esc(g.unit) + '</div>' +
      actions +
      (g.isExpanded ? groupColorsHtml(g, true) : '') +
    '</div>';
  }

  function renderGroupGridCard(g) {
    var mediaStyle = g.image ? "background:var(--bg-subtle-2) center/cover no-repeat url('" + g.image + "');" : "background:var(--bg-subtle); display:flex; align-items:center; justify-content:center; color:var(--text-faint);";
    var editBody = g.isEditing ? '<div style="display:flex; flex-direction:column; gap:8px;">' + groupEditFormHtml(g) + '</div>' : '';
    return '<div class="product-card" style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .15s;">' +
      '<div' + (g.image ? ' data-action="view-product-image" data-image="' + esc(g.image) + '" data-name="' + esc(g.name) + '"' : '') + ' style="position:relative; height:130px; ' + mediaStyle + (g.image ? ' cursor:pointer;' : '') + '">' +
        (g.image ? '' : noImageIconSvg(40)) +
        (isAdmin && s.selectMode && !g.isEditing ? '<div style="position:absolute; top:8px; left:8px; z-index:2; background:rgba(255,255,255,.92); border-radius:7px; padding:4px; display:flex; line-height:0;">' + groupCheckboxHtml(g) + '</div>' : '') +
        '<span style="position:absolute; bottom:8px; left:10px; font-family:ui-monospace,monospace; font-size:10.5px; background:rgba(255,255,255,.85); padding:2px 6px; border-radius:5px; color:#444;">' + esc(g.categoryLabel) + (g.subcat ? " · " + esc(g.subcat) : "") + '</span>' +
      '</div>' +
      '<div style="padding:14px 15px 16px; display:flex; flex-direction:column; gap:8px; flex:1;">' +
        '<div>' +
          '<div style="font-weight:600; font-size:14.5px; line-height:1.35;">' + esc(g.name) + '</div>' +
          (g.note ? '<div style="font-size:12px; color:var(--text-faint); margin-top:2px;">' + esc(g.note) + '</div>' : '') +
          groupToggleHtml(g) +
        '</div>' +
        (g.isExpanded ? groupColorsHtml(g, false) : '') +
        (g.hasMultiPrice ? priceTiersHtml(g) :
        '<div style="display:flex; align-items:baseline; gap:7px; margin-top:2px;">' +
          '<span style="font-family:\'IBM Plex Sans Thai\'; font-weight:700; font-size:19px; color:var(--navy-action);">฿' + g.priceDisplay + '</span>' +
          (g.hasDiscount ? '<span style="font-size:12.5px; color:oklch(0.6 0.01 60); text-decoration:line-through;">฿' + g.oldPriceDisplay + '</span>' : '') +
          '<span style="font-size:11.5px; color:var(--text-faint);">/' + esc(g.unit) + '</span>' +
        '</div>') +
        editBody +
        (g.isEditing ? '' : '<div style="display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px;">' +
          '<span style="font-size:11.5px; padding:3px 8px; border-radius:6px; background:' + g.vatBadgeBg + '; color:' + g.vatBadgeColor + '; font-weight:600;">' + g.vatLabel + '</span>' +
          (isAdmin ? '<div style="display:flex; align-items:center; gap:6px;">' +
            '<button class="row-icon-btn" data-action="start-edit-group" data-key="' + esc(g.key) + '" aria-label="แก้ราคาทั้ง ' + g.members.length + ' สี" title="แก้ราคาทั้ง ' + g.members.length + ' สี">✏️</button>' +
            '<button class="row-icon-btn row-icon-btn--danger" data-action="request-delete-group" data-key="' + esc(g.key) + '" aria-label="ลบทั้ง ' + g.members.length + ' สี" title="ลบทั้ง ' + g.members.length + ' สี">🗑️</button>' +
          '</div>' : '') +
        '</div>') +
      '</div>' +
    '</div>';
  }

  var listHeaderHtml = '<div class="list-grid-row list-header\" style="display:grid; grid-template-columns:2.4fr 1fr 1fr 0.9fr 1fr; gap:10px; padding:10px 20px; background:var(--bg-subtle-2); font-size:12px; font-weight:700; color:oklch(0.45 0.01 60); text-transform:uppercase; letter-spacing:.03em;"><div>สินค้า</div><div>หมวดหมู่</div><div style="text-align:right;">ราคา</div><div style="text-align:right;">หน่วย</div><div>ภาษี</div></div>';

  var body;
  if (products.length === 0) {
    body = '<div style="text-align:center; padding:60px 20px; color:var(--text-faint);"><div style="font-size:32px; margin-bottom:8px;">🔎</div><div style="font-size:15px;">ไม่พบสินค้าที่ตรงกับเงื่อนไข ลองปรับคำค้นหาหรือหมวดหมู่</div></div>';
  } else if (gridActive) {
    body = '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:18px;">' + products.map(renderGridCard).join("") + '</div>';
  } else {
    body = '<div class="list-table" style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden;">' + listHeaderHtml + products.map(renderListRow).join("") + '</div>';
  }

  var paginationBar = this.renderPagination(pageInfo.page, pageInfo.totalPages, "products-go-page");

  return '<div class="page-content" style="padding:28px 32px 56px; max-width:1500px; margin:0 auto;">' +
    '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-bottom:28px;">' + statCardsHtml + '</div>' +
    this.renderMobileCatBar() +
    productsErrorBanner + importBanner + controls + colorSplitPanel + colorRestorePanel + bulkBar + manageCategoriesPanel + addForm + resultCount + body + paginationBar +
  '</div>';
};

// Shared pagination bar (« ก่อนหน้า | 1 2 3 … | ถัดไป »). `actionName` is the
// data-action value each page/prev/next button dispatches, carrying the
// target page number in data-page; hidden entirely when everything fits on
// one page.
Dashboard.prototype.renderPagination = function (page, totalPages, actionName) {
  if (totalPages <= 1) return "";
  var btnBase = "min-width:40px; min-height:40px; padding:0 12px; box-sizing:border-box; border-radius:8px; border:1px solid var(--border-input); background:#fff; color:var(--text-body); font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;";
  var btnActive = "min-width:40px; min-height:40px; padding:0 12px; box-sizing:border-box; border-radius:8px; border:1px solid var(--navy-action); background:var(--navy-action); color:#fff; font-size:13.5px; font-weight:700; font-family:inherit;";
  var btnDisabled = "min-width:40px; min-height:40px; padding:0 12px; box-sizing:border-box; border-radius:8px; border:1px solid var(--border-input); background:var(--bg-subtle); color:var(--text-faint); font-size:13.5px; font-weight:600; cursor:not-allowed; font-family:inherit;";
  var prevDisabled = page <= 1;
  var nextDisabled = page >= totalPages;

  var html = '<div class="pagination-bar" style="display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; margin-top:22px;">';
  html += '<button type="button" data-action="' + actionName + '" data-page="' + (page - 1) + '"' + (prevDisabled ? " disabled" : "") + ' style="' + (prevDisabled ? btnDisabled : btnBase) + '">« ก่อนหน้า</button>';
  paginationRange(page, totalPages).forEach(function (p) {
    if (p === "...") {
      html += '<span style="min-width:24px; text-align:center; color:var(--text-faint); font-size:13px;">…</span>';
      return;
    }
    var isActive = p === page;
    html += '<button type="button" data-action="' + actionName + '" data-page="' + p + '" style="' + (isActive ? btnActive : btnBase) + '">' + p + '</button>';
  });
  html += '<button type="button" data-action="' + actionName + '" data-page="' + (page + 1) + '"' + (nextDisabled ? " disabled" : "") + ' style="' + (nextDisabled ? btnDisabled : btnBase) + '">ถัดไป »</button>';
  html += '</div>';
  return html;
};

Dashboard.prototype.renderCategoryBox = function () {
  var s = this.state;
  var self = this;
  var catExpanded = !s.catSidebarCollapsed;
  // Subcategories aren't a master list -- they're derived per main category
  // from whatever `subcat` values actually exist on products right now (see
  // subcatOptionsFor), so a category only gets an expand arrow once someone
  // has actually used subcategories under it. "ทุกหมวดหมู่" spans every main
  // category, so it never gets one.
  var categoryRowsHtml = [ALL_CATEGORY].concat(s.categories).map(function (opt) {
    var subcats = opt.value === "all" ? [] : self.subcatOptionsFor(opt.value);
    var hasSubcats = subcats.length > 0;
    var mainIsActive = opt.value === s.category && !s.subcat;
    var subExpanded = hasSubcats && !!s.expandedCatSidebar[opt.value];

    var labelBtn = '<button data-action="set-category" data-category="' + esc(opt.value) + '" class="cat-sidebar-btn" style="flex:1; min-width:0; box-sizing:border-box; text-align:left; padding:9px 10px 9px 34px; border:none; border-radius:8px; font-size:13.5px; font-weight:' + (mainIsActive ? "600" : "400") + '; font-family:inherit; cursor:pointer; background:transparent; color:' + (mainIsActive ? "#fff" : "rgba(255,255,255,.75)") + ';">' +
      '<span style="min-width:0; overflow-wrap:break-word;">' + esc(opt.label) + '</span>' +
    '</button>';

    var arrowBtn = hasSubcats
      ? '<button type="button" data-action="toggle-cat-subcats" data-category="' + esc(opt.value) + '" aria-label="' + (subExpanded ? "ยุบหมวดย่อย" : "ขยายหมวดย่อย") + '" style="flex:none; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border:none; border-radius:6px; background:transparent; color:rgba(255,255,255,.5); cursor:pointer; padding:0;">' +
          '<span style="font-size:13px; display:inline-block; transition:transform .15s; transform:rotate(' + (subExpanded ? "90deg" : "0deg") + ');">›</span>' +
        '</button>'
      : '<span style="flex:none; width:28px;"></span>';

    var row = '<div style="display:flex; align-items:center; border-radius:8px; background:' + (mainIsActive ? "rgba(255,255,255,.14)" : "transparent") + ';">' + labelBtn + arrowBtn + '</div>';

    var subRowsHtml = "";
    if (subExpanded) {
      subRowsHtml = subcats.map(function (sc) {
        var subIsActive = opt.value === s.category && s.subcat === sc;
        return '<button data-action="set-subcat" data-category="' + esc(opt.value) + '" data-subcat="' + esc(sc) + '" class="cat-sidebar-btn" style="display:block; width:100%; min-width:0; box-sizing:border-box; text-align:left; padding:8px 10px 8px 54px; border:none; border-radius:8px; font-size:12.5px; font-weight:' + (subIsActive ? "600" : "400") + '; font-family:inherit; cursor:pointer; background:' + (subIsActive ? "rgba(255,255,255,.14)" : "transparent") + '; color:' + (subIsActive ? "#fff" : "rgba(255,255,255,.6)") + ';">' + esc(sc) + '</button>';
      }).join("");
    }

    return row + subRowsHtml;
  }).join("");

  return '<div class="cat-sidebar" style="width:100%; min-width:0; box-sizing:border-box; background:transparent; border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:1px; margin:2px 0 8px;">' +
      '<button data-action="toggle-cat-sidebar" class="cat-sidebar-btn" style="display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; min-width:0; box-sizing:border-box; text-align:left; padding:10px; border:none; border-radius:8px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; background:transparent; color:#fff;">' +
        '<span style="display:flex; align-items:center; gap:10px;"><span style="font-size:15px;">📦</span><span>สินค้า</span></span>' +
        '<span style="font-size:11px; color:rgba(255,255,255,.6); transition:transform .15s; transform:rotate(' + (catExpanded ? "0deg" : "-90deg") + ');">▾</span>' +
      '</button>' +
      (catExpanded ? categoryRowsHtml : "") +
    '</div>';
};

Dashboard.prototype.renderMobileCatBar = function () {
  var s = this.state;
  var chips = [ALL_CATEGORY].concat(s.categories).map(function (opt) {
    var active = opt.value === s.category;
    return '<button data-action="set-category" data-category="' + esc(opt.value) + '" style="padding:8px 14px; border-radius:999px; border:1px solid ' + (active ? "var(--navy-action)" : "var(--border-input)") + '; background:' + (active ? "var(--navy-action)" : "#fff") + '; color:' + (active ? "#fff" : "var(--text-body)") + '; font-weight:600; font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap;">' + esc(opt.label) + '</button>';
  }).join("");
  var html = '<div class="mobile-cat-bar">' + chips + '</div>';

  // Phones hide the sidebar's category box, so the chosen category's
  // subcategories get their own row here. "ทั้งหมด" re-selects the main
  // category, which clears the subcategory.
  var subcats = s.category !== "all" ? this.subcatOptionsFor(s.category) : [];
  if (subcats.length) {
    var subChip = function (attrs, label, active) {
      return '<button ' + attrs + ' style="min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; padding:8px 12px; border-radius:999px; border:1px solid ' + (active ? "var(--navy-action-soft-border)" : "var(--border-input)") + '; background:' + (active ? "var(--navy-action-soft)" : "#fff") + '; color:' + (active ? "var(--navy-action-soft-text)" : "var(--text-muted)") + '; font-weight:' + (active ? "700" : "500") + '; font-size:12px; cursor:pointer; font-family:inherit; text-align:left;">' + label + '</button>';
    };
    html += '<div class="mobile-subcat-bar">' +
      '<span style="font-size:11.5px; font-weight:600; color:var(--text-faint); margin-right:2px;">หมวดย่อย</span>' +
      subChip('data-action="set-category" data-category="' + esc(s.category) + '"', "ทั้งหมด", !s.subcat) +
      subcats.map(function (sc) {
        return subChip('data-action="set-subcat" data-category="' + esc(s.category) + '" data-subcat="' + esc(sc) + '"', esc(sc), s.subcat === sc);
      }).join("") +
    '</div>';
  }
  return html;
};

var CALC_SIDEBAR_ITEMS = [
  { value: "slab", label: "คำนวณแผ่น" },
  { value: "steel", label: "คำนวณเหล็ก" },
  { value: "stirrup", label: "คำนวณเหล็กปอก" },
];

Dashboard.prototype.renderCalcSidebar = function () {
  var s = this.state;
  var calcExpanded = !s.calcSidebarCollapsed;
  var itemsHtml = CALC_SIDEBAR_ITEMS.map(function (opt) {
    var isActive = opt.value === s.calcProductType;
    return '<button data-action="calc-set-type" data-type="' + opt.value + '" class="cat-sidebar-btn" style="display:flex; align-items:center; gap:8px; width:100%; min-width:0; box-sizing:border-box; text-align:left; padding:9px 10px 9px 34px; border:none; border-radius:8px; font-size:13.5px; font-weight:' + (isActive ? "600" : "400") + '; font-family:inherit; cursor:pointer; background:' + (isActive ? "rgba(255,255,255,.14)" : "transparent") + '; color:' + (isActive ? "#fff" : "rgba(255,255,255,.75)") + ';">' +
      '<span style="min-width:0; overflow-wrap:break-word;">' + esc(opt.label) + '</span>' +
    '</button>';
  }).join("");

  return '<div class="cat-sidebar" style="width:100%; min-width:0; box-sizing:border-box; background:transparent; border-radius:14px; padding:10px; display:flex; flex-direction:column; gap:1px; margin:2px 0 8px;">' +
      '<button data-action="toggle-calc-sidebar" class="cat-sidebar-btn" style="display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; min-width:0; box-sizing:border-box; text-align:left; padding:10px; border:none; border-radius:8px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; background:transparent; color:#fff;">' +

Dashboard.prototype.computeCalcRows = function () {
  var s = this.state;
  var plateWidth = parseFloat(s.calcPlateWidth) || 0;
  var weightPerSqm = parseFloat(s.calcWeightPerSqm) || 0;
  return s.calcRows.map(function (r, i) {
    var length = parseFloat(r.length);
    var qty = parseInt(r.qty, 10);
    var discount = parseFloat(r.discount);
    var price = parseFloat(r.price);
    var hasData = !isNaN(length) && length > 0 && !isNaN(qty) && qty > 0 && !isNaN(price) && price > 0;
    if (!hasData) {
      return { index: i + 1, label: r.label, length: r.length, qty: r.qty, discount: r.discount, price: r.price, hasData: false };
    }
    var d = isNaN(discount) ? 0 : discount;
    var discountedPrice = Math.round(price * (1 - d / 100));
    var sqmPerSheet = plateWidth * length;
    var pricePerSheet = discountedPrice * sqmPerSheet;
    var weightPerSheet = weightPerSqm * sqmPerSheet;
    return {
      index: i + 1, label: r.label, length: r.length, qty: r.qty, discount: r.discount, price: r.price,
      hasData: true,
      discountedPrice: discountedPrice, sqmPerSheet: sqmPerSheet, pricePerSheet: pricePerSheet,
      weightPerSheet: weightPerSheet, totalSqm: sqmPerSheet * qty, totalWeight: weightPerSheet * qty, totalPrice: pricePerSheet * qty,
    };
  });
};

Dashboard.prototype.computeTruckPlan = function (totalWeightKg) {
  var totalTon = totalWeightKg / 1000;
  var rows = TRUCK_TYPES.map(function (t) {
    var trips = totalTon > 0 ? Math.ceil(totalTon / t.maxTon) : 0;
    return { name: t.name, maxTon: t.maxTon, trips: trips };
  });
  var recommended = null;
  if (totalTon > 0) {
    recommended = rows.filter(function (r) { return r.trips === 1; })[0] || rows[rows.length - 1];
  }
  return { rows: rows, recommended: recommended };
};

    var discountNum = parseFloat(r.discount);
    var discountOverLimit = !isNaN(discountNum) && discountNum > 7;
    var discountInputStyle = discountOverLimit ? rowInputStyle + "color:oklch(0.5 0.18 25); border-color:oklch(0.6 0.18 25); background:oklch(0.95 0.04 25); font-weight:700;" : rowInputStyle;
    cells.push('<input type="text" inputmode="decimal" data-calc-row="' + (r.index - 1) + '" data-calc-store="calcRows" data-calc-field="discount" value="' + esc(r.discount) + '" style="' + discountInputStyle + '" />');
    cells.push('<input type="text" inputmode="decimal" data-calc-row="' + (r.index - 1) + '" data-calc-store="calcRows" data-calc-field="price" value="' + esc(r.price) + '" style="' + rowInputStyle + '" />');
    if (r.hasData) {
      cells.push('<div style="font-size:12.5px;">' + fmtN(r.discountedPrice, 2) + '</div>');
      cells.push('<div style="font-size:12.5px;">' + fmtN(r.sqmPerSheet, 4) + '</div>');
      cells.push('<div style="font-size:12.5px; font-weight:600;">' + fmtN(r.pricePerSheet, 2) + '</div>');
      cells.push('<div style="font-size:12.5px;">' + fmtN(r.weightPerSheet, 2) + '</div>');

      cells.push('<div style="font-size:12.5px;">' + fmt(Math.round(r.totalWeight)) + '</div>');
      cells.push('<div style="font-size:12.5px; font-weight:700; color:var(--navy-action);">' + fmtN(r.totalPrice, 2) + '</div>');
    } else {
      cells.push('<div></div>', '<div></div>', '<div></div>', '<div></div>', '<div></div>', '<div></div>', '<div></div>');
    }
    return '<div class="calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:10px 14px; border-top:1px solid var(--border-light);">' + cells.join("") + '</div>';
  }).join("");

  var totalsRow = '<div class="calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:12px 14px; border-top:2px solid oklch(0.85 0.01 60); background:var(--bg-subtle-2); font-weight:700; font-size:12.5px;">' +
    '<div style="grid-column:1 / span 10; text-align:right; padding-right:8px;">รวมทั้งหมด</div>' +
    '<div>' + fmtN(totalSqm, 2) + '</div>' +
    '<div>' + fmt(Math.round(totalWeight)) + '</div>' +
    '<div style="color:var(--navy-action);">' + fmtN(totalPrice, 2) + '</div>' +
  '</div>';

  var discountTiersBox = '<div style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:20px;">' +
    '<div style="padding:12px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border-light);">เงื่อนไขการให้ส่วนลด</div>' +
    DISCOUNT_TIERS.map(function (t, i) {
      return '<div style="display:grid; grid-template-columns:minmax(140px,200px) 1fr; ' + (i === 0 ? "" : "border-top:1px solid var(--border-light);") + '">' +
        '<div style="padding:10px 14px; background:' + t.bg + '; color:' + t.color + '; font-weight:700; font-size:12.5px; display:flex; align-items:center;">' + esc(t.label) + '</div>' +
        '<div style="padding:10px 14px; font-size:12.5px; color:var(--text-body); display:flex; align-items:center;">' + esc(t.condition) + '</div>' +
      '</div>';
    }).join("") +
  '</div>';

  var table = '<div class="list-table" style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow-x:auto; margin-bottom:24px;">' +
    '<div>' + headerRow + dataRows + totalsRow + '</div>' +
  '</div>';

  var truckTable = '<div style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden;">' +
    '<div style="padding:14px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--border-light);">ข้อกำหนดน้ำหนักบรรทุก</div>' +
    '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:10px 16px; background:var(--bg-subtle-2); font-size:11.5px; font-weight:700; color:oklch(0.45 0.01 60);"><div>ประเภทรถ</div><div>บรรทุกไม่เกิน (ตัน)</div><div>จำนวนเที่ยวที่ต้องใช้</div></div>' +
    truckPlan.rows.map(function (t) {
      return '<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:10px 16px; border-top:1px solid var(--border-light); font-size:13px;"><div>' + t.name + '</div><div style="color:var(--navy-action); font-weight:600;">' + t.maxTon + '</div><div>' + (t.trips > 0 ? t.trips + " เที่ยว" : "-") + '</div></div>';
    }).join("") +
  '</div>';

  var summaryRow = function (label, value, bold) {
    return '<div style="display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--border-light); font-size:' + (bold ? "14.5px" : "13px") + '; font-weight:' + (bold ? "700" : "500") + ';"><span style="color:var(--text-muted);">' + label + '</span><span>' + value + '</span></div>';
  };

  var summaryPanel = '<div style="background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 20px;">' +
    summaryRow("มูลค่ารวม (ไม่รวม VAT)", "฿" + fmtN(totalPrice, 2)) +
    summaryRow("VAT " + fmtN(vatPercent, 0) + "%", "฿" + fmtN(vatAmount, 2)) +
    summaryRow("รวมทั้งสิ้น (รวม VAT)", "฿" + fmtN(grandTotal, 2), true) +
    summaryRow("พื้นที่รวม (ตรม.)", fmtN(totalSqm, 2)) +
    summaryRow("น้ำหนักรวม (กก. / ตัน)", fmt(Math.round(totalWeight)) + " กก. = " + fmtN(totalWeight / 1000, 2) + " ตัน") +
    summaryRow("ประมาณเที่ยวรถ 10 ล้อ", (estTrips10Wheel > 0 ? estTrips10Wheel + " เที่ยว" : "-") + " (เต็มรถ ~" + fmt(truck10Cap) + " ตรม./เที่ยว)") +
  '</div>';

  var recommendBox = truckPlan.recommended ?
    '<div style="margin-top:16px; background:oklch(0.94 0.05 155); border:1px solid oklch(0.8 0.08 155); border-radius:12px; padding:16px 20px; text-align:center; font-weight:700; font-size:14.5px; color:oklch(0.35 0.09 155);">' +
      'รถที่แนะนำสำหรับรายการนี้: ' + truckPlan.recommended.name + ' (บรรทุกไม่เกิน ' + truckPlan.recommended.maxTon + ' ตัน) — ' + truckPlan.recommended.trips + ' เที่ยว' +
    '</div>' :
    '<div style="margin-top:16px; background:var(--bg-subtle-2); border:1px solid var(--border); border-radius:12px; padding:16px 20px; text-align:center; font-size:13.5px; color:var(--text-faint);">กรอกข้อมูลสินค้าด้านบนเพื่อดูคำแนะนำรถขนส่ง</div>';

  var footnote = '<div style="margin-top:16px; font-size:11.5px; color:var(--text-faint); line-height:1.6;">' +
    'หมายเหตุ: ส่วนลดเกิน 7% ต้องขออนุมัติผู้จัดการก่อนเสนอราคา<br>' +
    'คำแนะนำรถคิดจากน้ำหนักอย่างเดียว ควรตรวจสอบพื้นที่บรรทุกประกอบด้วย (รถ 10 ล้อ ~' + fmt(truck10Cap) + ' ตรม./เที่ยว)' +
  '</div>';

  return '<div style="margin-bottom:20px; font-size:13px; color:var(--text-muted);">คำนวณราคาขายต่อแผ่นและแผนรถขนส่ง สำหรับแผ่นพื้น/ผลิตภัณฑ์คอนกรีตสำเร็จรูป</div>' +
    topInputs + discountTiersBox + table +
    '<div class="calc-summary-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;">' + truckTable + summaryPanel + '</div>' +
    recommendBox + footnote;
};

Dashboard.prototype.computeSteelRows = function () {
  return this.state.calcSteelRows.map(function (r, i) {
    var product = STEEL_PRODUCTS_BY_ID[r.product];
    var qty = parseFloat(r.qty);
    var qtyValid = !isNaN(qty) && qty > 0;
    var sellPrice = parseFloat(r.sellPrice); if (isNaN(sellPrice)) sellPrice = 0;
    var row = {
      index: i + 1, product: r.product, qty: r.qty, sellPrice: r.sellPrice,
      hasProduct: !!product, unit: product ? product.unit : "", weightPerUnit: product ? product.weight : null,
      hasTotals: !!product && qtyValid,
    };
    if (row.hasTotals) {
      row.totalWeight = product.weight * qty;
      row.totalSell = sellPrice * qty;
    }
    return row;
  });
};

Dashboard.prototype.renderSteelCalc = function () {
  var rows = this.computeSteelRows();

  var totalWeight = 0, totalSell = 0;
  rows.forEach(function (r) {
    if (r.hasTotals) { totalWeight += r.totalWeight; totalSell += r.totalSell; }
  });

  var rowInputStyle = "padding:7px 9px; border-radius:6px; border:1px solid oklch(0.85 0.01 60); font-size:12.5px; font-family:inherit; width:100%; box-sizing:border-box;";
  var headerCells = ["ลำดับ", "สินค้า", "จำนวน", "หน่วย", "น้ำหนัก/หน่วย (กก.)", "น้ำหนักรวม (กก.)", "ราคาขาย/หน่วย (บาท)", "ยอดขายรวม (บาท)"];
  var colWidths = "48px minmax(220px,2fr) minmax(80px,0.8fr) minmax(64px,0.6fr) minmax(104px,1fr) minmax(104px,1fr) minmax(112px,1.05fr) minmax(120px,1.1fr)";

  var productOptionsHtml = function (selected) {
    return '<option value=""' + (selected ? "" : " selected") + '>- เลือก -</option>' +
      STEEL_PRODUCTS.map(function (p) { return '<option value="' + p.id + '"' + (selected === p.id ? " selected" : "") + '>' + esc(p.label) + '</option>'; }).join("");
  };

  var headerRow = '<div class="steel-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; padding:12px 14px; background:var(--bg-subtle-2); font-size:11.5px; font-weight:700; color:oklch(0.45 0.01 60); line-height:1.35;">' +
    headerCells.map(function (h, i) {
      return i === 0
        ? '<div style="position:sticky; left:0; z-index:2; background:var(--bg-subtle-2); box-shadow:2px 0 4px rgba(0,0,0,.06);">' + h + '</div>'
        : '<div>' + h + '</div>';
    }).join("") + '</div>';

  var dataRows = rows.map(function (r) {
    var cells = [];
    cells.push('<div style="position:sticky; left:0; z-index:1; background:#fff; font-size:12.5px; color:var(--text-muted); box-shadow:2px 0 4px rgba(0,0,0,.06);">' + r.index + '</div>');
    cells.push('<select data-calc-row="' + (r.index - 1) + '" data-calc-field="product" data-calc-store="calcSteelRows" style="' + rowInputStyle + ' background:#fff;">' + productOptionsHtml(r.product) + '</select>');
    cells.push('<input type="text" inputmode="numeric" data-calc-row="' + (r.index - 1) + '" data-calc-field="qty" data-calc-store="calcSteelRows" value="' + esc(r.qty) + '" style="' + rowInputStyle + '" />');
    cells.push('<div style="font-size:12.5px;">' + esc(r.unit || "") + '</div>');
    cells.push('<div style="font-size:12.5px;">' + (r.weightPerUnit != null ? fmtN(r.weightPerUnit, 2) : "") + '</div>');
    cells.push('<div style="font-size:12.5px;">' + (r.hasTotals ? fmtN(r.totalWeight, 2) : "") + '</div>');
    cells.push('<input type="text" inputmode="decimal" data-calc-row="' + (r.index - 1) + '" data-calc-field="sellPrice" data-calc-store="calcSteelRows" value="' + esc(r.sellPrice) + '" style="' + rowInputStyle + '" />');
    cells.push('<div style="font-size:12.5px; font-weight:700; color:var(--navy-action);">' + (r.hasTotals ? fmtN(r.totalSell, 2) : "") + '</div>');
    return '<div class="steel-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:10px 14px; border-top:1px solid var(--border-light);">' + cells.join("") + '</div>';
  }).join("");

  var totalsRow = '<div class="steel-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:12px 14px; border-top:2px solid oklch(0.85 0.01 60); background:var(--bg-subtle-2); font-weight:700; font-size:12.5px;">' +
    '<div style="grid-column:1 / span 4; text-align:right; padding-right:8px;">รวมทั้งหมด</div>' +
    '<div></div>' +
    '<div>' + fmtN(totalWeight, 2) + '</div>' +
    '<div></div>' +
    '<div style="color:var(--navy-action);">' + fmtN(totalSell, 2) + '</div>' +
  '</div>';

  var table = '<div class="list-table" style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow-x:auto; margin-bottom:24px;">' +
    '<div>' + headerRow + dataRows + totalsRow + '</div>' +
  '</div>';

  return '<div style="margin-bottom:20px; font-size:13px; color:var(--text-muted); line-height:1.6;">เลือกสินค้าในคอลัมน์ "สินค้า" แล้วกรอกจำนวนตามหน่วยที่แสดง (เหล็กเส้นกรอกจำนวนเส้น) และกรอกราคาขาย/หน่วยเอง ระบบคำนวณน้ำหนักรวมและยอดขายรวม (จำนวน × ราคาขาย/หน่วย) ให้อัตโนมัติ</div>' +
    table;
};

Dashboard.prototype.computeStirrupRows = function () {
  return this.state.calcStirrupRows.map(function (r, i) {
    var product = STIRRUP_PRODUCTS_BY_ID[r.product];
    var qty = parseFloat(r.qty);
    var qtyValid = !isNaN(qty) && qty > 0;
    var sellPrice = parseFloat(r.sellPrice); if (isNaN(sellPrice)) sellPrice = 0;
    var row = {
      index: i + 1, product: r.product, qty: r.qty, sellPrice: r.sellPrice,
      hasProduct: !!product, weightPerBundle: product ? product.weightPerBundle : null,
      hasTotals: !!product && qtyValid,
    };
    if (row.hasTotals) {
      row.totalWeight = (qty / STIRRUP_BUNDLE_SIZE) * product.weightPerBundle;
      row.totalSell = sellPrice * row.totalWeight;
    }
    return row;
  });
};

Dashboard.prototype.renderStirrupCalc = function () {
  var rows = this.computeStirrupRows();

  var totalWeight = 0, totalSell = 0;
  rows.forEach(function (r) {
    if (r.hasTotals) { totalWeight += r.totalWeight; totalSell += r.totalSell; }
  });

  var rowInputStyle = "padding:7px 9px; border-radius:6px; border:1px solid oklch(0.85 0.01 60); font-size:12.5px; font-family:inherit; width:100%; box-sizing:border-box;";
  var headerCells = ["ลำดับ", "สินค้า", "น้ำหนัก/มัด (กก. ต่อ " + STIRRUP_BUNDLE_SIZE + " ปอก)", "จำนวน (ปอก)", "น้ำหนักรวม (กก.)", "ราคาขาย/กก. (บาท)", "ยอดขายรวม (บาท)"];
  var colWidths = "48px minmax(200px,2fr) minmax(150px,1.2fr) minmax(100px,0.9fr) minmax(120px,1.1fr) minmax(130px,1.2fr) minmax(140px,1.2fr)";

  var productOptionsHtml = function (selected) {
    return '<option value=""' + (selected ? "" : " selected") + '>- เลือก -</option>' +
      STIRRUP_PRODUCTS.map(function (p) { return '<option value="' + p.id + '"' + (selected === p.id ? " selected" : "") + '>' + esc(p.label) + '</option>'; }).join("");
  };

  var headerRow = '<div class="stirrup-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; padding:12px 14px; background:var(--bg-subtle-2); font-size:11.5px; font-weight:700; color:oklch(0.45 0.01 60); line-height:1.35;">' +
    headerCells.map(function (h, i) {
      return i === 0
        ? '<div style="position:sticky; left:0; z-index:2; background:var(--bg-subtle-2); box-shadow:2px 0 4px rgba(0,0,0,.06);">' + h + '</div>'
        : '<div>' + h + '</div>';
    }).join("") + '</div>';

  var dataRows = rows.map(function (r) {
    var cells = [];
    cells.push('<div style="position:sticky; left:0; z-index:1; background:#fff; font-size:12.5px; color:var(--text-muted); box-shadow:2px 0 4px rgba(0,0,0,.06);">' + r.index + '</div>');
    cells.push('<select data-calc-row="' + (r.index - 1) + '" data-calc-field="product" data-calc-store="calcStirrupRows" style="' + rowInputStyle + ' background:#fff;">' + productOptionsHtml(r.product) + '</select>');
    cells.push('<div style="font-size:12.5px;">' + (r.weightPerBundle != null ? fmtN(r.weightPerBundle, 2) : "") + '</div>');
    cells.push('<input type="text" inputmode="numeric" data-calc-row="' + (r.index - 1) + '" data-calc-field="qty" data-calc-store="calcStirrupRows" value="' + esc(r.qty) + '" style="' + rowInputStyle + '" />');
    cells.push('<div style="font-size:12.5px;">' + (r.hasTotals ? fmtN(r.totalWeight, 2) : "") + '</div>');
    cells.push('<input type="text" inputmode="decimal" data-calc-row="' + (r.index - 1) + '" data-calc-field="sellPrice" data-calc-store="calcStirrupRows" value="' + esc(r.sellPrice) + '" style="' + rowInputStyle + '" />');
    cells.push('<div style="font-size:12.5px; font-weight:700; color:var(--navy-action);">' + (r.hasTotals ? fmtN(r.totalSell, 2) : "") + '</div>');
    return '<div class="stirrup-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:10px 14px; border-top:1px solid var(--border-light);">' + cells.join("") + '</div>';
  }).join("");

  var totalsRow = '<div class="stirrup-calc-row" style="display:grid; grid-template-columns:' + colWidths + '; gap:8px; align-items:center; padding:12px 14px; border-top:2px solid oklch(0.85 0.01 60); background:var(--bg-subtle-2); font-weight:700; font-size:12.5px;">' +
    '<div style="grid-column:1 / span 3; text-align:right; padding-right:8px;">รวมทั้งหมด</div>' +
    '<div></div>' +
    '<div>' + fmtN(totalWeight, 2) + '</div>' +
    '<div></div>' +
    '<div style="color:var(--navy-action);">' + fmtN(totalSell, 2) + '</div>' +
  '</div>';

  var table = '<div class="list-table" style="background:#fff; border:1px solid var(--border); border-radius:14px; overflow-x:auto; margin-bottom:24px;">' +
    '<div>' + headerRow + dataRows + totalsRow + '</div>' +
  '</div>';

  return '<div style="margin-bottom:20px; font-size:13px; color:var(--text-muted); line-height:1.6;">เลือกขนาดเหล็กปอกในคอลัมน์ "สินค้า" แล้วกรอกจำนวนเป็นปอก และกรอกราคาขาย/กก. เอง ระบบคำนวณน้ำหนักรวม (จำนวนปอก ÷ ' + STIRRUP_BUNDLE_SIZE + ' × น้ำหนัก/มัด) และยอดขายรวม (น้ำหนักรวม × ราคาขาย/กก.) ให้อัตโนมัติ<br>หมายเหตุ: จำนวน ' + STIRRUP_BUNDLE_SIZE + ' ปอก/มัด</div>' +
    table;
};

Dashboard.prototype.renderCalcPage = function () {
  var s = this.state;

  var typeSelector = '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;">' +
    CALC_PRODUCT_TYPES.map(function (t) {
      var active = s.calcProductType === t.value;
      return '<button data-action="calc-set-type" data-type="' + t.value + '" style="min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; padding:10px 18px; border-radius:10px; border:1px solid ' + (active ? "var(--navy-action)" : "var(--border-input)") + '; background:' + (active ? "var(--navy-action)" : "#fff") + '; color:' + (active ? "#fff" : "var(--text-body)") + '; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;">' + esc(t.label) + '</button>';
    }).join("") +
  '</div>';

  var typeConfig = CALC_PRODUCT_TYPES.filter(function (t) { return t.value === s.calcProductType; })[0];
  var body = s.calcProductType === "slab" ? this.renderSlabCalc() :
    s.calcProductType === "steel" ? this.renderSteelCalc() :
    s.calcProductType === "stirrup" ? this.renderStirrupCalc() :
    '<div style="background:#fff; border:1px solid var(--border); border-radius:14px; padding:48px 20px; text-align:center; color:var(--text-faint); font-size:14px;">ยังไม่มีเครื่องคำนวณสำหรับ "' + esc(typeConfig ? typeConfig.label : s.calcProductType) + '"</div>';

  return '<div class="page-content" style="padding:28px 32px 56px; max-width:1500px; margin:0 auto;">' +
    '<div style="margin-bottom:20px;"><div style="font-family:\'IBM Plex Sans Thai\'; font-weight:700; font-size:22px;">คำนวณราคาสินค้า</div><div style="font-size:13px; color:var(--text-muted); margin-top:2px;">เลือกประเภทสินค้าที่ต้องการคำนวณราคา</div></div>' +
    typeSelector + body +
  '</div>';
};

/* ---------- bootstrap ---------- */

new Dashboard(document.getElementById("app"));
