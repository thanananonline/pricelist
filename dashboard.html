  <!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดราคาสินค้า - ธนานันท์ฮาร์ดแวร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    /* Navy (กรมท่า) - พื้นเมนูด้านข้าง/แถบบน และปุ่ม/ข้อความเน้นหลักโทนเดียวกัน */
    --navy: oklch(0.2 0.12 275);              /* พื้นเมนูด้านข้าง (sidebar) */
    --navy-topbar: oklch(0.26 0.13 275);      /* พื้นแถบบน (topbar) / หน้าเข้าสู่ระบบ */
    --navy-action: oklch(0.38 0.15 275);      /* ปุ่มหลัก / ราคา / ลิงก์เน้น */
    --navy-action-soft: oklch(0.92 0.05 275); /* พื้นอ่อนของชิป/ไอคอนโทนน้ำเงิน */
    --navy-action-soft-border: oklch(0.85 0.06 275);
    --navy-action-soft-text: oklch(0.32 0.14 275);
    --navy-border: oklch(0.6 0.15 275);       /* กรอบช่องกรอกตอนแก้ไขแบบ inline */

    /* Accent orange (สีเน้นเดิม) */
    --accent-orange: oklch(0.62 0.17 45);

    /* Danger red (ใช้เฉพาะปุ่มลบ/ข้อความแจ้งเตือน) */
    --danger-red: oklch(0.5 0.15 30);
    --danger-red-bg: oklch(0.94 0.03 30);

    /* Success green (toast สำเร็จ / ป้าย "+1" ตอนย้ายไฟล์เข้าโฟลเดอร์) */
    --success-green: oklch(0.45 0.14 150);

    /* กลาง: ข้อความ / เส้นขอบ / พื้นหลัง */
    --text-strong: oklch(0.24 0.01 60);
    --text-body: oklch(0.4 0.01 60);
    --text-muted: oklch(0.5 0.01 60);
    --text-faint: oklch(0.55 0.01 60);
    --border: oklch(0.9 0.008 60);
    --border-light: oklch(0.93 0.006 70);
    --border-input: oklch(0.87 0.008 60);
    --bg-page: oklch(0.975 0.006 70);
    --bg-input: oklch(0.98 0.004 70);
    --bg-subtle: oklch(0.95 0.006 70);
    --bg-subtle-2: oklch(0.96 0.006 70);
    --bg-zebra: oklch(0.985 0.003 70);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans Thai', sans-serif; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 8px; }
  a { color: #2E2E86; }
  a:hover { color: #23236A; }
  button, input, select { font-family: inherit; }
  .folder-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  /* Drag a PDF onto a subfolder card to move it there (admin only). These
     classes are toggled straight on the DOM while dragging - never via
     setState, since a re-render would destroy the dragged element. */
  .folder-card { transition: transform .2s ease, box-shadow .2s ease; }
  [draggable="true"][data-file-id] { cursor: grab; transition: opacity .2s ease, transform .2s ease; }
  .dragging-file { opacity: .4; transform: scale(.98); }
  /* dropped, waiting on the API: fade + lift away, not clickable */
  .file-moving { opacity: 0 !important; transform: translateY(-10px) !important; pointer-events: none; }
  /* while one of our files is being dragged (class on the dashboard root):
     every droppable card gets a dashed navy border and a slow pulse, and
     its แก้ไข/ย้าย/ลบ buttons step aside */
  .file-dragging .folder-card { border-style: dashed !important; border-color: var(--navy-action) !important; animation: folder-pulse 1.6s ease-in-out infinite; }
  .file-dragging .folder-card .folder-card-actions { opacity: 0; pointer-events: none; }
  .folder-card-actions { transition: opacity .15s ease; }
  .folder-card.drop-target { border-style: solid !important; border-color: var(--navy-action) !important; background: var(--navy-action-soft) !important; box-shadow: 0 0 0 3px var(--navy-action-soft), 0 6px 18px rgba(0,0,0,.08); }
  .file-dragging .folder-card.drop-target { animation: none; transform: scale(1.05); }
  /* 📁 → 📂 and "N ไฟล์" → "ปล่อยเพื่อย้ายมาที่นี่" while hovered */
  .folder-card .folder-icon-open, .folder-card .folder-drop-hint { display: none; }
  .folder-card.drop-target .folder-icon-closed, .folder-card.drop-target .folder-count { display: none; }
  .folder-card.drop-target .folder-icon-open { display: inline-block; animation: folder-icon-pop .3s ease-out forwards; }
  .folder-card.drop-target .folder-drop-hint { display: block; font-weight: 600; color: var(--navy-action) !important; }
  /* after a successful move: the target card bounces and a green "+1"
     floats off its file count; after a failed drop it shakes once */
  .folder-card.drop-success { animation: folder-drop-bounce .35s ease-out; }
  .folder-card.drop-failed { animation: folder-drop-shake .4s ease-in-out; }
  .folder-plus-one { display: inline-block; margin-left: 6px; font-weight: 700; color: var(--success-green); animation: folder-plus-one .7s ease-out forwards; }
  @keyframes folder-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }
  @keyframes folder-icon-pop { 0% { transform: translateY(0); } 60% { transform: translateY(-6px); } 100% { transform: translateY(-2px); } }
  @keyframes folder-drop-bounce { 0% { transform: scale(1); } 45% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes folder-drop-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @keyframes folder-plus-one { 0% { opacity: 0; transform: translateY(4px); } 20% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-18px); } }
  @media (prefers-reduced-motion: reduce) {
    .folder-card, [draggable="true"][data-file-id], .folder-card-actions { transition: none; }
    .dragging-file { transform: none; }
    .file-moving { transform: none !important; }
    .file-dragging .folder-card, .file-dragging .folder-card.drop-target,
    .folder-card.drop-target .folder-icon-open, .folder-card.drop-success, .folder-card.drop-failed { animation: none; transform: none; }
    .folder-plus-one { display: none; }
  }
  .product-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-1px); }
  .cat-sidebar-btn:hover { background: rgba(255,255,255,.08) !important; }
  /* icon-only แก้ไข/ลบ ในแถวตารางสินค้า: พื้นโปร่งใส เส้นขอบบาง, ปุ่มลบ
     เปลี่ยนเป็นสีแดง (--danger-red) เฉพาะตอน hover เท่านั้น */
  .row-icon-btn {
    min-width: 44px; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 8px;
    border: 1px solid var(--border-input);
    background: transparent;
    color: var(--text-body);
    font-size: 15px; line-height: 1;
    cursor: pointer; font-family: inherit;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .row-icon-btn:hover { background: var(--bg-subtle); }
  .row-icon-btn--danger:hover { background: var(--danger-red-bg); border-color: var(--danger-red); color: var(--danger-red); }
  /* แถวปุ่มเครื่องมือ (นำเข้า Excel / เทมเพลต / ดาวน์โหลด / จัดการหมวดหมู่ /
     เลือกหลายรายการ): ขนาด เส้นขอบ มุมโค้ง ระยะห่างไอคอน-ข้อความ เท่ากันหมด */
  .toolbar-btn {
    min-height: 44px; box-sizing: border-box;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 16px;
    border: 1px solid var(--border-input);
    border-radius: 10px;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background .12s ease, border-color .12s ease;
  }
  .toolbar-btn:hover { background: var(--bg-subtle); border-color: var(--border); }
  /* แถวสลับสีอ่อนมากๆ ในตารางรายการสินค้า (ไม่รวมแถวหัวตาราง) */
  .list-grid-row:not(.list-header):nth-child(even) { background: var(--bg-zebra); }
  .mobile-cat-bar { display: none; margin-bottom: 16px; }
  /* phone-only subcategory row under .mobile-cat-bar; its own container so
     the !important .mobile-cat-bar button rules below don't restyle it */
  .mobile-subcat-bar { display: none; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .pdf-share-spinner {
    width: 16px; height: 16px; border-radius: 50%; display: inline-block;
    border: 2px solid oklch(0.8 0.006 70); border-top-color: var(--navy-action);
    animation: pdf-share-spin .7s linear infinite;
  }
  @keyframes pdf-share-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .pdf-share-spinner { animation: none; opacity: .6; }
  }

  /* sidebar slide bar: a static rail on desktop that can collapse to
     reclaim width, and an off-canvas drawer on mobile opened via the
     hamburger button in the topbar (see [data-action="toggle-sidebar"]). */
  .sidebar { transition: width .22s ease, padding .22s ease, transform .22s ease; }
  .sidebar-backdrop { display: none; }

  /* tablets (e.g. iPad portrait): tighten spacing, keep sidebar layout */
  @media (max-width: 1024px) {
    .page-content { padding: 22px 20px 44px !important; }
    .topbar { padding: 16px 20px !important; }
  }

  /* desktop/tablet: the toggle collapses the rail to zero width instead of
     sliding it, since it stays part of the normal document flow. */
  @media (min-width: 701px) {
    .sidebar.sidebar-closed { width: 0 !important; padding: 0 !important; overflow: hidden; }
  }

  /* phones: the sidebar becomes an off-canvas drawer, closed by default */
  @media (max-width: 700px) {
    .sidebar {
      position: fixed !important;
      top: 0 !important; left: 0 !important; height: 100vh !important; width: 240px !important; max-width: 82vw !important;
      flex-direction: column !important;
      align-items: stretch !important;
      padding: 20px 16px !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      transform: translateX(-100%) !important;
      z-index: 60 !important;
      box-shadow: 6px 0 24px rgba(0,0,0,.35) !important;
    }
    .sidebar.sidebar-open { transform: translateX(0) !important; }
    .sidebar-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 55; }
    .nav-btn { white-space: normal !important; }
    .cat-sidebar { display: none !important; }
    .mobile-cat-bar { display: flex !important; flex-wrap: wrap; gap: 8px; }
    .mobile-subcat-bar { display: flex !important; flex-wrap: wrap; align-items: center; gap: 6px; margin: -6px 0 16px; padding-top: 10px; border-top: 1px dashed var(--border); }
    .mobile-cat-bar button {
      min-height: 44px !important; padding: 10px 16px !important; box-sizing: border-box !important;
      display: inline-flex !important; align-items: center !important; justify-content: center !important;
    }
    .topbar { padding: 14px !important; gap: 10px !important; }
    .page-content { padding: 16px 12px 36px !important; }
    .list-table { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
    .list-grid-row { min-width: 620px !important; }
    .calc-summary-grid { grid-template-columns: 1fr !important; }
    form[data-form="add-product"] { grid-template-columns: 1fr !important; }
    form[data-form="add-contact"] > div:first-child { grid-template-columns: 1fr !important; }
    form[data-form="add-category"] { flex-wrap: wrap !important; }
    form[data-form="add-folder"] { flex-wrap: wrap !important; }
  }

  /* PDF file cards, list view (folder pages: BOQ/pricelist/etc. + Company
     Profile — both share this markup via .pdf-file-row/.pdf-file-meta/
     .pdf-file-actions). Desktop: name+size left, the action buttons
     (เปิดดู/ดาวน์โหลด/แชร์/แก้ไข/ลบ) right, same row. Phones (<=640px):
     buttons drop below the name into an even 2x2 grid so they don't crowd
     a single row. */
  .pdf-file-row {
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    flex-wrap: wrap !important;
  }
  .pdf-file-meta {
    flex: 1 1 auto;
    min-width: 0;
  }
  .pdf-file-actions {
    flex: 0 0 auto;
    flex-wrap: nowrap !important;
  }
  @media (max-width: 640px) {
    .pdf-file-row {
      flex-direction: column !important;
      align-items: stretch !important;
    }
    .pdf-file-meta {
      width: 100%;
    }
    .pdf-file-actions {
      display: grid !important;
      grid-template-columns: 1fr 1fr;
      gap: 10px !important;
      width: 100%;
    }
    .pdf-file-actions button {
      width: 100%;
      justify-content: center;
    }
    /* odd count among the full-width text buttons (e.g. a lone "ลบ" when
       there's no "แก้ไข" next to it) - span the trailing one across both
       columns instead of leaving it half-width with an empty cell beside
       it. The compact share icon is excluded: it keeps its own fixed size
       below regardless of where it lands. */
    .pdf-file-actions button:last-child:nth-child(odd):not(.pdf-share-btn) {
      grid-column: 1 / -1;
    }
    /* share is an icon-only button, not a full-width action - keep it
       small and centered in whichever grid cell it falls into. */
    .pdf-file-actions .pdf-share-btn {
      width: 44px;
      justify-self: center;
    }
  }

  /* touch devices (phones + iPads, any width/orientation): iOS/Android zoom
     the page on focusing any input under 16px, which makes typing feel like
     it's jumping around. Bump inputs to 16px and widen the calculator's
     dense per-row columns to match so nothing clips; the table already
     scrolls horizontally when it doesn't fit. */
  @media (hover: none) and (pointer: coarse) {
    input, select, textarea { font-size: 16px !important; }
    .cat-sidebar-btn { min-height: 44px !important; }
    .calc-row { grid-template-columns: 46px 130px 85px 85px 70px 105px 115px 85px 95px 105px 85px 105px 105px !important; gap: 5px !important; }
    .steel-calc-row { grid-template-columns: 40px 290px 90px 70px 110px 110px 115px 130px !important; gap: 5px !important; }
    .stirrup-calc-row { grid-template-columns: 40px 250px 160px 90px 120px 130px 140px !important; gap: 5px !important; }
  }
</style>

<body>
<div id="app"></div>
<script>
"use strict";

/* ---------- data ---------- */

var ALL_CATEGORY = { value: "all", label: "ทุกหมวดหมู่" };

var PRODUCTS_PER_PAGE = 20;

// Builds the compact page-number sequence for the pagination bar, e.g.
// [1,'...',4,5,6,'...',52] for page 5 of 52 - keeps the first/last page plus
// a window of one page on either side of the current page. Small page
// counts (<= 7, the most an ellipsis'd sequence ever shows anyway) are
// listed in full instead, since collapsing e.g. 4 pages into "1 2 ... 4"
// hides a single page number for no space saved.
function paginationRange(current, total) {
  if (total <= 7) {
    var all = [];
    for (var n = 1; n <= total; n++) all.push(n);
    return all;
  }
  var delta = 1;
  var range = [];
  for (var i = Math.max(2, current - delta); i <= Math.min(total - 1, current + delta); i++) range.push(i);
  var withDots = [1];
  if (range.length && range[0] > 2) withDots.push("...");
  withDots = withDots.concat(range);
  if (range.length && range[range.length - 1] < total - 1) withDots.push("...");
  withDots.push(total);
  return withDots;
}

var IMPORT_HEADERS = ["ชื่อสินค้า", "หมวดหมู่", "หมวดหมู่ย่อย", "ช่อง 1", "ช่อง 2", "ช่อง 3", "หน่วย", "สี", "ภาษี", "สต็อก"];

var API_BASE = "https://thananan-pricelist-api.thanananonline.workers.dev";

// sessionStorage (not localStorage) is intentional: it's wiped whenever the
// browser/all tabs close, so re-opening the site always requires a fresh
// login, while a plain page refresh within the same tab still stays logged in.
function getSessionToken() {
  try { return sessionStorage.getItem("pricelistToken") || ""; } catch (e) { return ""; }
}
function saveSessionToken(token) {
  try { sessionStorage.setItem("pricelistToken", token); } catch (e) {}
}
function clearSessionToken() {
  try { sessionStorage.removeItem("pricelistToken"); } catch (e) {}
}

// Same idle timeout on phone and desktop: 30 minutes with no activity forces
// a fresh login, regardless of the token's own (much longer) server-side TTL.
var SESSION_IDLE_LIMIT_MS = 30 * 60 * 1000;
function getLastActivity() {
  try { return parseInt(sessionStorage.getItem("pricelistLastActivity"), 10) || 0; } catch (e) { return 0; }
}
function saveLastActivity(ts) {
  try { sessionStorage.setItem("pricelistLastActivity", String(ts)); } catch (e) {}
}
function clearLastActivity() {
  try { sessionStorage.removeItem("pricelistLastActivity"); } catch (e) {}
}

// Registered once by the Dashboard instance so any authenticated request
// that comes back 401 (bad token, or a since-deleted/edited user re-checked
// server-side) forces a logout with an explanation, no matter which call
// site triggered it.
var _sessionExpiredCallback = null;
function onApiSessionExpired(cb) { _sessionExpiredCallback = cb; }

function apiRequest(path, opts) {
  opts = opts || {};
  var headers = Object.assign({}, opts.headers || {});
  if (!opts.formData) headers["Content-Type"] = "application/json";
  if (opts.auth) {
    var token = getSessionToken();
    if (token) headers["Authorization"] = "Bearer " + token;
  }
  var body = opts.formData ? opts.formData : (opts.body ? JSON.stringify(opts.body) : undefined);
  return fetch(API_BASE + path, {
    method: opts.method || "GET",
    headers: headers,
    body: body,
  }).then(function (res) {
    if (!res.ok) {
      return res.json().catch(function () { return {}; }).then(function (errBody) {
        var err = new Error(errBody.error || ("HTTP " + res.status));
        err.status = res.status;
        if (res.status === 401 && opts.auth && _sessionExpiredCallback) _sessionExpiredCallback();
        throw err;
      });
    }
    return res.json();
  });
}

var CAT_HUE = {
  cement: 60, steel: 250,
  concrete_pipe: 210, concrete_manhole: 90, concrete_pile: 25, concrete_slab: 130,
};
function img(cat) {
  var h = CAT_HUE[cat] != null ? CAT_HUE[cat] : 60;
  return { bg: "oklch(0.93 0.02 " + h + ")", stripe: "oklch(0.88 0.035 " + h + ")" };
}

/* ---------- helpers ---------- */

// flat gray "no image yet" box icon, used in place of the old diagonal-stripe
// placeholder for products without a photo (grid card media + list thumbnail).
function noImageIconSvg(px) {
  return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>';
}

function fmt(n) { return Number(n).toLocaleString("th-TH"); }

// Splits "X - กระเบื้อง (ไพลินทอแสง (MTO))" into base "X - กระเบื้อง" and
// label "ไพลินทอแสง (MTO)", matching the trailing parenthesis by balance so
// nested notes stay with the color. Returns null when the name doesn't end
// in a (...) group.
function splitTrailingParen(name) {
  var t = String(name || "").replace(/\s+$/, "");
  if (t.charAt(t.length - 1) !== ")") return null;
  var depth = 0;
  for (var i = t.length - 1; i >= 0; i--) {
    var c = t.charAt(i);
    if (c === ")") depth++;
    else if (c === "(" && --depth === 0) {
      var base = t.slice(0, i).replace(/\s+$/, "");
      var label = t.slice(i + 1, -1).trim();
      return base && label ? { base: base, label: label } : null;
    }
  }
  return null;
}

// A product's color and the name without it: the สี field when set (the
// name is then already color-free), otherwise the legacy trailing "(...)"
// on the name for products whose color hasn't been moved into the field
// yet. null = no color either way.
function productColorParts(p) {
  var color = String(p.color || "").trim();
  if (color) return { base: String(p.name || "").trim(), label: color };
  return splitTrailingParen(p.name);
}

// Grouping key for the color-merge in computeProductRows: products whose
// name minus color matches and that share category/subcategory/unit/VAT
// and all three price tiers. "" = never grouped.
function productGroupKey(p) {
  var parts = productColorParts(p);
  if (!parts) return "";
  return [p.cat, p.subcat || "", parts.base, p.unit, p.vat || "vat", p.price, p.price2 == null ? "" : p.price2, p.price3 == null ? "" : p.price3, p.oldPrice == null ? "" : p.oldPrice].join("\u0001");
}
// Name plus color, for places that identify one product on its own (delete
// confirm, image viewer) -- colors moved into the สี field share a name.
function productLabel(p) {
  return p.color ? p.name + " (" + p.color + ")" : p.name;
}

// Small "สี: ..." line under a product name; nothing when there's no color.
// Labels that already start with "สี" (e.g. "สีแดงชบา") skip the prefix.
function productColorLineHtml(color) {
  if (!color) return "";
  var text = color.indexOf("สี") === 0 ? color : "สี: " + color;
  return '<div style="font-size:12px; color:var(--text-muted); margin-top:2px;">' + esc(text) + '</div>';
}
// Pulls a "สีXXX" word out of a name that still carries its color inline,
// e.g. "เชิงชายพลัส สีธรรมชาติ (2 แผ่น/แพ็ค) 1.6*23*300" -> name
// "เชิงชายพลัส (2 แผ่น/แพ็ค) 1.6*23*300", color "ธรรมชาติ". Only a
// whole word starting with สี counts, and not สี่ (four, as in สี่เหลี่ยม).
// "สี" words in NON_COLOR_WORDS are price-group names, not colors, so they
// stay in the name and the next "สี…" word (if any) is used instead.
// null = nothing to split.
function splitInlineColor(name) {
  name = String(name || "");
  var re = /(^|\s)สี(?![\u0E48-\u0E4B])(\S+)/g;
  var m;
  while ((m = re.exec(name))) {
    if (NON_COLOR_WORDS.indexOf(m[2]) !== -1) continue;
    var rest = (name.slice(0, m.index) + " " + name.slice(m.index + m[0].length)).replace(/\s+/g, " ").trim();
    return rest ? { name: rest, color: m[2] } : null;
  }
  return null;
}

// ("สีมาตรฐาน", "สีเมทัลลิค"), so they belong in the name, not the สี field.

// otherwise at the end.
function nameWithColorWord(name, word) {
  name = String(name || "").trim();
  var at = name.indexOf(" - ");
  return at === -1 ? name + " สี" + word : name.slice(0, at) + " สี" + word + name.slice(at);

function resizeImageFile(file, maxDim, quality, callback) {
  var reader = new FileReader();
  reader.onload = function () {
    var image = new Image();
    image.onload = function () {
      var w = image.width, h = image.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(image, 0, 0, cw, ch);
      try {
        callback(canvas.toDataURL("image/jpeg", quality));
      } catch (e) {
        callback(reader.result);
      }
    };
    image.onerror = function () { callback(reader.result); };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

Dashboard.prototype.restoreSession = function (attempt) {
  var self = this;
  attempt = attempt || 0;
  apiRequest("/auth/me", { auth: true }).then(function (res) {
    self.markActivity();
    self.setState({ loggedIn: true, checkingSession: false, username: res.username, role: res.role });
    self.loadUsers();
  }).catch(function (err) {
    // A genuine 401 (bad/expired token, or the account no longer exists) is
    // already handled by handleSessionExpired via the apiRequest hook.
    // A network blip, worker cold start, etc. must not throw away an
    // otherwise-valid saved session -- retry a couple of times first.
    if (err.status !== 401 && attempt < 2) {
      setTimeout(function () { self.restoreSession(attempt + 1); }, 1500);
      return;
    }
    if (err.status !== 401) {
      self.setState({ loggedIn: false, checkingSession: false });
    }
  });
};

// Central handler for any authenticated request coming back 401: the token
// is invalid/expired, or D1 no longer has the user (deleted, or role/password
// changed elsewhere). Forces a fresh login and explains why.
Dashboard.prototype.handleSessionExpired = function () {
  clearSessionToken();
  clearLastActivity();
  this.setState({
    loggedIn: false, checkingSession: false, username: "", role: "", password: "",
    users: [], usersLoading: true, usersError: "", myPasswordOpen: false, myPasswordCurrent: "", myPasswordNew: "", myPasswordConfirm: "", myPasswordError: "", myPasswordSaving: false,
    authError: "เซสชันหมดอายุหรือบัญชีนี้ถูกยกเลิก กรุณาเข้าสู่ระบบใหม่",
  });
};

// Any interaction resets the idle clock; a background timer forces logout
// once 30 minutes pass without one, on both mobile and desktop browsers.
Dashboard.prototype.markActivity = function () {
  var now = Date.now();
  if (now - (this._lastActivityWrite || 0) < 5000) return;
  this._lastActivityWrite = now;
  saveLastActivity(now);
};

Dashboard.prototype._bindActivityTracking = function () {
  var self = this;
  ["click", "keydown", "touchstart", "scroll", "mousemove"].forEach(function (evt) {
    document.addEventListener(evt, function () {
      if (self.state.loggedIn) self.markActivity();
    }, { passive: true });
  });
  setInterval(function () { self._checkIdleTimeout(); }, 30 * 1000);
};

Dashboard.prototype._checkIdleTimeout = function () {
  if (!this.state.loggedIn) return;
  if (Date.now() - getLastActivity() > SESSION_IDLE_LIMIT_MS) {
    clearSessionToken();
    clearLastActivity();
    this.setState({
      loggedIn: false, username: "", role: "", password: "",
      users: [], usersLoading: true, usersError: "", myPasswordOpen: false, myPasswordCurrent: "", myPasswordNew: "", myPasswordConfirm: "", myPasswordError: "", myPasswordSaving: false,
      authError: "ไม่ได้ใช้งานเกิน 30 นาที กรุณาเข้าสู่ระบบใหม่",
    });
  }
};

// The user list is admin-only (GET /users answers 403 otherwise), so viewers
// never request it. A response that lands after logout or a switch to
// another account is dropped rather than leaking into the next session.
Dashboard.prototype.loadUsers = function () {
  if (!this.isAdmin()) return;
  var self = this;
  var requestedBy = this.state.username;
  var stillSameAdmin = function () { return self.state.loggedIn && self.isAdmin() && self.state.username === requestedBy; };
  self.state.usersLoading = true;
  apiRequest("/users", { auth: true }).then(function (users) {
    if (!stillSameAdmin()) return;
    self.setState({ users: users, usersLoading: false, usersError: "" });
  }).catch(function () {
    if (!stillSameAdmin()) return;
    self.setState({ usersLoading: false, usersError: "โหลดข้อมูลผู้ใช้ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่" });
  });
};

// Precast manhole (บ่อพักสำเร็จรูป) prices live in D1 (manhole_products, see
// migrations/0017_add_manhole_pricing.sql) same as box culvert. Only the
// three base (no-VAT) prices are stored -- the VAT-inclusive prices shown
// on screen are derived from them client-side in renderManholePage with a
// fixed formula (base * 1.07, rounded), so there's nothing else to fetch or
// cache here.
Dashboard.prototype.loadManholeProducts = function () {
  var self = this;
  self.state.manholeProductsLoading = true;
  apiRequest("/manhole-products").then(function (manholeProducts) {
    self.setState({ manholeProducts: manholeProducts, manholeProductsLoading: false, manholeProductsError: "" });
  }).catch(function () {
    self.setState({ manholeProductsLoading: false, manholeProductsError: "โหลดข้อมูลตารางราคาบ่อพักไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่" });
  });
};

Dashboard.prototype.startManholeEdit = function (id) {
  var p = this.state.manholeProducts.find(function (x) { return x.id === id; });
  if (!p) return;
  this.setState({
    manholeEditingId: id,
    manholeEditPickup: String(p.pricePickup),
    manholeEditWholesale: String(p.priceWholesale),
    manholeEditRetail: String(p.priceRetail),
  });
};

Dashboard.prototype.saveManholeEdit = function (id) {
  var s = this.state;
  var pickup = parseFloat(s.manholeEditPickup);
  var wholesale = parseFloat(s.manholeEditWholesale);
  var retail = parseFloat(s.manholeEditRetail);
  if (isNaN(pickup) || isNaN(wholesale) || isNaN(retail)) {
    this.showToast("กรุณากรอกราคาให้ถูกต้อง", "error");
    return;
  }
  var self = this;
  apiRequest("/manhole-products/" + encodeURIComponent(id), {
    method: "PUT", auth: true,
    body: { pricePickup: pickup, priceWholesale: wholesale, priceRetail: retail },
  }).then(function (updated) {
    self.setState(function (s2) {
      var manholeProducts = s2.manholeProducts.map(function (p) { return p.id === id ? updated : p; });
      return { manholeProducts: manholeProducts, manholeEditingId: null };
    });
    self.showToast("บันทึกราคาสำเร็จ");
  }).catch(function (err) {
    self.showToast("บันทึกไม่สำเร็จ: " + err.message, "error");
  });
};

Dashboard.prototype.catLabel = function (value) {
  var found = this.state.categories.filter(function (c) { return c.value === value; })[0];
  return found ? found.label : value;
};

Dashboard.prototype.catValueByLabel = function (label) {
  var found = this.state.categories.filter(function (c) { return c.label === label; })[0];
  return found ? found.value : "";
};

// Subcategories aren't a master list -- they're free-text labels on
// products (e.g. under "กระเบื้องหลังคา": ADAMAS, CT, ลอนคู่). Suggestions
// are just the distinct values already used within one main category, so
// any category can grow subcategories organically with no setup.
Dashboard.prototype.subcatOptionsFor = function (catValue) {
  var seen = {};
  var out = [];
  this.state.products.forEach(function (p) {
    if (p.cat === catValue && p.subcat && !seen[p.subcat]) { seen[p.subcat] = true; out.push(p.subcat); }
  });
  return out.sort(function (a, b) { return a.localeCompare(b, "th"); });
};

Dashboard.prototype.addCategory = function () {
  var s = this.state;
  var label = s.newCategoryName.trim();

  var self = this;
  apiRequest("/categories", { method: "POST", auth: true, body: { label: label } })
    .then(function (category) {
      self.setState(function (s2) {
        var patch = { categories: s2.categories.concat([category]), newCategoryName: "", categoryError: "" };
        if (!s2.newProdCat) patch.newProdCat = category.value;

      });
    })
    .catch(function (err) {
      self.setState({ categoryError: "เพิ่มหมวดหมู่ไม่สำเร็จ: " + err.message });

  if (!label) { this.setState({ categoryError: "กรุณากรอกชื่อหมวดหมู่" }); return; }

    .then(function (updated) {

Dashboard.prototype.setState = function (patch) {
  clearTimeout(this._renderTimer);
  Object.assign(this.state, typeof patch === "function" ? patch(this.state) : patch);
  this.render();
};

Dashboard.prototype.showToast = function (message, type) {
  clearTimeout(this._toastTimer);
  var self = this;
  this.setState({ toast: { message: message, type: type || "success" } });
  this._toastTimer = setTimeout(function () {
    self.setState({ toast: null });
  }, 3000);
};

Dashboard.prototype.handleClick = function (e) {
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var action = t.dataset.action;
  var d = t.dataset;
  switch (action) {
    case "logout": this.onLogout(); break;
    case "nav":
      // "company" has no folder-list step - it's a single implicit folder,
      // so its "active folder" IS the home view and must not be reset.
      var navFolderKeys = d.page === "company" ? null : this._folderKeys(d.page);
      this.setState(function (s2) {
        var patch = { page: d.page };
        // Clicking a sidebar tab should always land on that page's home
        // view, not wherever the user last drilled into (e.g. an open
        // folder) - so reset any folder navigation for the target page.
        if (navFolderKeys) {
          patch[navFolderKeys.activeKey] = null;
          patch[navFolderKeys.searchKey] = "";
        }
        // On the mobile drawer, picking a page should also close it; on the
        // desktop rail, leave the open/closed choice as the user set it.
        if (window.innerWidth <= 700) patch.sidebarOpen = false;
        return patch;
      });
      break;
    case "toggle-sidebar": this.setState(function (s2) { return { sidebarOpen: !s2.sidebarOpen }; }); break;
    case "close-sidebar": this.setState({ sidebarOpen: false }); break;
    case "set-view": this.setState({ view: d.view }); break;
    case "clear-field":
      var fieldKey = d.field;
      var fieldPatch = {};
      fieldPatch[fieldKey] = "";
      if (fieldKey === "search") fieldPatch.productsPage = 1;
      this.setState(fieldPatch);
      var fieldEl = this.root.querySelector("#field-" + fieldKey);
      if (fieldEl) fieldEl.focus();
      break;
    case "set-category": this.setState({ category: d.category, subcat: "", productsPage: 1 }); break;
    case "set-subcat": this.setState({ category: d.category, subcat: d.subcat, productsPage: 1 }); break;
    case "products-go-page":
      var targetPage = parseInt(d.page, 10);
      if (!isNaN(targetPage)) {
        var pageBounds = this.getProductsPageInfo();
        if (targetPage < 1) targetPage = 1;
        if (targetPage > pageBounds.totalPages) targetPage = pageBounds.totalPages;
        this.setState({ productsPage: targetPage });
        this.scrollToProductsTop();
      }
      break;
    case "toggle-cat-subcats":
      var toggleCatKey = d.category;
      this.setState(function (s2) {
        var next = Object.assign({}, s2.expandedCatSidebar);
        next[toggleCatKey] = !next[toggleCatKey];
        return { expandedCatSidebar: next };

    case "toggle-cat-sidebar": this.setState(function (s2) { return { catSidebarCollapsed: !s2.catSidebarCollapsed }; }); break;
    case "toggle-calc-sidebar": this.setState(function (s2) { return { calcSidebarCollapsed: !s2.calcSidebarCollapsed }; }); break;
    case "toggle-discount-sidebar": this.setState(function (s2) { return { discountSidebarCollapsed: !s2.discountSidebarCollapsed }; }); break;
    case "calc-set-type": this.setState({ page: "calc", calcProductType: d.type }); break;
    case "pipe-set-type": this.setState({ pipeSelectedType: d.type, pipeSelectedSize: "", pipeEditingId: null }); break;
    case "pipe-set-size": this.setState({ pipeSelectedSize: d.size, pipeEditingId: null }); break;
    case "reload-pipe-products": this.loadPipeProducts(); break;
    case "start-edit-pipe": this.startPipeEdit(d.id); break;
    case "cancel-edit-pipe": this.setState({ pipeEditingId: null, pipeEditRows: [] }); break;
    case "save-edit-pipe": this.savePipeEdit(d.id); break;
    case "discount-set-category":

      if (d.category === "pile_i") discountCategoryPatch.pileGroup = "I";

        var allImportProducts = subcatConfirmCreate.readyProducts.concat(subcatConfirmCreate.pendingItems.map(function (item) { return item.product; }));
        this.setState({ importSubcatConfirm: null });
        this._finishExcelImport(allImportProducts, subcatConfirmCreate.errors);
      }
      break;
    case "confirm-import-subcat-skip":
      var subcatConfirmSkip = this.state.importSubcatConfirm;
      if (subcatConfirmSkip) {
        var skipErrors = subcatConfirmSkip.pendingItems.map(function (item) {
          return "แถว " + item.rowNum + ': ข้ามหมวดหมู่ย่อยใหม่ "' + item.subcat + '" ตามที่เลือก';
        });
        this.setState({ importSubcatConfirm: null });
        this._finishExcelImport(subcatConfirmSkip.readyProducts, subcatConfirmSkip.errors.concat(skipErrors));
      }
      break;
    case "open-download-modal": this.setState({ showDownloadModal: true, downloadCategory: "all", downloadSubcat: "" }); break;
    case "close-download-modal": this.setState({ showDownloadModal: false }); break;
    case "confirm-download-products": this.downloadProductsExcel(); this.setState({ showDownloadModal: false }); break;
    case "toggle-manage-categories": this.setState(function (s2) { return { showManageCategories: !s2.showManageCategories, categoryError: "" }; }); break;
    case "request-remove-category": this.setState({ categoryDeleteConfirm: { value: d.value, label: d.label || "" } }); break;
    case "cancel-remove-category": this.setState({ categoryDeleteConfirm: null }); break;
    case "confirm-remove-category": this.setState({ categoryDeleteConfirm: null }); this.removeCategory(d.value); break;
    case "start-edit-category": this.startEditCategory(d.value, d.label || ""); break;
    case "cancel-edit-category": this.cancelEditCategory(); break;
    case "save-edit-category": this.saveEditCategory(d.value); break;
    case "view-product-image": this.setState({ imagePreview: { url: d.image, name: d.name || "" } }); break;
    case "close-image-preview": this.setState({ imagePreview: null }); break;
  }
};

Dashboard.prototype.handleSubmit = function (e) {
  var form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  var kind = form.dataset.form;
  switch (kind) {
    case "auth": this.onSubmitAuth(); break;
    case "add-product": this.onAddProduct(); break;
    case "add-user": this.onAddUser(); break;
    case "change-password": this.onChangePassword(); break;
    case "change-my-password": this.onChangeMyPassword(); break;
    case "add-contact": this.onAddContact(); break;
    case "add-category": this.addCategory(); break;
    case "add-folder":
      this.addFolder(form.dataset.kind);
      break;
  }
};

// Pure trailing-edge debounce: always wait for a pause in typing before
// re-rendering. Forcing a render mid-keystroke (as an earlier version of
// this did after 500ms of continuous typing) tears down and recreates the
// focused input while the user is still actively typing, which is exactly
// when losing/misplacing the cursor is most noticeable.
Dashboard.prototype._scheduleRender = function (fn) {
  var self = this;
  clearTimeout(this._renderTimer);
  this._renderTimer = setTimeout(function () {
    fn.call(self);
  }, 150);
};

Dashboard.prototype.handleFieldChange = function (e) {
  var rowEl = e.target.closest("[data-calc-row]");
  if (rowEl) {
    var idx = parseInt(rowEl.dataset.calcRow, 10);
    var field = rowEl.dataset.calcField;
    var storeKey = rowEl.dataset.calcStore || "calcRows";
    this.state[storeKey][idx][field] = rowEl.value;
    this._scheduleRender(storeKey === "pipeEditRows" ? this.renderPipeOnly : (storeKey === "plankEditRows" ? this.renderPlankOnly : this.renderCalcOnly));
    return;
  }
  var el = e.target.closest("[data-bind]");
  if (!el || el.type === "file") return;
  var key = el.dataset.bind;
  this.state[key] = el.value;
  if (key === "search" || key === "sortBy") this.state.productsPage = 1;
  if (key === "downloadCategory") this.state.downloadSubcat = "";
  if (el.dataset.clear) this.state[el.dataset.clear] = "";
  // Same reasoning as the login screen below: a full re-render while typing
  // tears down and recreates this input, jumping the cursor/keyboard. The
  // input already shows what was typed, so nothing needs to re-render until
  // Save/Cancel is clicked.
  if (key === "editFolderName" || key === "editFileName") return;
  if (!this.state.loggedIn) {
    // Never rebuild the DOM while typing on the login screen: even a
    // synchronous re-render tears down and recreates the input, which is
    // what causes the on-screen keyboard to stutter/jump on mobile. Just
    // keep state in sync and hide any stale error message directly.
    if (el.dataset.clear) {
      var errEl = this.root.querySelector("#auth-error-box");
      if (errEl) errEl.style.display = "none";
    }
    return;
  }
  var isCalcField = key.indexOf("calc") === 0;
  var isPipeEditField = key.indexOf("pipeEdit") === 0;
  var isPlankEditField = key.indexOf("plankEdit") === 0;
  this._scheduleRender(isCalcField ? this.renderCalcOnly : (isPipeEditField ? this.renderPipeOnly : (isPlankEditField ? this.renderPlankOnly : this.render)));
};

// Field selector shared by every fillable input/select across the app --
// price fields, form fields, and calculator table cells alike -- so Enter
// and Left/Right arrow navigation (below) works everywhere, not just the
// calculator table it originally shipped for.
var NAV_FIELD_SELECTOR = "[data-bind], [data-calc-row]";

Dashboard.prototype._navFields = function () {
  return Array.prototype.filter.call(
    this.root.querySelectorAll(NAV_FIELD_SELECTOR),
    function (el) { return !el.disabled && el.offsetParent !== null; }
  );
};

Dashboard.prototype.handleFieldNavKeyDown = function (e) {
  var key = e.key;
  if (key !== "Enter" && key !== "ArrowLeft" && key !== "ArrowRight") return;
  var el = e.target;
  if (!el || !el.matches || !el.matches(NAV_FIELD_SELECTOR)) return;
  if (el.tagName !== "INPUT" && el.tagName !== "SELECT") return;

  var isArrow = key !== "Enter";
  if (isArrow) {
    // Leave <select> arrow keys alone (natively used to change the value),
    // and only hijack a text field's arrows when the caret already sits at
    // the very start/end with nothing selected -- so normal in-field cursor
    // movement and text selection keep working everywhere else.
    if (el.tagName !== "INPUT") return;
    var pos = el.selectionStart, endPos = el.selectionEnd;
    if (pos == null || pos !== endPos) return;
    if (key === "ArrowLeft" && pos !== 0) return;
    if (key === "ArrowRight" && pos !== el.value.length) return;
  }

  var fields = this._navFields();
  var idx = fields.indexOf(el);
  if (idx === -1) return;
  var targetIdx = key === "ArrowLeft" ? idx - 1 : idx + 1;
  // No field in that direction: let the browser do its default thing
  // instead (e.g. Enter submitting the form the last field belongs to).
  if (targetIdx < 0 || targetIdx >= fields.length) return;

  e.preventDefault();
  var next = fields[targetIdx];
  next.focus();
  if (isArrow && next.tagName === "INPUT") {
    var caret = key === "ArrowLeft" ? next.value.length : 0;
    try { next.setSelectionRange(caret, caret); } catch (err) {}
  }
};

Dashboard.prototype.handleChange = function (e) {
  if (e.target.type === "file" && e.target.dataset.action === "upload-file") {
    var kind = e.target.dataset.kind;
    if (e.target.files && e.target.files.length) {
      if (kind === "company") this.uploadCompanyFiles(e.target.files);
      else this.uploadFiles(kind, e.target.files);
    }
    e.target.value = "";
    return;
  }
  if (e.target.type === "file" && e.target.dataset.action === "upload-new-prod-image") {
    var file2 = e.target.files && e.target.files[0];
    if (file2) this.uploadProductImage(file2, "newProdImage");
    e.target.value = "";
    return;
  }
  if (e.target.type === "file" && e.target.dataset.action === "upload-edit-image") {
    var file3 = e.target.files && e.target.files[0];
    if (file3) this.uploadProductImage(file3, "editImage");
    e.target.value = "";
    return;
  }
  if (e.target.type === "file" && e.target.dataset.action === "import-excel") {
    var file4 = e.target.files && e.target.files[0];
    if (file4) this.importExcelFile(file4);
    e.target.value = "";
    return;
  }
  this.handleFieldChange(e);
};

/* ---- auth ---- */

Dashboard.prototype.onSubmitAuth = function () {
  var s = this.state;
  var u = s.username.trim();
  var self = this;
  if (!u || !s.password.trim()) { this.setState({ authError: "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน" }); return; }
  apiRequest("/auth/login", { method: "POST", body: { username: u, password: s.password } })
    .then(function (res) {
      saveSessionToken(res.token);
      self.markActivity();
      self.setState({ loggedIn: true, username: res.username, role: res.role, password: "", authError: "" });
      self.loadUsers();
    })
    .catch(function () {
      self.setState({ authError: "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง" });
    });
};

Dashboard.prototype.onLogout = function () {
  clearSessionToken();
  clearLastActivity();
  this.setState({ loggedIn: false, username: "", role: "", password: "", users: [], usersLoading: true, usersError: "", myPasswordOpen: false, myPasswordCurrent: "", myPasswordNew: "", myPasswordConfirm: "", myPasswordError: "", myPasswordSaving: false });
};

/* ---- products ---- */

Dashboard.prototype.getMergedProducts = function () {
  return this.state.products;
};

Dashboard.prototype.computeProducts = function () {
  var s = this.state;
  var queryTerms = s.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var withOverrides = this.getMergedProducts();

  var list = withOverrides.filter(function (p) {
    var matchesCat = s.category === "all" || p.cat === s.category;
    var matchesSubcat = !s.subcat || (p.subcat || "") === s.subcat;
    var haystack = (p.name + " " + p.sku + " " + (p.color || "")).toLowerCase();
    var matchesQ = !queryTerms.length || queryTerms.every(function (term) { return haystack.indexOf(term) !== -1; });
    return matchesCat && matchesSubcat && matchesQ;
  });

  if (s.sortBy === "name") list = list.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "th"); });
  if (s.sortBy === "price_asc") list = list.slice().sort(function (a, b) { return a.price - b.price; });
  if (s.sortBy === "price_desc") list = list.slice().sort(function (a, b) { return b.price - a.price; });

  var self = this;
  return list.map(function (p) {
    var im = img(p.cat);
    return {
      id: p.id, name: p.name, sku: p.sku, note: p.note || "", color: p.color || "", cat: p.cat, subcat: p.subcat || "", categoryLabel: self.catLabel(p.cat), unit: p.unit,
      groupKey: productGroupKey(p),
      priceDisplay: fmt(p.price),
      oldPriceDisplay: p.oldPrice ? fmt(p.oldPrice) : "",
      hasDiscount: !!p.oldPrice,
      price2Display: p.price2 != null ? fmt(p.price2) : "",
      price3Display: p.price3 != null ? fmt(p.price3) : "",
      hasMultiPrice: p.price2 != null || p.price3 != null,
      vatLabel: p.vat === "novat" ? "NO VAT" : "VAT",
      vatBadgeBg: p.vat === "novat" ? "oklch(0.93 0.03 85)" : "oklch(0.92 0.05 155)",
      vatBadgeColor: p.vat === "novat" ? "oklch(0.45 0.1 80)" : "oklch(0.4 0.09 155)",
      imgBg: im.bg, imgStripe: im.stripe,
      image: p.image || "",
      isEditing: s.editingId === p.id,
    };
  });
};

// Display-only merge of color variants into one row, e.g. the 12 rows
// "กระเบื้องคอนกรีต ADAMAS กลุ่มสีมาตรฐาน - กระเบื้อง (เทาปฐพี)", "(เทาแปซิฟิก)", ...
// all priced the same become a single "... - กระเบื้อง" row with "12 สี" that
// expands to the color list. The products themselves are never touched:
// grouping runs on the already-filtered/sorted list, so a search that only
// hits one color (e.g. "เทาปฐพี") just shows that product as a normal row.
// The color comes from the สี field, or the trailing (...) on the name for
// products that don't have one yet (see productColorParts).
// Products group only when everything but the color matches --
// category, subcategory, unit, VAT and price ช่อง 1-3 -- so a color priced
// differently stays on its own row.
Dashboard.prototype.computeProductRows = function () {
  var s = this.state;
  var list = this.computeProducts();
  var byKey = {};
  var rows = [];
  list.forEach(function (p) {
    if (!p.groupKey) { rows.push(p); return; }
    var g = byKey[p.groupKey];
    if (!g) {
      g = byKey[p.groupKey] = { isGroup: true, members: [] };
      rows.push(g);
    }
    g.members.push(p);
  });
  return rows.map(function (row) {
    if (!row.isGroup) return row;
    if (row.members.length === 1) return row.members[0];
    var first = row.members[0];
    var ids = row.members.map(function (m) { return m.id; });
    // Keyed by the smallest member id so expand/edit state survives a
    // shared-price edit (which changes the price part of groupKey).
    var key = "g:" + ids.slice().sort()[0];
    var withImage = row.members.find(function (m) { return m.image; });
    var sameNote = row.members.every(function (m) { return m.note === first.note; });
    var group = Object.assign({}, first, {
      isGroup: true,
      key: key,
      id: key,
      ids: ids,
      name: productColorParts(first).base,
      color: "",
      note: sameNote ? first.note : "",
      image: withImage ? withImage.image : "",
      members: row.members.map(function (m) {
        return Object.assign({}, m, { colorLabel: productColorParts(m).label });
      }),
      isExpanded: !!s.expandedProductGroups[key],
      isEditing: s.editingGroupKey === key,
    });
    // A color being edited on its own needs its row visible.
    if (group.members.some(function (m) { return m.isEditing; })) group.isExpanded = true;
    return group;
  });
};

// Every product id a row stands for (one for a plain row, all colors for a
// group) -- what select/delete act on.
function productRowIds(row) {
  return row.isGroup ? row.ids : [row.id];
}

// Client-side pagination over the already-filtered/sorted/grouped rows. Clamps
// (and persists) the stored page whenever the result set has shrunk out
// from under it, so deleting the last item on the last page steps back a
// page automatically instead of showing an empty page.
Dashboard.prototype.getProductsPageInfo = function () {
  var all = this.computeProductRows();
  var totalPages = Math.max(1, Math.ceil(all.length / PRODUCTS_PER_PAGE));
  var page = this.state.productsPage || 1;
  if (page > totalPages) page = totalPages;
  if (page < 1) page = 1;
  this.state.productsPage = page;
  var start = (page - 1) * PRODUCTS_PER_PAGE;
  return { all: all, total: all.length, totalPages: totalPages, page: page, start: start, pageItems: all.slice(start, start + PRODUCTS_PER_PAGE) };
};

Dashboard.prototype.scrollToProductsTop = function () {
  var el = document.getElementById("products-table-top");
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
};

Dashboard.prototype.startEdit = function (id) {
  var p = this.getMergedProducts().find(function (x) { return x.id === id; });
  if (!p) return;
  this.setState({
    editingId: p.id, editingGroupKey: null, editName: p.name, editPrice: String(p.price),
    editPrice2: p.price2 != null ? String(p.price2) : "", editPrice3: p.price3 != null ? String(p.price3) : "",
    editUnit: p.unit, editVat: p.vat || "vat", editImage: p.image || "", editNote: p.note || "",
    editSubcat: p.subcat || "", editColor: p.color || "",
  });
};

Dashboard.prototype.saveEdit = function (id) {
  var s = this.state;
  var price = parseFloat(s.editPrice);
  var name = s.editName.trim();
  var unit = s.editUnit.trim();
  var body = { vat: s.editVat, image: s.editImage, note: s.editNote.trim(), subcat: s.editSubcat.trim(), color: s.editColor.trim() };
  if (name) body.name = name;
  if (unit) body.unit = unit;
  if (!isNaN(price)) body.price = price;
  var price2 = parseFloat(s.editPrice2);
  var price3 = parseFloat(s.editPrice3);
  body.price2 = isNaN(price2) ? null : price2;
  body.price3 = isNaN(price3) ? null : price3;
  var self = this;
  apiRequest("/products/" + encodeURIComponent(id), { method: "PUT", auth: true, body: body })
    .then(function (updated) {
      self.setState(function (s2) {
        var products = s2.products.map(function (p) { return p.id === id ? updated : p; });
        return { products: products, editingId: null };
      });
    })
    .catch(function (err) {
      self.setState({ importMsg: "บันทึกไม่สำเร็จ: " + err.message, importMsgType: "error" });
    });
};

Dashboard.prototype.findProductGroup = function (key) {
  return this.computeProductRows().find(function (r) { return r.isGroup && r.key === key; }) || null;
};

Dashboard.prototype.startGroupEdit = function (key) {
  var g = this.findProductGroup(key);
  if (!g) return;
  var first = this.getMergedProducts().find(function (x) { return x.id === g.ids[0]; });
  if (!first) return;
  this.setState({
    editingGroupKey: key, editingId: null, editGroupError: "",
    editGroupPrice: String(first.price),
    editGroupPrice2: first.price2 != null ? String(first.price2) : "",
    editGroupPrice3: first.price3 != null ? String(first.price3) : "",
  });
};

// Writes the shared price ช่อง 1-3 to every color in the group, one PUT per
// product (the same endpoint the single-row editor uses). Colors that saved
// are applied locally even if others failed, and the failure count is shown.
Dashboard.prototype.saveGroupEdit = function (key) {
  var s = this.state;
  var g = this.findProductGroup(key);
  if (!g) return;
  var price = parseFloat(s.editGroupPrice);
  if (isNaN(price) || price < 0) {
    this.setState({ editGroupError: "กรุณากรอกราคา ช่อง 1 ให้ถูกต้อง" });
    return;
  }
  var price2 = parseFloat(s.editGroupPrice2);
  var price3 = parseFloat(s.editGroupPrice3);
  var body = { price: price, price2: isNaN(price2) ? null : price2, price3: isNaN(price3) ? null : price3 };
  var self = this;
  Promise.all(g.ids.map(function (id) {
    return apiRequest("/products/" + encodeURIComponent(id), { method: "PUT", auth: true, body: body })
      .then(function (updated) { return { ok: true, product: updated }; }, function (err) { return { ok: false, error: err }; });
  })).then(function (results) {
    var updatedById = {};
    var failed = results.filter(function (r) { return !r.ok; });
    results.forEach(function (r) { if (r.ok) updatedById[r.product.id] = r.product; });
    self.setState(function (s2) {
      var patch = { products: s2.products.map(function (p) { return updatedById[p.id] || p; }) };
      if (failed.length) patch.editGroupError = "บันทึกไม่สำเร็จ " + failed.length + " จาก " + g.ids.length + " สี: " + failed[0].error.message;
      else { patch.editingGroupKey = null; patch.editGroupError = ""; }
      return patch;
    });
    if (!failed.length) self.showToast("อัปเดตราคา " + g.ids.length + " สีแล้ว", "success");
  });
};

// "แดง, เขียว, น้ำเงิน" -> ["แดง", "เขียว", "น้ำเงิน"]: splits on commas (ASCII
// or full-width) and newlines, trims, and drops blanks and repeats within
// the input itself.
function parseColorList(str) {
  var seen = {};
  return String(str || "").split(/[,，\n]/).map(function (c) { return c.trim(); }).filter(function (c) {
    var k = c.toLowerCase();
    if (!c || seen[k]) return false;
    seen[k] = true;
    return true;
  });
}

// Everything "+ เพิ่มสี" needs for the product it was opened from: the
// fields copied to each new color, and which typed colors already exist in
// the group. Siblings come from the full product list (same productGroupKey),
// not the on-screen rows, so a search that hides some colors can't let a
// duplicate through.
// inline = the source's สี field is empty, its color is still a "สีXXX" word
// in the name and it isn't grouped with anything yet: saving first moves
// that color into the field (base/label are the split name/color) so the
// source and the new colors share a name and group together.
Dashboard.prototype.addColorContext = function () {
  var s = this.state;
  var products = this.getMergedProducts();
  var source = products.find(function (p) { return p.id === s.addColorSourceId; });
  if (!source) return null;
  var key = productGroupKey(source);
  var split = String(source.color || "").trim() ? null : splitInlineColor(source.name);
  if (split && !(key && products.some(function (p) { return p.id !== source.id && productGroupKey(p) === key; }))) {
    // dup = a product in the category already has this name + color, at any
    // price, counting colors still inline in a name (incl. the source's own)
    var taken = {};
    products.forEach(function (p) {
      if (p.cat !== source.cat) return;
      var pc = String(p.color || "").trim();
      var parts = pc ? { name: p.name, color: pc } : splitInlineColor(p.name);
      if (parts) taken[(parts.name + "\u0001" + parts.color).toLowerCase()] = true;
    });
    var inlineColors = parseColorList(s.addColorInput).map(function (c) {
      return { color: c, dup: !!taken[(split.name + "\u0001" + c).toLowerCase()] };
    });
    return { source: source, base: split.name, label: split.color, inline: true, colors: inlineColors };
  }
  var existing = {};
  products.forEach(function (p) {
    if (p.id === source.id || (key && productGroupKey(p) === key)) existing[productColorParts(p).label.toLowerCase()] = true;
  });
  var colors = parseColorList(s.addColorInput).map(function (c) {
    return { color: c, dup: !!existing[c.toLowerCase()] };
  });
  return { source: source, base: productColorParts(source).base, colors: colors };
};

// Creates one product per new color, copying name/category/subcategory/
// prices/unit/VAT from the source so it lands in the same color group
// (note and image start empty). Duplicates were already flagged in the form
// and are skipped here; the group is left expanded so the new colors show.
// In inline mode the source's color is moved out of its name first; if that
// fails nothing is created.
Dashboard.prototype.saveAddColors = function () {
  var ctx = this.addColorContext();
  if (!ctx || this.state.addColorSaving) return;
  var fresh = ctx.colors.filter(function (c) { return !c.dup; }).map(function (c) { return c.color; });
  var dups = ctx.colors.filter(function (c) { return c.dup; }).map(function (c) { return c.color; });
  if (!fresh.length) {
    this.setState({ addColorError: dups.length ? "ทุกสีที่กรอกมีอยู่ในกลุ่มแล้ว: " + dups.join(", ") : "กรุณากรอกสีอย่างน้อย 1 สี" });
    return;
  }
  var src = ctx.source;
  var self = this;
  this.setState({ addColorSaving: true, addColorError: "" });
  var created = [];
  var failed = [];
  var moveSource = !ctx.inline ? Promise.resolve() :
    apiRequest("/products/" + encodeURIComponent(src.id), { method: "PUT", auth: true, body: { name: ctx.base, color: ctx.label } })
      .then(function (p) {
        src = p;
        self.setState(function (s2) { return { products: s2.products.map(function (x) { return x.id === p.id ? p : x; }) }; });
      });
  moveSource.then(function () {
    return fresh.reduce(function (chain, color) {
      return chain.then(function () {
        var body = {
          cat: src.cat, subcat: src.subcat || "", name: ctx.base, sku: "", color: color,
          price: src.price, oldPrice: src.oldPrice == null ? null : src.oldPrice,
          price2: src.price2 == null ? null : src.price2, price3: src.price3 == null ? null : src.price3,
          unit: src.unit, stock: 0, vat: src.vat || "vat", image: "", note: "",
        };
        return apiRequest("/products", { method: "POST", auth: true, body: body })
          .then(function (p) { created.push(p); }, function (err) { failed.push(color + " (" + err.message + ")"); });
      });
    }, Promise.resolve()).then(function () {
      self.setState(function (s2) {
        var products = s2.products.concat(created);
        var key = productGroupKey(src);
        var ids = products.filter(function (p) { return productGroupKey(p) === key; }).map(function (p) { return p.id; }).sort();
        var expanded = Object.assign({}, s2.expandedProductGroups);
        if (ids.length > 1) expanded["g:" + ids[0]] = true;
        var patch = { products: products, expandedProductGroups: expanded, addColorSaving: false };
        if (failed.length) {
          patch.addColorError = "บันทึกไม่สำเร็จ " + failed.length + " สี: " + failed.join(", ");
          // keep only the colors that still need saving in the box
          patch.addColorInput = fresh.filter(function (c) { return !created.some(function (p) { return p.color === c; }); }).join(", ");
        } else {
          patch.addColorSourceId = null;
          patch.addColorInput = "";
          patch.addColorError = "";
        }
        return patch;
      });
      if (created.length) {
        self.showToast("เพิ่ม " + created.length + " สีแล้ว" + (dups.length ? " · ข้ามสีที่ซ้ำ: " + dups.join(", ") : ""), dups.length ? "warn" : "success");
      }
    });
  }, function (err) {
    self.setState({ addColorSaving: false, addColorError: "ย้ายสีเดิมออกจากชื่อไม่สำเร็จ ยังไม่ได้เพิ่มสีใหม่: " + err.message });
  });
};

// Products in the selected category whose สี field is empty but whose
// name still has "สีXXX" in it, with the name/color they'd split into.
// dup = another product in the category already has that name + color
// (the Excel upsert matches on the pair), so it's listed but not saved.
Dashboard.prototype.colorSplitCandidates = function () {
  var s = this.state;
  if (s.category === "all") return [];
  var products = this.getMergedProducts().filter(function (p) { return p.cat === s.category; });
  var taken = {};
  products.forEach(function (p) { taken[(p.name + "\u0001" + (p.color || "")).toLowerCase()] = true; });
  var out = [];
  products.forEach(function (p) {
    if (String(p.color || "").trim()) return;
    var split = splitInlineColor(p.name);
    if (!split) return;
    var k = (split.name + "\u0001" + split.color).toLowerCase();
    out.push({ id: p.id, oldName: p.name, name: split.name, color: split.color, dup: !!taken[k] });
    taken[k] = true;
  });
  return out.sort(function (a, b) { return a.oldName.localeCompare(b.oldName, "th"); });
};

// Moves the color out of each ticked product's name into its สี field, one
// PUT at a time; failures stay in the panel to retry.
Dashboard.prototype.saveColorSplit = function () {
  var s = this.state;
  if (s.colorSplitSaving) return;
  var todo = this.colorSplitCandidates().filter(function (c) { return !c.dup && !s.colorSplitSkip[c.id]; });
  if (!todo.length) return;
  var self = this;
  this.setState({ colorSplitSaving: true });
  var updated = [];
  var failed = [];
  todo.reduce(function (chain, c) {
    return chain.then(function () {
      return apiRequest("/products/" + encodeURIComponent(c.id), { method: "PUT", auth: true, body: { name: c.name, color: c.color } })
        .then(function (p) { updated.push(p); }, function (err) { failed.push(c.oldName + " (" + err.message + ")"); });
    });
  }, Promise.resolve()).then(function () {
    self.setState(function (s2) {
      var byId = {};
      updated.forEach(function (p) { byId[p.id] = p; });
      return {
        products: s2.products.map(function (p) { return byId[p.id] || p; }),
        colorSplitSaving: false,
        colorSplitOpen: failed.length > 0,
      };
    });
    if (failed.length) self.setState({ importMsg: "แยกสีไม่สำเร็จ " + failed.length + " รายการ", importErrors: failed, importMsgType: "error" });
    if (updated.length) self.showToast("แยกสีออกจากชื่อแล้ว " + updated.length + " รายการ");
  });
};

// Products in the selected category whose สี field is exactly one of
// NON_COLOR_WORDS (split out by mistake earlier), with the name they'd get
// back. dup = that name with an empty สี already exists in the category, so
// it's listed but not saved.
Dashboard.prototype.colorRestoreCandidates = function () {
  var s = this.state;
  if (s.category === "all") return [];
  var products = this.getMergedProducts().filter(function (p) { return p.cat === s.category; });
  var taken = {};
  products.forEach(function (p) { taken[(p.name + "\u0001" + (p.color || "")).toLowerCase()] = true; });
  var out = [];
  products.forEach(function (p) {
    var word = String(p.color || "").trim();
    if (NON_COLOR_WORDS.indexOf(word) === -1) return;
    var name = nameWithColorWord(p.name, word);
    var k = (name + "\u0001").toLowerCase();
    out.push({ id: p.id, oldName: p.name, word: word, name: name, dup: !!taken[k] });
    taken[k] = true;
  });
  return out.sort(function (a, b) { return a.oldName.localeCompare(b.oldName, "th"); });
};

// Writes each ticked product back as { name: <with สี<word>>, color: "" },
// one PUT at a time like saveColorSplit; failures stay listed to retry.

        .then(function (p) { updated.push(p); }, function (err) { failed.push(c.oldName + " (" + err.message + ")"); });
    });
  }, Promise.resolve()).then(function () {

      var byId = {};
      updated.forEach(function (p) { byId[p.id] = p; });

      };

    if (updated.length) self.showToast("คืนสีเข้าชื่อแล้ว " + updated.length + " รายการ" + (failed.length ? " · ไม่สำเร็จ " + failed.length + " รายการ" : ""), failed.length ? "warn" : "success");
    else if (failed.length) self.showToast("คืนสีเข้าชื่อไม่สำเร็จ " + failed.length + " รายการ", "error");

// Small icon-only "share" button shared by every PDF file card (folder
// pages + Company Profile, grid + list view). `radius` matches whichever
// border-radius the surrounding buttons in that card use; `busy` swaps the
// icon for a spinner and disables the button while a share is in flight, so
// a slow fetch on a large PDF can't be double-tapped.
function shareButtonHtml(fileId, name, radius, busy) {
  return '<button type="button" class="pdf-share-btn" data-action="share-file" data-file-id="' + fileId + '" data-name="' + esc(name) + '"' +
    (busy ? " disabled" : "") +

    (busy ? '<span class="pdf-share-spinner"></span>' : SHARE_ICON_SVG) +

// The server already serves this URL with Content-Type: application/pdf and
// Content-Disposition: inline, so opening it directly shows the real PDF at
// its own address (dashboard.html:104 API_BASE) - no need to fetch it into a
// blob: URL first, which just replaces that address with a temporary
// "blob:..." one in the tab.
Dashboard.prototype.viewFile = function (fileId) {
  window.open(API_BASE + "/files/" + encodeURIComponent(fileId), "_blank");
};

// Mobile browsers (iOS Safari especially) often ignore the server's
// Content-Disposition: attachment header for a cross-origin PDF link and
// just open it inline instead of downloading it. Fetching the bytes
// ourselves and saving them as a same-origin blob URL makes the `download`
// attribute reliable everywhere.
//
// This deliberately always saves the file rather than routing through
// navigator.share: some apps (LINE included) don't accept files shared from
// a web page at all, even though they work fine when shared from the
// Files app after being saved - so a plain download is the one flow that
// reliably works everywhere.
Dashboard.prototype.downloadFile = function (fileId, fileName) {
  var self = this;
  var name = fileName || "document.pdf";
  if (!/\.pdf$/i.test(name)) name += ".pdf";
  fetchFileBlob(fileId)
    .then(function (blob) {
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = blobUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 10000);
    })
    .catch(function () {
      // Fall back to a plain navigation so the file is at least viewable.
      window.open(API_BASE + "/files/" + encodeURIComponent(fileId) + "?dl=1", "_blank");
      self.showToast("ดาวน์โหลดไม่สำเร็จ กำลังเปิดไฟล์แทน", "error");
    });
};

// A separate, explicit "แชร์" action (distinct from the always-download
// button above): fetches the PDF bytes into a real File and hands it to
// navigator.share as `files` only - no url/text/title - so the OS share
// sheet attaches the actual PDF instead of a page link, and the shared
// filename is the real one instead of "Unknown.pdf". Falls back to a plain
// download when the browser can't share files at all (most desktops).
Dashboard.prototype.shareFile = function (fileId, fileName) {
  var self = this;
  if (this.state.sharingFileId) return; // already fetching a share (e.g. a large PDF) - ignore repeat taps
  var name = fileName || "document.pdf";
  if (!/\.pdf$/i.test(name)) name += ".pdf";

  this.setState({ sharingFileId: fileId });

  fetchFileBlob(fileId)
    .then(function (blob) {
      var file = new File([blob], name, { type: "application/pdf" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        return navigator.share({ files: [file] }).catch(function (err) {
          if (err && err.name === "AbortError") return; // user closed the share sheet
          self.showToast("แชร์ไฟล์ไม่สำเร็จ", "error");
        });
      }

      // No file-sharing support - download it instead so the button still
      // does something useful, and say so since the user asked to share.
      var blobUrl = URL.createObjectURL(file);
      var a = document.createElement("a");
      a.href = blobUrl;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 10000);
      self.showToast("เบราว์เซอร์นี้ไม่รองรับการแชร์ไฟล์ ดาวน์โหลดไฟล์ให้แทนแล้ว");
    })
    .catch(function () {
      self.showToast("แชร์ไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง", "error");
    })
    .then(function () {
      self.setState({ sharingFileId: null });
    });
};

    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
