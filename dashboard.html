        '<button type="button" data-action="close-download-modal" style="min-height:44px; display:inline-flex; align-items:center;padding:12px 20px; border:1px solid oklch(0.85 0.01 60); background:#fff; color:var(--text-body); border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;">ยกเลิก</button>' +
        '<button type="button" data-action="confirm-download-products" style="min-height:44px; display:inline-flex; align-items:center;padding:12px 20px; border:none; background:var(--navy-action); color:#fff; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;">ดาวน์โหลด</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};

Dashboard.prototype.downloadProductsExcel = function () {
  var self = this;
  var s = this.state;
  var catValue = s.downloadCategory || "all";
  var subcatValue = catValue === "all" ? "" : (s.downloadSubcat || "");
  var products = s.products.filter(function (p) {
    return (catValue === "all" || p.cat === catValue) && (!subcatValue || (p.subcat || "") === subcatValue);
  });

  var wb = new ExcelJS.Workbook();
  var ws = wb.addWorksheet("สินค้า");
  ws.addRow(IMPORT_HEADERS);
  products.forEach(function (p) {
    ws.addRow([
      p.name,
      self.catLabel(p.cat),
      p.subcat || "",
      p.price,
      p.price2 != null ? p.price2 : "",
      p.price3 != null ? p.price3 : "",
      p.unit,
      p.color || "",
      p.vat === "novat" ? "NOVAT" : "VAT",
      p.stock != null ? p.stock : 0,
    ]);
  });
  ws.columns.forEach(function (col) { col.width = 20; });

  var catLabelForName = catValue === "all" ? "ทั้งหมด" : self.catLabel(catValue) + (subcatValue ? "_" + subcatValue : "");
  var filename = "สินค้า_" + sanitizeFilenamePart(catLabelForName) + "_" + formatDateYMD(new Date()) + ".xlsx";

  wb.xlsx.writeBuffer().then(function (buffer) {
    var blob = new Blob([buffer], { type: "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
};

// Sends the parsed rows to the server and reports the result -- shared by
// the direct (no new-subcat) import path and both choices on the "new
// subcategory found" confirmation modal.
Dashboard.prototype._finishExcelImport = function (newProducts, errors) {
  var self = this;
  if (newProducts.length) {
    apiRequest("/products/bulk", { method: "POST", auth: true, body: newProducts })
      .then(function (result) {
        self.setState(function (s2) {
          var updatedIds = result.updated.map(function (p) { return p.id; });
          var products = s2.products
            .filter(function (p) { return updatedIds.indexOf(p.id) === -1; })
            .concat(result.updated, result.created);
          var parts = [];
          if (result.created.length) parts.push("เพิ่มใหม่ " + result.created.length + " รายการ");
          if (result.updated.length) parts.push("แก้ไข " + result.updated.length + " รายการ (ชื่อซ้ำ)");
          var msg = "นำเข้าสำเร็จ: " + parts.join(", ") + (errors.length ? " (ข้าม " + errors.length + " แถวที่ไม่ถูกต้อง)" : "");
          return { products: products, importMsg: msg, importMsgType: errors.length ? "warn" : "success", importErrors: errors };
        });
        self.showToast("นำเข้าข้อมูลสำเร็จ", "success");
      })
      .catch(function (err) {
        self.setState({ importMsg: "นำเข้าไม่สำเร็จ: " + err.message, importMsgType: "error", importErrors: errors });
      });
  } else {
    self.setState({ importMsg: "ไม่พบข้อมูลสินค้าที่ถูกต้องในไฟล์", importMsgType: "error", importErrors: errors });
  }
};

Dashboard.prototype.importExcelFile = function (file) {
  var self = this;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = new Uint8Array(reader.result);
      var wb = XLSX.read(data, { type: "array" });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      var newProducts = [];
      var pendingItems = []; // rows using a subcat that doesn't exist anywhere yet -- held for confirmation
      var errors = [];

      // Which category(ies) each subcategory label already belongs to, going
      // by the products currently loaded (there's no master subcategory
      // table -- same source subcatOptionsFor uses). A label absent here is
      // "new"; one present under a different cat than the row's is a conflict.
      var subcatToCats = {};
      self.state.products.forEach(function (p) {
        if (!p.subcat) return;
        if (!subcatToCats[p.subcat]) subcatToCats[p.subcat] = {};
        subcatToCats[p.subcat][p.cat] = true;
      });

      rows.forEach(function (row, i) {
        var rowNum = i + 2;
        var name = String(row["ชื่อสินค้า"] || "").trim();
        var catRaw = String(row["หมวดหมู่"] || "").trim();
        // Older template files simply don't have this column, so this reads
        // as "" for them -- same as leaving it blank on the current one.
        var subcatRaw = String(row["หมวดหมู่ย่อย"] || "").trim();
        var priceRaw = row["ช่อง 1"];
        var unit = String(row["หน่วย"] || "").trim();
        // Optional; also missing entirely from files made before the สี column.
        var color = String(row["สี"] || "").trim();
        if (!name && !catRaw && !unit && (priceRaw === "" || priceRaw == null)) return;

        var price = parseFloat(priceRaw);
        var cat = self.state.categories.some(function (c) { return c.value === catRaw; }) ? catRaw : self.catValueByLabel(catRaw);
        var errs = [];
        if (!name) errs.push("ไม่มีชื่อสินค้า");
        if (!cat) errs.push('หมวดหมู่ไม่ถูกต้อง ("' + catRaw + '")');
        if (isNaN(price) || price < 0) errs.push("ราคาไม่ถูกต้อง");
        if (!unit) errs.push("ไม่มีหน่วยนับ");

        var subcatIsNew = false;
        if (!errs.length && subcatRaw) {
          var ownerCats = subcatToCats[subcatRaw];
          if (ownerCats && !ownerCats[cat]) {
            var ownerLabels = Object.keys(ownerCats).map(function (cv) { return self.catLabel(cv); }).join(", ");
            errs.push('หมวดหมู่ย่อย "' + subcatRaw + '" มีอยู่แล้วภายใต้หมวดหมู่อื่น (' + ownerLabels + ') ไม่ใช่ "' + self.catLabel(cat) + '"');
          } else if (!ownerCats) {
            subcatIsNew = true;
          }
        }

        if (errs.length) { errors.push("แถว " + rowNum + ": " + errs.join(", ")); return; }

        var price2Raw = row["ช่อง 2"];
        var price2 = (price2Raw !== "" && price2Raw != null) ? parseFloat(price2Raw) : null;
        if (price2 != null && isNaN(price2)) price2 = null;
        var price3Raw = row["ช่อง 3"];
        var price3 = (price3Raw !== "" && price3Raw != null) ? parseFloat(price3Raw) : null;
        if (price3 != null && isNaN(price3)) price3 = null;
        var vatRaw = String(row["ภาษี"] || "").trim().toLowerCase();
        var vat = (vatRaw === "novat" || vatRaw === "no vat") ? "novat" : "vat";
        var stock = parseInt(row["สต็อก"], 10); if (isNaN(stock) || stock < 0) stock = 0;

        var product = {
          cat: cat, subcat: subcatRaw, name: name, sku: "",
          price: price, oldPrice: null, price2: price2, price3: price3, unit: unit, color: color, stock: stock, vat: vat, image: "",
        };

        if (subcatIsNew) pendingItems.push({ rowNum: rowNum, product: product, subcat: subcatRaw, catLabel: self.catLabel(cat) });
        else newProducts.push(product);
      });

      if (pendingItems.length) {
        var comboMap = {};
        pendingItems.forEach(function (item) {
          var key = item.catLabel + "|||" + item.subcat;
          if (!comboMap[key]) comboMap[key] = { catLabel: item.catLabel, subcat: item.subcat, count: 0 };
          comboMap[key].count++;
        });
        self.setState({
          importSubcatConfirm: {
            readyProducts: newProducts,
            pendingItems: pendingItems,
            combos: Object.keys(comboMap).map(function (k) { return comboMap[k]; }),
            errors: errors,
          },
        });
        return;
      }

      self._finishExcelImport(newProducts, errors);
    } catch (e) {
      self.setState({ importMsg: "ไม่สามารถอ่านไฟล์ได้ กรุณาตรวจสอบว่าเป็นไฟล์ Excel (.xlsx) ที่ถูกต้อง", importMsgType: "error", importErrors: [] });
    }
  };
  reader.readAsArrayBuffer(file);
};

/* ---- folders (concrete / tis, shared logic) ---- */

Dashboard.prototype._folderKeys = function (kind) {
  var map = {
    concrete: { stateKey: "concreteFolders", activeKey: "activeConcreteFolderId", nameKey: "newConcreteFolderName", loadingKey: "concreteFoldersLoading", errorKey: "concreteFoldersError", searchKey: "concreteFileSearch", viewKey: "concreteFileView" },
    tis: { stateKey: "tisFolders", activeKey: "activeTisFolderId", nameKey: "newTisFolderName", loadingKey: "tisFoldersLoading", errorKey: "tisFoldersError", searchKey: "tisFileSearch", viewKey: "tisFileView" },
    company: { stateKey: "companyFolders", activeKey: "activeCompanyFolderId", nameKey: "newCompanyFolderName", loadingKey: "companyFoldersLoading", errorKey: "companyFoldersError", searchKey: "companyFileSearch", viewKey: "companyFileView" },
    catalog: { stateKey: "catalogFolders", activeKey: "activeCatalogFolderId", nameKey: "newCatalogFolderName", loadingKey: "catalogFoldersLoading", errorKey: "catalogFoldersError", searchKey: "catalogFileSearch", viewKey: "catalogFileView" },
    mit: { stateKey: "mitFolders", activeKey: "activeMitFolderId", nameKey: "newMitFolderName", loadingKey: "mitFoldersLoading", errorKey: "mitFoldersError", searchKey: "mitFileSearch", viewKey: "mitFileView" },
  };
  return map[kind];
};

// Folders are kept as a flat array; nesting is expressed via parentId
// (null = top level). These walk that flat list.
function folderChildren(folders, parentId) {
  return folders.filter(function (f) { return (f.parentId || null) === (parentId || null); });
}

// Root-first chain of folders ending at `id` (empty if not found).
function folderPath(folders, id) {
  var path = [];
  var seen = {};
  var cur = folders.find(function (f) { return f.id === id; });
  while (cur && !seen[cur.id]) {
    seen[cur.id] = true;
    path.unshift(cur);
    var pid = cur.parentId;
    cur = pid ? folders.find(function (f) { return f.id === pid; }) : null;
  }
  return path;
}

// `id` plus the ids of every folder nested under it, at any depth.
function folderSubtreeIds(folders, id) {
  var ids = [id];
  for (var i = 0; i < ids.length; i++) {
    folderChildren(folders, ids[i]).forEach(function (f) {
      if (ids.indexOf(f.id) === -1) ids.push(f.id);
    });
  }
  return ids;
}

Dashboard.prototype.addFolder = function (kind) {
  var k = this._folderKeys(kind);
  var name = (this.state[k.nameKey] || "").trim();
  if (!name) return;
  var parentId = this.state[k.activeKey] || null;
  var self = this;
  var body = { kind: kind, name: name };
  if (parentId) body.parentId = parentId;
  apiRequest("/folders", { method: "POST", auth: true, body: body })
    .then(function (folder) {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].concat([Object.assign({ parentId: parentId }, folder)]);
        patch[k.nameKey] = "";
        return patch;
      });
    })
    .catch(function (err) {
      var patch = {};
      patch[k.errorKey] = "เพิ่มโฟลเดอร์ไม่สำเร็จ: " + err.message;
      self.setState(patch);
    });
};

Dashboard.prototype.removeFolder = function (kind, id) {
  var k = this._folderKeys(kind);
  var self = this;
  apiRequest("/folders/" + encodeURIComponent(id), { method: "DELETE", auth: true })
    .then(function () {
      self.setState(function (s) {
        var folders = s[k.stateKey];
        var removed = folderSubtreeIds(folders, id);
        var target = folders.find(function (f) { return f.id === id; });
        var patch = {};
        patch[k.stateKey] = folders.filter(function (f) { return removed.indexOf(f.id) === -1; });
        // If we were inside the deleted folder (or anything under it), step
        // back out to the deleted folder's parent.
        if (removed.indexOf(s[k.activeKey]) !== -1) {
          patch[k.activeKey] = (target && target.parentId) || null;
          patch[k.searchKey] = "";
        }
        return patch;
      });
    })
    .catch(function (err) {
      var patch = {};
      patch[k.errorKey] = "ลบโฟลเดอร์ไม่สำเร็จ: " + err.message;
      self.setState(patch);
    });
};

Dashboard.prototype.moveFolder = function () {
  var mv = this.state.folderMove;
  if (!mv || mv.saving || mv.targetId === null) return;
  var k = this._folderKeys(mv.kind);
  var self = this;
  var parentId = mv.targetId || null;
  var target = parentId ? this.state[k.stateKey].find(function (f) { return f.id === parentId; }) : null;
  var targetName = target ? target.name : "ชั้นบนสุด";
  this.setState({ folderMove: Object.assign({}, mv, { saving: true, error: "" }) });
  apiRequest("/folders/" + encodeURIComponent(mv.id), { method: "PUT", auth: true, body: { parentId: parentId } })
    .then(function (updated) {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].map(function (f) {
          return f.id === mv.id ? Object.assign({}, f, { parentId: updated.parentId || null }) : f;
        });
        patch.folderMove = null;
        return patch;
      });
      self.showToast('ย้าย "' + mv.name + '" ไปไว้ใน "' + targetName + '" แล้ว');
    })
    .catch(function (err) {
      self.setState(function (s) {
        if (!s.folderMove || s.folderMove.id !== mv.id) return {};
        return { folderMove: Object.assign({}, s.folderMove, { saving: false, error: "ย้ายโฟลเดอร์ไม่สำเร็จ: " + err.message }) };
      });
    });
};

Dashboard.prototype.startEditFolder = function (kind, id, name) {
  this.setState({ editingFolderId: id, editFolderKind: kind, editFolderName: name, folderEditError: "" });
};

Dashboard.prototype.cancelEditFolder = function () {
  this.setState({ editingFolderId: null, editFolderKind: "", editFolderName: "", folderEditError: "" });
};

Dashboard.prototype.saveEditFolder = function (kind, id) {
  var name = this.state.editFolderName.trim();
  if (!name) { this.setState({ folderEditError: "กรุณากรอกชื่อโฟลเดอร์" }); return; }
  var k = this._folderKeys(kind);
  var self = this;
  apiRequest("/folders/" + encodeURIComponent(id), { method: "PUT", auth: true, body: { name: name } })
    .then(function (updated) {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].map(function (f) {
          return f.id === id ? Object.assign({}, f, { name: updated.name }) : f;
        });
        patch.editingFolderId = null;
        patch.editFolderKind = "";
        patch.editFolderName = "";
        patch.folderEditError = "";
        return patch;
      });
    })
    .catch(function (err) {
      self.setState({ folderEditError: "แก้ไขชื่อโฟลเดอร์ไม่สำเร็จ: " + err.message });
    });
};

Dashboard.prototype.startEditFile = function (kind, folderId, fileId, name) {
  this.setState({ editingFileId: fileId, editFileKind: kind, editFileFolderId: folderId, editFileName: name, fileEditError: "" });
};

Dashboard.prototype.cancelEditFile = function () {
  this.setState({ editingFileId: null, editFileKind: "", editFileFolderId: "", editFileName: "", fileEditError: "" });
};

Dashboard.prototype.saveEditFile = function (kind, folderId, fileId) {
  var name = this.state.editFileName.trim();
  if (!name) { this.setState({ fileEditError: "กรุณากรอกชื่อไฟล์" }); return; }
  // Keep the ".pdf" suffix even if the admin typed it away while renaming -
  // some share targets (LINE included) filter by file extension.
  if (!/\.pdf$/i.test(name)) name += ".pdf";
  var k = this._folderKeys(kind);
  var self = this;
  apiRequest("/files/" + encodeURIComponent(fileId), { method: "PUT", auth: true, body: { name: name } })
    .then(function (updated) {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].map(function (f) {
          if (f.id !== folderId) return f;
          return Object.assign({}, f, { files: f.files.map(function (x) {
            return x.id === fileId ? Object.assign({}, x, { name: updated.name }) : x;
          }) });
        });
        patch.editingFileId = null;
        patch.editFileKind = "";
        patch.editFileFolderId = "";
        patch.editFileName = "";
        patch.fileEditError = "";
        return patch;
      });
    })
    .catch(function (err) {
      self.setState({ fileEditError: "แก้ไขชื่อไฟล์ไม่สำเร็จ: " + err.message });
    });
};

// Shared by drag-and-drop and the "ย้าย" picker. Only touches state once the
// server confirms; on failure the returned promise rejects and the caller
// shows the error where it belongs.
Dashboard.prototype.moveFile = function (kind, fileId, fromFolderId, toFolderId) {
  var k = this._folderKeys(kind);
  var self = this;
  return apiRequest("/files/" + encodeURIComponent(fileId), { method: "PUT", auth: true, body: { folderId: toFolderId } })
    .then(function () {
      var fileName = "";
      var targetName = "";
      self.setState(function (s) {
        var folders = s[k.stateKey];
        var from = folders.find(function (f) { return f.id === fromFolderId; });
        var file = from && from.files.find(function (x) { return x.id === fileId; });
        var target = folders.find(function (f) { return f.id === toFolderId; });
        targetName = target ? target.name : "";
        if (!file || !target) return {};
        fileName = file.name;
        var patch = {};
        patch[k.stateKey] = folders.map(function (f) {
          if (f.id === fromFolderId) return Object.assign({}, f, { files: f.files.filter(function (x) { return x.id !== fileId; }) });
          if (f.id === toFolderId) return Object.assign({}, f, { files: f.files.concat([file]) });
          return f;
        });
        if (s.editingFileId === fileId) {
          patch.editingFileId = null;
          patch.editFileKind = "";
          patch.editFileFolderId = "";
          patch.editFileName = "";
          patch.fileEditError = "";
        }
        return patch;
      });
      if (fileName) {
        self.showToast('ย้าย "' + fileName + '" ไปไว้ใน "' + targetName + '" แล้ว');
        self._playFolderCardEffect(toFolderId, "drop-success");
      }
    });
};

Dashboard.prototype.confirmMoveFile = function () {
  var mv = this.state.folderMove;
  if (!mv || !mv.fileId || mv.saving || !mv.targetId) return;
  var self = this;
  this.setState({ folderMove: Object.assign({}, mv, { saving: true, error: "" }) });
  this.moveFile(mv.kind, mv.fileId, mv.folderId, mv.targetId)
    .then(function () {
      self.setState(function (s) {
        return s.folderMove && s.folderMove.fileId === mv.fileId ? { folderMove: null } : {};
      });
    })
    .catch(function (err) {
      self.setState(function (s) {
        if (!s.folderMove || s.folderMove.fileId !== mv.fileId) return {};
        return { folderMove: Object.assign({}, s.folderMove, { saving: false, error: "ย้ายไฟล์ไม่สำเร็จ: " + err.message }) };
      });
    });
};

/* ---- drag a file onto a subfolder card ----
   The page re-renders wholesale on setState, which would destroy the dragged
   row, so everything during a drag lives on the instance (this._dragFile,
   this._dropCard) and on DOM classes. render() is held off while dragging. */

Dashboard.prototype.handleFileDragStart = function (e) {
  var el = e.target.closest && e.target.closest('[draggable="true"][data-file-id]');
  if (!el || !this.isAdmin() || el.classList.contains("file-moving")) return;
  this._dragFile = { kind: el.dataset.kind, fileId: el.dataset.fileId, folderId: el.dataset.folderId, el: el };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", el.dataset.fileId); // Firefox won't start a drag without data
  // A small "📕 name" chip follows the cursor instead of a snapshot of the
  // whole row. It only has to exist for this dragstart, so it's built
  // off-screen and thrown away right after.
  if (e.dataTransfer.setDragImage) {
    var chip = document.createElement("div");
    chip.textContent = "📕 " + (el.dataset.name || "");
    chip.style.cssText = "position:fixed; top:-1000px; left:-1000px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; " +
      "padding:8px 14px; background:#fff; color:var(--text-strong); border:1px solid var(--border); border-radius:10px; " +
      "box-shadow:0 8px 20px rgba(0,0,0,.18); font-family:'IBM Plex Sans Thai', sans-serif; font-size:13px; font-weight:600;";
    document.body.appendChild(chip);
    e.dataTransfer.setDragImage(chip, 16, 16);
    setTimeout(function () { chip.remove(); }, 0);
  }
  el.classList.add("dragging-file");
  this.root.classList.add("file-dragging");
};

Dashboard.prototype._fileDropCard = function (e) {
  var drag = this._dragFile;
  if (!drag) return null;
  var card = e.target.closest && e.target.closest(".folder-card");
  if (!card || card.dataset.kind !== drag.kind || card.dataset.id === drag.folderId) return null;
  return card;
};

Dashboard.prototype._setDropCard = function (card) {
  if (this._dropCard === card) return;
  if (this._dropCard) this._dropCard.classList.remove("drop-target");
  this._dropCard = card;
  if (card) card.classList.add("drop-target");
};

// Bound to dragenter as well as dragover: an element whose dragenter isn't
// accepted can leave the browser treating the spot as not droppable, so a
// release right after crossing into a card's icon/text would drop nothing.
Dashboard.prototype.handleFileDragOver = function (e) {
  // Leave anything that isn't our own file drag (e.g. files dragged in from
  // the desktop) to the browser's default handling.
  var card = this._fileDropCard(e);
  if (!card) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  this._setDropCard(card);
};

Dashboard.prototype.handleFileDragLeave = function (e) {
  if (!this._dragFile || !this._dropCard) return;
  var card = e.target.closest && e.target.closest(".folder-card");
  if (card !== this._dropCard) return;
  // Moving between the card's own children fires dragleave too - ignore it.
  if (e.relatedTarget && card.contains(e.relatedTarget)) return;
  this._setDropCard(null);
};

Dashboard.prototype.handleFileDrop = function (e) {
  var card = this._fileDropCard(e);
  if (!card) return;
  e.preventDefault();
  e.stopPropagation();
  var drag = this._dragFile;
  var toFolderId = card.dataset.id;
  // Mark it moving before endFileDrag so a deferred render can't flash the
  // row back in; _applyFileMoving keeps it hidden across any re-render
  // until the API answers.
  this._movingFileIds = this._movingFileIds || {};
  this._movingFileIds[drag.fileId] = true;
  this.endFileDrag();
  this._applyFileMoving();
  var self = this;
  this.moveFile(drag.kind, drag.fileId, drag.folderId, toFolderId).then(function () {
    delete self._movingFileIds[drag.fileId];
  }, function (err) {
    delete self._movingFileIds[drag.fileId];
    self._applyFileMoving();
    self.showToast("ย้ายไฟล์ไม่สำเร็จ: " + err.message, "error");
    self._playFolderCardEffect(toFolderId, "drop-failed");
  });
};

// Re-hides rows whose drop is still waiting on the API (render() rebuilds
// the DOM, so a class alone wouldn't survive), and un-hides the rest.
Dashboard.prototype._applyFileMoving = function () {
  var moving = this._movingFileIds || {};
  var els = this.root.querySelectorAll('[draggable="true"][data-file-id]');
  for (var i = 0; i < els.length; i++) {
    els[i].classList.toggle("file-moving", !!moving[els[i].dataset.fileId]);
  }
};

// One-shot "drop-success" (bounce + green "+1") or "drop-failed" (shake) on
// a folder card. Deferred to the next frame so it lands on the DOM left by
// the last of the re-renders that follow a move (state, toast, modal close);
// cleared on animationend so the next render doesn't replay it. The timer
// is a fallback for when animations are off (reduced motion) and
// animationend never fires.
Dashboard.prototype._playFolderCardEffect = function (folderId, cls) {
  var root = this.root;
  requestAnimationFrame(function () {
    var card = root.querySelector('.folder-card[data-id="' + (window.CSS && CSS.escape ? CSS.escape(folderId) : folderId) + '"]');
    if (!card) return;
    var badge = null;
    if (cls === "drop-success") {
      var count = card.querySelector(".folder-count");
      if (count) {
        badge = document.createElement("span");
        badge.className = "folder-plus-one";
        badge.textContent = "+1";
        count.appendChild(badge);
      }
    }
    card.classList.remove("drop-success", "drop-failed");
    void card.offsetWidth; // restart the animation if it's already playing
    card.classList.add(cls);
    var cardDone = false, badgeDone = !badge, timer;
    var finish = function () {
      if (!cardDone) card.classList.remove(cls);
      if (!badgeDone) badge.remove();
      cardDone = badgeDone = true;
      card.removeEventListener("animationend", onEnd);
      clearTimeout(timer);
    };
    var onEnd = function (e) {
      if (e.target === card && !cardDone) { cardDone = true; card.classList.remove(cls); }
      else if (badge && e.target === badge && !badgeDone) { badgeDone = true; badge.remove(); }
      if (cardDone && badgeDone) finish();
    };
    card.addEventListener("animationend", onEnd);
    timer = setTimeout(finish, 1000);
  });
};

// Runs on dragend (drop, drop outside, Esc) - always clears every trace.
Dashboard.prototype.endFileDrag = function () {
  var drag = this._dragFile;
  if (!drag) return;
  this._setDropCard(null);
  if (drag.el) drag.el.classList.remove("dragging-file");
  this.root.classList.remove("file-dragging");
  this._dragFile = null;
  if (this._renderDeferred) {
    this._renderDeferred = false;
    this.render();
  }
};

Dashboard.prototype.openFolder = function (kind, id) {
  var k = this._folderKeys(kind);
  var patch = {};
  patch[k.activeKey] = id;
  patch[k.searchKey] = "";

};

// "← กลับ" climbs one level: to the parent folder, or the folder list at the top.
Dashboard.prototype.closeFolder = function (kind) {
  var k = this._folderKeys(kind);
  var activeId = this.state[k.activeKey];
  var active = this.state[k.stateKey].find(function (f) { return f.id === activeId; });
  var parentId = active && active.parentId;
  var parentExists = parentId && this.state[k.stateKey].some(function (f) { return f.id === parentId; });
  var patch = {};
  patch[k.activeKey] = parentExists ? parentId : null;
  patch[k.searchKey] = "";
  this.setState(patch);
};

// "company" has no folder-picker UI: the first upload silently creates the
// one implicit folder it stores files in, then uploads into it as usual.
Dashboard.prototype.uploadCompanyFiles = function (fileList) {
  var self = this;
  if (this.state.activeCompanyFolderId) {
    this.uploadFiles("company", fileList);
    return;
  }
  apiRequest("/folders", { method: "POST", auth: true, body: { kind: "company", name: "Company Profile" } })
    .then(function (folder) {
      self.setState(function (s) {
        return { companyFolders: s.companyFolders.concat([folder]), activeCompanyFolderId: folder.id };
      });
      self.uploadFiles("company", fileList);
    })
    .catch(function (err) {
      self.setState({ companyFoldersError: "เตรียมพื้นที่จัดเก็บไฟล์ไม่สำเร็จ: " + err.message });
    });
};

Dashboard.prototype.uploadFiles = function (kind, fileList) {
  var k = this._folderKeys(kind);
  var activeId = this.state[k.activeKey];
  if (!activeId) return;
  var self = this;
  var files = Array.prototype.slice.call(fileList);
  var uploads = files.map(function (file) {
    var form = new FormData();
    form.append("folderId", activeId);
    form.append("kind", kind);
    form.append("file", file, file.name);
    return apiRequest("/files", { method: "POST", auth: true, formData: form });
  });
  Promise.allSettled(uploads).then(function (results) {
    var uploaded = results.filter(function (r) { return r.status === "fulfilled"; }).map(function (r) { return r.value; });
    var failedCount = results.length - uploaded.length;
    self.setState(function (s) {
      var patch = {};
      patch[k.stateKey] = s[k.stateKey].map(function (f) {
        if (f.id !== activeId) return f;
        return Object.assign({}, f, { files: f.files.concat(uploaded) });
      });
      patch[k.errorKey] = failedCount ? "อัปโหลดไม่สำเร็จ " + failedCount + " ไฟล์" : "";
      return patch;
    });
    if (uploaded.length) self.showToast("อัปโหลดสำเร็จ " + uploaded.length + " ไฟล์", "success");
  });
};

Dashboard.prototype.removeFile = function (kind, folderId, fileId) {
  var k = this._folderKeys(kind);
  var self = this;
  apiRequest("/files/" + encodeURIComponent(fileId), { method: "DELETE", auth: true })
    .then(function () {
      self.setState(function (s) {
        var patch = {};
        patch[k.stateKey] = s[k.stateKey].map(function (f) {
          if (f.id !== folderId) return f;
          return Object.assign({}, f, { files: f.files.filter(function (x) { return x.id !== fileId; }) });
        });
        return patch;
      });
    })
    .catch(function (err) {
      var patch = {};
      patch[k.errorKey] = "ลบไฟล์ไม่สำเร็จ: " + err.message;
      self.setState(patch);
    });
};

// Self-service change for the logged-in account (PUT /auth/password). A
// wrong current password comes back as 400, so the session stays put.
Dashboard.prototype.onChangeMyPassword = function () {
  var s = this.state;
  if (!s.myPasswordOpen || s.myPasswordSaving) return;
  var cur = s.myPasswordCurrent, next = s.myPasswordNew, confirm = s.myPasswordConfirm;
  var fail = function (msg) { this.setState({ myPasswordError: msg }); }.bind(this);
  if (!cur || !next || !confirm) return fail("กรุณากรอกให้ครบทุกช่อง");
  if (next.length < 4) return fail("รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร");
  if (next !== confirm) return fail("รหัสผ่านใหม่กับช่องยืนยันไม่ตรงกัน");
  if (next === cur) return fail("รหัสผ่านใหม่ต้องไม่เหมือนรหัสผ่านเดิม");
  var self = this;
  this.setState({ myPasswordSaving: true, myPasswordError: "" });
  apiRequest("/auth/password", { method: "PUT", auth: true, body: { currentPassword: cur, newPassword: next } })
    .then(function () {
      self.closeMyPassword();
      self.showToast("เปลี่ยนรหัสผ่านแล้ว");
    })
    .catch(function (err) {
      if (!self.state.myPasswordOpen) return; // logged out meanwhile (e.g. a 401)
      var msg = err.message === "current password is incorrect" ? "รหัสผ่านเดิมไม่ถูกต้อง" :
        /different/.test(err.message) ? "รหัสผ่านใหม่ต้องไม่เหมือนรหัสผ่านเดิม" :
        /at least 4/.test(err.message) ? "รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัวอักษร" :
        "เปลี่ยนรหัสผ่านไม่สำเร็จ: " + err.message;
      self.setState({ myPasswordSaving: false, myPasswordError: msg });
    });
};

Dashboard.prototype.render = function () {
  // Re-rendering mid-drag would destroy the dragged file row and cancel the
  // drag (e.g. a toast timer firing). Hold the render until endFileDrag.
  if (this._dragFile) { this._renderDeferred = true; return; }
  var active = document.activeElement;
  var focusId = active && active.id ? active.id : null;
  var selStart = active && "selectionStart" in active ? active.selectionStart : null;
  var selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;

  // Inner scroll boxes marked data-keep-scroll="<name>" keep their position
  // across the innerHTML swap below. Only boxes in the DOM right now are
  // remembered, so a box that was closed and reopened starts at the top;
  // names that include what's on show (category, item id) reset when it
  // changes.
  var keptScroll = {};
  var scrollEls = this.root.querySelectorAll("[data-keep-scroll]");
  for (var i = 0; i < scrollEls.length; i++) {
    keptScroll[scrollEls[i].getAttribute("data-keep-scroll")] = { top: scrollEls[i].scrollTop, left: scrollEls[i].scrollLeft };
  }

  this.root.innerHTML = this.state.checkingSession ? this.renderSessionCheck() : (this.state.loggedIn ? this.renderDashboard() : this.renderLogin());
  this._applyFileMoving();

  scrollEls = this.root.querySelectorAll("[data-keep-scroll]");
  for (var j = 0; j < scrollEls.length; j++) {
    var kept = keptScroll[scrollEls[j].getAttribute("data-keep-scroll")];
    if (kept) { scrollEls[j].scrollTop = kept.top; scrollEls[j].scrollLeft = kept.left; }
  }

  if (focusId) {
    var el = document.getElementById(focusId);
    if (el) {
      // preventScroll: the scroll boxes (and the page) are already where
      // they should be; focusing mustn't drag them to the element.
      el.focus({ preventScroll: true });
      if (selStart != null && "setSelectionRange" in el) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
};

Dashboard.prototype.renderCalcOnly = function () {

  if (!container) { this.render(); return; }

  var active = document.activeElement;
  var focusId = active && active.id ? active.id : null;
  var focusSelector = (!focusId && active && active.dataset && active.dataset.calcRow != null)
    ? '[data-calc-row="' + active.dataset.calcRow + '"][data-calc-field="' + active.dataset.calcField + '"][data-calc-store="' + (active.dataset.calcStore || "calcRows") + '"]'
    : null;
  var selStart = active && "selectionStart" in active ? active.selectionStart : null;
  var selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;
  var oldScrollBox = container.querySelector(".list-table");
  var tableScrollLeft = oldScrollBox ? oldScrollBox.scrollLeft : null;
  var pageScrollX = window.scrollX, pageScrollY = window.scrollY;

  container.innerHTML = this.renderCalcPage();

  var el = focusId ? document.getElementById(focusId) : (focusSelector ? container.querySelector(focusSelector) : null);
  if (el) {
    el.focus();
    if (selStart != null && "setSelectionRange" in el) {
      try { el.setSelectionRange(selStart, selEnd); } catch (e) {}

  if (tableScrollLeft != null) {
    var newScrollBox = container.querySelector(".list-table");
    if (newScrollBox) newScrollBox.scrollLeft = tableScrollLeft;
  }
  window.scrollTo(pageScrollX, pageScrollY);
};

Dashboard.prototype.renderMoveFolderModal = function () {
  var s = this.state;
  var mv = s.folderMove;
  if (!mv) return "";
  var k = this._folderKeys(mv.kind);
  var folders = (k && s[k.stateKey]) || [];
  // Same picker moves either a folder (mv.id) or a file (mv.fileId). A file
  // must always live in a folder, so it gets no "ชั้นบนสุด" option, and it
  // can go into any folder of this page except the one it's already in.
  var isFile = !!mv.fileId;
  var moving = isFile ? null : folders.find(function (f) { return f.id === mv.id; });
  var currentParent = isFile ? mv.folderId : ((moving && moving.parentId) || "");
  var excluded = isFile ? [] : folderSubtreeIds(folders, mv.id);

  var option = function (targetId, label, depth) {
    var isCurrent = targetId === currentParent;
    var isSelected = !isCurrent && mv.targetId === targetId;
    var style = 'display:flex; align-items:center; gap:8px; width:100%; box-sizing:border-box; min-height:44px; padding:10px 12px 10px ' + (12 + depth * 20) + 'px; border:none; border-radius:8px; text-align:left; font-size:13.5px; font-family:inherit; ' +
      (isCurrent ? 'background:transparent; color:var(--text-faint); cursor:default;' :
        isSelected ? 'background:var(--navy-action); color:#fff; font-weight:700; cursor:pointer;' :
        'background:transparent; color:var(--text-body); cursor:pointer;');
    var inner = '<span style="flex:1; min-width:0; overflow-wrap:break-word; word-break:break-word;">' + label + '</span>' +
      (isCurrent ? '<span style="flex:none; font-size:11.5px;">อยู่ที่นี่แล้ว</span>' : '');
    if (isCurrent) return '<div style="' + style + '">' + inner + '</div>';
    return '<button type="button" data-action="select-move-target" data-target="' + esc(targetId) + '"' + (mv.saving ? ' disabled' : '') + ' style="' + style + '">' + inner + '</button>';
  };

  var rows = isFile ? [] : [option("", "📂 ชั้นบนสุด", 0)];
  var walk = function (parentId, depth) {
    folderChildren(folders, parentId).forEach(function (f) {
      if (excluded.indexOf(f.id) !== -1) return;
      rows.push(option(f.id, "📁 " + esc(f.name), depth));
      walk(f.id, depth + 1);
    });
  };
  walk(null, isFile ? 0 : 1);

  var canConfirm = (isFile ? !!mv.targetId : mv.targetId !== null) && !mv.saving;
  return '<div style="position:fixed; inset:0; background:rgba(20,15,40,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;">' +
    '<div style="background:#fff; border-radius:16px; padding:24px 22px; max-width:440px; width:100%; max-height:calc(100vh - 40px); box-sizing:border-box; box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:14px;">' +
      '<div style="display:flex; align-items:center; gap:12px;">' +
        '<div style="width:40px; height:40px; border-radius:10px; background:var(--navy-action-soft); display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;">' + (isFile ? '📕' : '📁') + '</div>' +
        '<div style="font-family:\'IBM Plex Sans Thai\'; font-weight:700; font-size:17px; min-width:0; overflow-wrap:break-word; word-break:break-word;">' + (isFile ? 'ย้ายไฟล์' : 'ย้ายโฟลเดอร์') + ' "' + esc(mv.name) + '"</div>' +
      '</div>' +
      '<div style="font-size:13px; color:var(--text-muted);">เลือกโฟลเดอร์ปลายทาง</div>' +
      '<div data-keep-scroll="move-target-' + (isFile ? 'file-' + esc(mv.fileId) : 'folder-' + esc(mv.id)) + '" style="flex:1 1 auto; min-height:0; max-height:50vh; overflow-y:auto; border:1px solid var(--border); border-radius:10px; padding:4px; display:flex; flex-direction:column; gap:2px;">' + rows.join("") + '</div>' +
      (mv.error ? '<div style="font-size:13px; color:var(--danger-red); background:var(--danger-red-bg); padding:8px 12px; border-radius:8px;">' + esc(mv.error) + '</div>' : '') +
      '<div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;">' +
        '<button data-action="cancel-move-folder"' + (mv.saving ? ' disabled' : '') + ' style="min-height:44px; display:inline-flex; align-items:center;padding:12px 20px; border:1px solid oklch(0.85 0.01 60); background:#fff; color:var(--text-body); border-radius:9px; font-size:14px; font-weight:600; cursor:' + (mv.saving ? 'default' : 'pointer') + '; font-family:inherit;">ยกเลิก</button>' +
        '<button data-action="confirm-move-folder"' + (canConfirm ? '' : ' disabled') + ' style="min-height:44px; display:inline-flex; align-items:center;padding:12px 20px; border:none; background:var(--navy-action); color:#fff; border-radius:9px; font-size:14px; font-weight:700; font-family:inherit; cursor:' + (canConfirm ? 'pointer' : 'default') + '; opacity:' + (canConfirm ? '1' : '.5') + ';">' + (mv.saving ? 'กำลังย้าย...' : 'ย้ายมาที่นี่') + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};
